}

// =====================================================================
// Ball + Physics — world-space rolling sphere constrained to the deck.
// =====================================================================
class Ball {
  constructor() { this.p = [0, 0, 0]; this.v = [0, 0, 0]; this.q = [0, 0, 0, 1]; this.w = [0, 0, 0]; this.reset(); }
  reset() {
    this.p.fill(0); this.v.fill(0); this.q[0] = this.q[1] = this.q[2] = 0; this.q[3] = 1; this.w.fill(0);
    this.grounded = true; this.lost = false; this.s = 0; this.u = 0; this.hint = 0; this.air = 0;
    this.boost = 0; this.hop = 0; this.lastPad = -99; this.speed = 0; this.surfY = 0; this.support = true;
  }
}

class Physics {
  constructor(track, ev) { this.T = track; this.ev = ev; this.collapseS = -1e9; this.time = 0; this.tmp = [0, 0, 0, 0]; }

  supported(L) {
    if (L.out || L.s < this.collapseS) return false;
    return this.T.solidAt(L.i, L.t, L.u) >= 0;
  }

  step(b, ix, iy, camYaw, dt) {
    const T = this.T, R = CFG.R, G = CFG.G;
    this.time += dt;
    if (b.lost) {                                  // free fall into the abyss
      if (b.p[1] < b.surfY - 150) { b.v.fill(0); return; }
      b.v[1] -= G * dt; b.v[0] *= 1 - 0.3 * dt; b.v[2] *= 1 - 0.3 * dt;
      b.p[0] += b.v[0] * dt; b.p[1] += b.v[1] * dt; b.p[2] += b.v[2] * dt;
      Q.integrate(b.q, b.w[0], b.w[1], b.w[2], dt);
      return;
    }
    const fx = Math.sin(camYaw), fz = Math.cos(camYaw), rx = -fz, rz = fx;
    const ax = (rx * ix + fx * iy) * CFG.ACC, az = (rz * ix + fz * iy) * CFG.ACC;
    let L = T.locate(b.p[0], b.p[2], b.hint);
    b.hint = L.i;
    b.boost = Math.max(0, b.boost - dt);
    b.hop = Math.max(0, b.hop - dt);

    if (b.grounded) {
      const k = G * 0.714, tb = Math.tan(L.bank);
      const gA = -k * L.slope, gL = -k * tb;
      // No speed cap: the forward push fades with speed (halved at VFADE) but never stops.
      // Braking and steering keep their full strength.
      let iax = ax, iaz = az;
      const sp0 = Math.hypot(b.v[0], b.v[2]);
      if (sp0 > 0.5) {
        const ux = b.v[0] / sp0, uz = b.v[2] / sp0, along = iax * ux + iaz * uz;
        if (along > 0) { const cut = along * sp0 * sp0 / (CFG.VFADE * CFG.VFADE + sp0 * sp0); iax -= ux * cut; iaz -= uz * cut; }
      }
      b.v[0] += (iax + L.fx * gA + L.rx * gL) * dt;
      b.v[2] += (iaz + L.fz * gA + L.rz * gL) * dt;
      // rolling resistance: stronger when slow (so the ball settles), light at speed
      const sp = Math.hypot(b.v[0], b.v[2]);
      const damp = 1 - (0.05 + 0.2 * Math.exp(-sp / 6) + (Math.abs(ix) + Math.abs(iy) < 0.05 && sp < 1.2 ? 1.4 : 0)) * dt;
      b.v[0] *= damp; b.v[2] *= damp;
      const py = b.p[1];
      b.p[0] += b.v[0] * dt; b.p[2] += b.v[2] * dt;
      L = T.locate(b.p[0], b.p[2], b.hint); b.hint = L.i;
      this.rails(b, L);
      this.props(b, L);
      if (!b.grounded) { /* jumped a safety rail: the airborne branch takes over */ } else if (this.supported(L)) {
        b.p[1] = T.surfaceY(L, L.u) + R;
        b.v[1] = clamp((b.p[1] - py) / dt, -30, 30);
        const m = L.i & T.mask;
        if ((T.rowF[m] & RF.BOOST) && Math.abs(L.i - b.lastPad) > 8) {
          b.lastPad = L.i;
          // boosters also steady the ball: half of the sideways drift is removed
          const vf = b.v[0] * L.fx + b.v[2] * L.fz, vl = b.v[0] * L.rx + b.v[2] * L.rz;
          const add = Math.max(0, Math.max(CFG.VBOOST, vf + 5) - vf);
          b.v[0] += L.fx * add - L.rx * vl * 0.5; b.v[2] += L.fz * add - L.rz * vl * 0.5; b.boost = 1.3;
          this.ev.boost(b);
        }
      } else {
        b.grounded = false; b.air = 0;
      }
    } else {
      b.air += dt;
      b.v[1] -= G * dt;
      b.p[0] += b.v[0] * dt; b.p[1] += b.v[1] * dt; b.p[2] += b.v[2] * dt;
      L = T.locate(b.p[0], b.p[2], b.hint); b.hint = L.i;
      const sy = T.surfaceY(L, L.u);
      if (b.p[1] - R <= sy + 0.02 && b.v[1] <= 0 && this.supported(L)) {
        const depth = sy - (b.p[1] - R);
        if (depth < R * 1.05) {                      // forgiving: catch the lip if the center is still above it
          b.p[1] = sy + R;
          const imp = -b.v[1];
          if (imp > 5) { b.v[1] = imp * 0.26; } else { b.v[1] = 0; b.grounded = true; }
          this.ev.land(b, imp);
        } else { b.lost = true; this.ev.lost(b, 'side'); }
      } else if (b.p[1] < sy - 1.1) { b.lost = true; this.ev.lost(b, 'fall'); }
      this.rails(b, L);
    }
    // rolling without slipping: w = (n x v) / R
    if (b.grounded) { b.w[0] = b.v[2] / R; b.w[1] = 0; b.w[2] = -b.v[0] / R; }
    Q.integrate(b.q, b.w[0], b.w[1], b.w[2], dt);
    b.s = L.s; b.u = L.u; b.surfY = T.surfaceY(L, L.u);
    b.support = this.supported(L);
    b.speed = Math.hypot(b.v[0], b.v[2]);
    for (let j = 0; j < 3; j++) if (!Number.isFinite(b.p[j]) || !Number.isFinite(b.v[j])) { b.v.fill(0); b.p[j] = fin(b.p[j]); b.lost = true; }
  }

  // Real rails (tall, on some bends) always hold. Small safety rails (kid mode, star power)
  // hold gentle bumps only: hit them too hard and the ball jumps over.
  rails(b, L) {
    const T = this.T, m = L.i & T.mask, real = T.rowF[m] & (RF.RAIL_L | RF.RAIL_R);
    const f = real | (this.kid || this.star ? RF.RAIL_L | RF.RAIL_R : 0);
    if (!f || b.p[1] > b.surfY + 1.2) return;
    const hw = L.w / 2 - 0.1, R = CFG.R;
    const n = T.rowN[m]; if (!n) return;
    let side = 0, pen = 0;
    if ((f & RF.RAIL_R) && T.rowBO[m * 3 + n - 1] && L.u + R > hw) { side = 1; pen = L.u + R - hw; }
    if ((f & RF.RAIL_L) && T.rowAO[m * 3] && L.u - R < -hw) { side = -1; pen = -hw - (L.u - R); }
    if (!side || pen > 0.6) return;
    const soft = !(real & (side > 0 ? RF.RAIL_R : RF.RAIL_L));
    if (soft && (b.hop > 0 || !b.grounded)) return;       // already jumping over it
    const nx = -L.rx * side, nz = -L.rz * side;        // normal pointing back to the track
    const vn = b.v[0] * nx + b.v[2] * nz;
    if (soft && -vn > CFG.RAIL_BREAK) {
      b.hop = 0.6; b.grounded = false; b.air = 0; b.v[1] = 2 + (-vn - CFG.RAIL_BREAK) * 0.25;
      this.ev.railJump(b, -vn, [b.p[0] - nx * CFG.R, b.p[1], b.p[2] - nz * CFG.R]);
      return;
    }
    b.p[0] += nx * pen; b.p[2] += nz * pen;
    if (vn < 0) {
      b.v[0] -= nx * vn * 1.38; b.v[2] -= nz * vn * 1.38;
      b.v[0] *= 0.97; b.v[2] *= 0.97;
      if (-vn > 0.8) this.ev.hit(b, -vn, [b.p[0] - nx * CFG.R, b.p[1], b.p[2] - nz * CFG.R]);
    }
  }

  props(b, L) {
    const T = this.T, R = CFG.R;
    for (const o of T.objects) {
      if (o.kind !== 'post' && o.kind !== 'slider') continue;
      if (Math.abs(o.s - L.s) > 3) continue;
      let ou = o.u, ovx = 0, ovz = 0;
      if (o.kind === 'slider') {
        const ph = TAU * this.time / o.period + o.phase;
        ou = o.amp * Math.sin(ph);
        const du = o.amp * Math.cos(ph) * TAU / o.period;
        T.pointAt(o.s, 0, 0, this.tmp);
        ovx = -Math.cos(this.tmp[3]) * du; ovz = Math.sin(this.tmp[3]) * du;
      }
      T.pointAt(o.s, ou, 0, this.tmp);
      const dx = b.p[0] - this.tmp[0], dz = b.p[2] - this.tmp[2], d = Math.hypot(dx, dz), min = R + o.rad;
      if (d >= min || d < 1e-5) continue;
      const nx = dx / d, nz = dz / d;
      b.p[0] += nx * (min - d); b.p[2] += nz * (min - d);
      const rvx = b.v[0] - ovx, rvz = b.v[2] - ovz, vn = rvx * nx + rvz * nz;
      if (vn < 0) {
        b.v[0] -= nx * vn * 1.5; b.v[2] -= nz * vn * 1.5;
        if (-vn > 0.6) this.ev.hit(b, -vn, [this.tmp[0] + nx * o.rad, b.p[1], this.tmp[2] + nz * o.rad]);
      }
    }
  }
}

// =====================================================================
// CameraRig — smoothed chase cam with anticipation, roll and FOV kick.
// =====================================================================
class CameraRig {
  constructor() {
    this.pos = [0, 3, -6]; this.look = [0, 0, 0]; this.yaw = 0; this.roll = 0; this.fov = 1.2;
    this.shake = 0; this.kick = 0; this.mode = 'orbit'; this.t = 0; this.prevYaw = 0; this.yawRate = 0;
    this.eye = [0, 0, 0]; this.tgt = [0, 0, 0]; this.tmp = [0, 0, 0, 0];
    this.gyroLook = null;                           // menu look-around from the phone: { yaw, pitch }
    this.orbA = null; this.orbH = 2.3;
  }
  params(aspect, speed) {
    const portrait = aspect < 0.9;
    speed = Math.min(speed, 24);                  // past ~86 km/h, speed lines and blur carry the feeling
    return {
      dist: (portrait ? 5.7 : 5.2) + speed * 0.1,
      height: (portrait ? 3.0 : 2.5) + speed * 0.04,
      fov: ((portrait ? 72 : 56) + speed * 0.75) * Math.PI / 180,
    };
  }
  snap(ball, T, aspect) {
    T.pointAt(ball.s + 3, 0, 0, this.tmp);
    this.yaw = this.tmp[3]; this.prevYaw = this.yaw; this.roll = 0;
    const P = this.params(aspect, 0), fx = Math.sin(this.yaw), fz = Math.cos(this.yaw);
    this.pos[0] = ball.p[0] - fx * P.dist; this.pos[1] = ball.p[1] + P.height; this.pos[2] = ball.p[2] - fz * P.dist;
    this.look[0] = ball.p[0] + fx * 3; this.look[1] = ball.p[1]; this.look[2] = ball.p[2] + fz * 3;
    this.fov = P.fov;
  }
  update(dt, ball, T, aspect) {
    this.t += dt;
    const sp = ball.speed, P = this.params(aspect, sp);
    if (this.mode === 'follow') {
      T.pointAt(ball.s + 1, 0, 0, this.tmp); const thB = this.tmp[3];
      T.pointAt(ball.s + 4 + sp * 0.4, 0, 0, this.tmp); const thA = this.tmp[3];
      let ty = thB + wrapAngle(thA - thB) * 0.65;
      const vd = wrapAngle(Math.atan2(ball.v[0], ball.v[2]) - ty);
      if (sp > 3 && Math.abs(vd) < 1.1) ty += vd * clamp((sp - 3) / 20, 0, 0.22);   // ignore when rolling backwards
      this.yaw += wrapAngle(ty - this.yaw) * damp(3.4, dt);
      const yr = wrapAngle(this.yaw - this.prevYaw) / Math.max(dt, 1e-4); this.prevYaw = this.yaw;
      this.yawRate = lerp(this.yawRate, yr, damp(6, dt));
      this.roll = lerp(this.roll, clamp(-this.yawRate * 0.09 * (0.4 + sp / 14), -0.16, 0.16), damp(4, dt));
      const fx = Math.sin(this.yaw), fz = Math.cos(this.yaw);
      const tx = ball.p[0] - fx * P.dist, ty2 = ball.p[1] + P.height, tz = ball.p[2] - fz * P.dist;
      const kxz = damp(7.5, dt), ky = damp(4.2, dt);
      this.pos[0] = lerp(this.pos[0], tx, kxz); this.pos[2] = lerp(this.pos[2], tz, kxz); this.pos[1] = lerp(this.pos[1], ty2, ky);
      const la = 3 + sp * 0.28;
      const lx = ball.p[0] + fx * la, ly = ball.p[1] + 0.2, lz = ball.p[2] + fz * la;
      const kl = damp(10, dt);
      this.look[0] = lerp(this.look[0], lx, kl); this.look[1] = lerp(this.look[1], ly, kl); this.look[2] = lerp(this.look[2], lz, kl);
      this.fov = lerp(this.fov, P.fov + this.kick * 0.16, damp(3, dt));
    } else if (this.mode === 'fall') {
      this.pos[1] = lerp(this.pos[1], Math.max(ball.p[1] + 3.5, this.pos[1] - 40), damp(1.1, dt));
      const kl = damp(6, dt);
      for (let j = 0; j < 3; j++) this.look[j] = lerp(this.look[j], ball.p[j], kl);
      this.roll = lerp(this.roll, 0, damp(2, dt));
      this.fov = lerp(this.fov, P.fov * 0.8, damp(1.5, dt));
    } else {                                          // attract mode: slow swing behind the ball, looking down the track
      T.pointAt(ball.s + 2, 0, 0, this.tmp);
      // with the phone's motion, turning / tilting it walks the camera around the ball instead
      const th = this.tmp[3], L = this.gyroLook, r = 6.4;
      const ta = th + Math.PI + (L ? -L.yaw : Math.sin(this.t * 0.13) * 0.95);
      const th2 = L ? clamp(2.3 - L.pitch * 7, 0.5, 11) : 2.3 + Math.sin(this.t * 0.21) * 0.6;
      if (this.orbA === null) this.orbA = ta;
      this.orbA += wrapAngle(ta - this.orbA) * damp(L ? 6 : 1.6, dt); this.orbH = lerp(this.orbH, th2, damp(L ? 5 : 1.6, dt));
      const a = this.orbA, tx = ball.p[0] + Math.sin(a) * r, tz = ball.p[2] + Math.cos(a) * r;
      const k = damp(L ? 8 : 1.6, dt);
      this.pos[0] = lerp(this.pos[0], tx, k); this.pos[1] = lerp(this.pos[1], ball.p[1] + this.orbH, k); this.pos[2] = lerp(this.pos[2], tz, k);
      const vd = L ? a + Math.PI : th;               // look past the ball, the way the camera faces
      const lx = ball.p[0] + Math.sin(vd) * 5, ly = ball.p[1] + 1.7 - (L ? clamp(this.orbH - 2.3, -2, 6) * 0.5 : 0), lz = ball.p[2] + Math.cos(vd) * 5;
      this.look[0] = lerp(this.look[0], lx, k); this.look[1] = lerp(this.look[1], ly, k); this.look[2] = lerp(this.look[2], lz, k);
      this.yaw = th; this.prevYaw = th;
      this.roll = lerp(this.roll, Math.sin(this.t * 0.13) * 0.06, k); this.fov = lerp(this.fov, P.fov, k);
    }
    this.kick = Math.max(0, this.kick - dt * 1.5);
    this.shake = Math.max(0, this.shake - dt * 2.2);
    const sh = this.shake * this.shake * 0.35;
    const n = (f) => Math.sin(this.t * f) * Math.sin(this.t * f * 1.37 + 1.3);
    this.eye[0] = this.pos[0] + n(41) * sh; this.eye[1] = this.pos[1] + n(37) * sh; this.eye[2] = this.pos[2] + n(45) * sh;
    this.tgt[0] = this.look[0]; this.tgt[1] = this.look[1]; this.tgt[2] = this.look[2];
    for (let j = 0; j < 3; j++) { this.eye[j] = fin(this.eye[j]); this.tgt[j] = fin(this.tgt[j], this.eye[j] + (j === 2 ? 1 : 0)); }
  }
}

// =====================================================================
// InputManager — tilt (DeviceOrientation), touch/mouse joystick, keyboard.
// =====================================================================

      { scale: 0.75, post: false, particles: 160, dust: 40, env: 10, bloomDiv: 4, blur: false, probe: 0, faces: 0 },
      { scale: 1.0, post: true, particles: 300, dust: 70, env: 14, bloomDiv: 4, blur: false, probe: 64, faces: 2 },
      { scale: 1.5, post: true, particles: 480, dust: 110, env: 18, bloomDiv: 4, blur: true, probe: 128, faces: 3 },

    const R = this.R, q = this.quality.cur, eye = this.ball.p;
    if (!q.probe || this.noProbe) { R.freeProbe(); return; }
    if ((!R.probe || R.probe.size !== q.probe) && !R.makeProbe(q.probe)) { this.noProbe = true; return; }
    const P = R.probe, n = R.probeReady ? q.faces : 6;
    // one set of instance queues (props + scenery seen from the ball) serves every face
    R.cam[0] = eye[0]; R.cam[1] = eye[1]; R.cam[2] = eye[2]; R.camF[0] = R.camF[1] = R.camF[2] = 0;
    R.farList = [];
    this.drawProps(); this.env.draw(R, this.time, eye);
    const far = R.farList, pl = Object.assign({}, lit, { fogBase: eye[1] - 7 });
    R.farList = null; R.cullFar = 160;
    for (let k = 0; k < n; k++) {
      R.probeFace(eye, P.next, this.time); P.next = (P.next + 1) % 6;
      R.drawFloor(this.floorY, this.time);
      R.litSetup(pl);
      for (const ch of this.chunks.values()) R.drawChunk(ch);
      R.flushBatches(true);
      for (const it of far) { R.setFogK(it.k); R.drawProp(it.mesh, it.m, it.col, it.e); }
      R.setFogK(1);
    }
    R.clearBatches(); R.cullFar = 330;
    R.endProbe(n);
  }
  // Picker thumbnails drawn with the game's own shaders: every ball as it looks right here (it
  // mirrors the same world), every track theme on a short bend. Redrawn when the world or the theme changes.
  previews(dt) {
    const key = this.themeIdx + ':' + this.zoneIdx + ':' + (this.R.probeReady ? 1 : 0);
    if (key !== this.pvKey) {
      this.pvWait = (this.pvWait || 0) + dt;
      if (this.pvWait < 0.3) return;
      this.pvWait = 0; this.pvKey = key; this.pvNext = 0;
    }
    if (this.pvNext < BALL_SKINS.length + TRACK_THEMES.length) this.renderPreview(this.pvNext++);   // one picture per frame
  }
  renderPreviews() { for (let i = 0; i < BALL_SKINS.length + TRACK_THEMES.length; i++) this.renderPreview(i); }
  renderPreview(i) {
    const R = this.R, S = clamp(Math.round(46 * (window.devicePixelRatio || 1)), 48, 144), b = this.ball;   // the button's size in device pixels
    if (this.glLost) return;
    if (i < BALL_SKINS.length) {
      // a ball, seen from the camera's side and a little from above, rolled to show its pattern
      const e = this.cam.eye, dx = e[0] - b.p[0], dy = e[1] - b.p[1] + 2, dz = e[2] - b.p[2], l = Math.hypot(dx, dy, dz) || 1, D = CFG.R * 3.2;
      const eye = [b.p[0] + dx / l * D, b.p[1] + dy / l * D, b.p[2] + dz / l * D], fov = 2 * Math.asin(1 / 3.2) * 0.97;
      const q = this.pvQ || (this.pvQ = Q.fromAxisAngle([0, 0, 0, 1], 0.8, 0.49, 0.35, 0.7));
      const pl = this.ballPlane();
      M4.fromTRS(this.model, b.p[0], b.p[1], b.p[2], q, CFG.R, CFG.R, CFG.R);
      if (!R.beginPreview(S, eye, b.p, fov)) return;
      R.drawBall(this.model, BALL_SKINS[i], 0, 1, 0, { c: b.p, q, gN: pl.gN, gD: pl.gD });
      this.ui.setPreview('ball', i, R.endPreview());
      return;
    }
    // a track theme on a short bend, under this world's sky
    const k = i - BALL_SKINS.length, T = this.pvTrack || (this.pvTrack = TrackMesher.preview());
    if (!this.pvMesh) { const r = TrackMesher.build(T, 0, false); this.pvMesh = { mesh: R.upload(r.mb), cx: r.cx, cy: r.cy, cz: r.cz, rad: r.rad }; }
    const a = T.pointAt(1.6, 0.35, 2.1, [0, 0, 0, 0]), t = T.pointAt(8.5, -0.2, 0, [0, 0, 0, 0]);
    const lit = { time: 0.35, fogDen: 0.0078, fogBase: a[1] - 7, ball: [0, -1e4, 0, CFG.R], ballGlow: [0, 0, 0], ballLight: 0, shadow: 0, collapse: -1e9 };
    R.setTheme(TRACK_THEMES[k]);
    if (R.beginPreview(S, [a[0], a[1], a[2]], [t[0], t[1], t[2]], 1.05)) {
      R.drawSky(lit.time, false); R.drawFloor(a[1] - 64, lit.time);
      R.litSetup(lit); R.drawChunk(this.pvMesh); R.endLit();
      this.ui.setPreview('track', k, R.endPreview());
    }
    R.setTheme(TRACK_THEMES[this.themeIdx]);
  }
  // The deck plane under the ball (for the reflection of the track at the contact point).
  ballPlane() {
    const b = this.ball, T = this.track, o = this.bplane || (this.bplane = { c: b.p, q: b.q, gN: [0, 1, 0], gD: -1e5, a: [0, 0, 0, 0], b: [0, 0, 0, 0], d: [0, 0, 0, 0] });
    o.c = b.p; o.q = b.q;
    if (b.lost || b.p[1] > b.surfY + 3 || b.s < T.minIndex() * CFG.DS || b.s > (T.n - 3) * CFG.DS) { o.gN[0] = 0; o.gN[1] = 1; o.gN[2] = 0; o.gD = -1e5; return o; }
    T.pointAt(b.s, b.u - 0.5, 0, o.a); T.pointAt(b.s, b.u + 0.5, 0, o.b); T.pointAt(b.s + 0.5, b.u, 0, o.d);
    const ux = o.b[0] - o.a[0], uy = o.b[1] - o.a[1], uz = o.b[2] - o.a[2], vx = o.d[0] - o.a[0], vy = o.d[1] - o.a[1], vz = o.d[2] - o.a[2];
    let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    const l = (ny < 0 ? -1 : 1) * (Math.hypot(nx, ny, nz) || 1); nx /= l; ny /= l; nz /= l;
    o.gN[0] = nx; o.gN[1] = ny; o.gN[2] = nz; o.gD = nx * o.a[0] + ny * o.a[1] + nz * o.a[2];
    return o;
  }
  render() {
    const R = this.R, cam = this.cam, b = this.ball, th = TRACK_THEMES[this.themeIdx], sk = BALL_SKINS[this.skinIdx];
    const aspect = R.w / R.h;
    const Z = R.Z, boostK = clamp(b.boost / 1.3, 0, 1), spK = clamp((b.speed - 6) / 14, 0, 1), stK = this.starK;
    const glowCol = stK > 0.01 ? [lerp(sk.glow[0], STAR_COL[0], stK), lerp(sk.glow[1], STAR_COL[1], stK), lerp(sk.glow[2], STAR_COL[2], stK)] : sk.glow;
    const lit = {
      time: this.time, fogDen: 0.0078 * Z.haze, fogBase: cam.eye[1] - 7,
      ball: [b.p[0], b.p[1], b.p[2], CFG.R], ballGlow: glowCol, ballLight: 0.3 + boostK * 0.9 + stK * 1.4 + (sk.type === 2 ? 0.35 : sk.type === 1 ? 0.15 : 0),
      shadow: b.lost ? 0 : 1, collapse: this.collapseS,
    };
    this.renderProbe(lit);
    R.setCamera(cam.eye, cam.tgt, cam.roll, clamp(cam.fov, 0.6, 1.9), 0.08, 1400);
    R.begin(this.time);
    R.drawFloor(this.floorY, this.time);
    R.litSetup(lit);
    for (const ch of this.chunks.values()) R.drawChunk(ch);
    this.drawProps();
    this.env.draw(R, this.time, b.p);
    R.endLit();
    M4.fromTRS(this.model, b.p[0], b.p[1], b.p[2], b.q, CFG.R, CFG.R, CFG.R);
    R.drawBall(this.model, sk, Math.max(spK, boostK), 1, stK, this.ballPlane());
    // additive pass
    R.beginAdditive();
    const F = this.fx; F.begin(R.view);
    const sk2 = Z.shafts, shaftCol = [lerp(Z.sun[0], th.accent[0], 0.3) * sk2, lerp(Z.sun[1], th.accent[1], 0.3) * sk2, lerp(Z.sun[2], th.accent[2], 0.3) * sk2];
    for (const s of this.env.shafts) F.shaft(s, cam.eye, shaftCol);
    const running = this.state === 'play' || this.state === 'falling';
    F.speedLines(this.frameDt || 0, cam.eye, R.camF, running ? b.speed : 0, Z.dust, running ? clamp((b.speed - 7) / 12, 0, 1) * 0.3 + boostK * 0.35 : 0);
    for (const bo of this.env.bolts) { const a = bo.life / 0.28; F.polyRibbon(bo.pts, cam.eye, 1.4, Z.c1, a * 0.8); F.polyRibbon(bo.pts, cam.eye, 0.35, [1, 0.95, 1], a * 1.6); }
    F.ribbon(cam.eye, CFG.R * (0.55 + stK * 0.35), glowCol, clamp((b.speed - 8) / 8, 0, 1) * 0.55 + boostK * 0.5 + stK * 0.6);
    F.glow(b.p[0], b.p[1], b.p[2], CFG.R * (2.8 + stK * 2.2), glowCol, 0.1 + boostK * 0.35 + spK * 0.08 + stK * (0.4 + 0.12 * Math.sin(this.time * 14)));
    if (stK > 0.01 && !b.lost) this.starRails(F, stK);
    for (let k = 0; k < this.gemGlowN; k++) F.glow(this.gemGlow[k * 3], this.gemGlow[k * 3 + 1], this.gemGlow[k * 3 + 2], 0.75, GEM_COL, 0.4);
    R.drawFx(F.buf, F.n);
    let n = this.parts.write(this.parts.out, 0);
    n = this.env.writeDust(this.parts.out, n, cam.eye, this.time, Z.dust, Z.drift);
    R.drawPoints(this.parts.out, n);
    R.endAdditive();
    const q = this.quality.cur;
    R.finish({ bloom: 1.0, blur: q.blur ? clamp((b.speed - 11) / 9, 0, 1) * 0.5 + boostK * 0.4 : 0, ca: q.blur ? boostK * 0.6 : 0, cx: 0.5, cy: aspect < 1 ? 0.4 : 0.45 });
  }

  // ------------------------------------------------------------- world zones
  // Zone follows distance (and loops); the last 14 % of each zone cross-fades into the next.
  updateZones(dt) {
    const R = this.R, N = ZONES.length;
    const pos = Math.max(0, this.maxS - CFG.START_S);                    // worlds follow the position on the track
    const zf = pos / ZONE_LEN, zA = Math.floor(zf) % N, zB = (zA + 1) % N;
    // skies are painted lazily: all of them while on the menu (one per frame), else the next one ahead of time
    if (this.state === 'menu' || this.state === 'calib') { for (let i = 0; i < N; i++) if (R.ensureZone((zA + i) % N)) break; }
    else if (zf - Math.floor(zf) > 0.5) R.ensureZone(zB);
    const k = clamp((zf - Math.floor(zf) - 0.86) / 0.14, 0, 1), kk = k * k * (3 - 2 * k);
    R.setZones(zA, zB, kk);
    const cur = kk > 0.5 ? zB : zA;
    if (cur !== this.zoneIdx) { if (this.state === 'play') this.audio.whoosh(); this.zoneIdx = cur; }
    R.flash = Math.max(0, R.flash - dt * 3.5);
  }
  bolt() {
    this.R.flash = 1; this.ui.flash(0.08, 'rgb(255,200,200)');
    clearTimeout(this.thunderT); this.thunderT = setTimeout(() => this.audio.thunder(), 250 + Math.random() * 500);
  }

  // ------------------------------------------------------------- installable app (PWA)
  // The manifest and service worker only exist on a web server; file:// copies skip them.
  setupPWA() {
    const web = /^https?:$/.test(location.protocol), btn = this.ui.$('btnInstall'), E = this.ui.el;
    if (web) {
      const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l);
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
    }
    const installed = matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    if (!web || installed) return;
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); this.installEvt = e; btn.classList.remove('hidden'); });
    window.addEventListener('appinstalled', () => { btn.classList.add('hidden'); Analytics.event('install', { outcome: 'installed' }); });
    if (ios) btn.classList.remove('hidden');
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      if (this.installEvt) {
        const ev = this.installEvt; this.installEvt = null; ev.prompt();
        ev.userChoice.then((c) => { Analytics.event('install', { outcome: c.outcome }); if (c.outcome === 'accepted') btn.classList.add('hidden'); }).catch(() => {});
      } else if (ios) { E.perm.textContent = tr('iosInstall'); E.perm.classList.remove('hidden'); }
    });
  }

  // ------------------------------------------------------------- sharing
  prepareShare(record) {
    const th = TRACK_THEMES[this.themeIdx], css = (c) => `rgb(${c.map((v) => Math.round(v * 255)).join(',')})`;
    const info = {
      dist: Math.floor(this.dist), score: Math.floor(this.score), best: Math.floor(this.best), record, recordTxt: tr('newRecord'),
      tag: [this.gameMode === 'daily' ? tr('dailyTag', { date: dayLabel(this.runDay || dayKey()) }) : '', this.kid ? '🛡 ' + tr('kidShare').toUpperCase() : ''].filter(Boolean).join(' · '),
      accent: css(th.accent), accent2: css(th.accent2), portrait: this.R.h >= this.R.w,
    };
    this.shareInfo = info; this.shareFile = null; this.shareToken = (this.shareToken || 0) + 1;
    this.setShare('idle');
  }
  // The video is only made when asked for (first tap). Making it takes longer than the browser
  // keeps the tap "active", so sharing it needs a second tap unless it was quick (image fallback).
  makeShare() {
    const token = this.shareToken, t0 = performance.now();
    this.setShare('busy', 0);
    const done = (f) => {
      if (token !== this.shareToken) return;
      this.shareFile = f;
      if (performance.now() - t0 < 900) this.share(); else this.setShare('ready');
    };
    const go = () => {
      if (token !== this.shareToken) return;
      if (this.replay.pending > 0) { setTimeout(go, 100); return; }          // last snapshots still encoding
      this.replay.make(this.shareInfo, (p) => { if (token === this.shareToken) this.setShare('busy', p); })
        .then(done).catch(() => done(null));
    };
    go();
  }
  setShare(st, p = 0) { this.shareSt = st; this.shareP = p; this.ui.shareState(st, p); }
  share() {
    const f = this.shareFile, info = this.shareInfo;
    if (!info || this.shareSt === 'busy') return;
    if (this.shareSt === 'idle') { this.makeShare(); return; }
    const url = PROD_URL + (this.gameMode === 'daily' ? '?mode=daily' : '');
    let text = tr('shareText', { d: fmt(info.dist), s: fmt(info.score) });
    if (this.gameMode === 'daily') text += ' — ' + tr('shareDaily', { date: dayLabel(this.runDay || dayKey()) });
    if (this.kid) text += ' (🛡 ' + tr('kidShare') + ')';
    text += ' ' + url;
    let canFiles;
    try { canFiles = !!(f && navigator.canShare && navigator.canShare({ files: [f] })); } catch (e) { canFiles = false; }
    const kind = f ? (f.type.startsWith('video') ? 'video' : 'image') : 'text';
    if (navigator.share && (canFiles || !f)) {
      Analytics.event('share', { kind, via: 'share' });
      navigator.share(canFiles ? { files: [f], text, title: 'GYROLL' } : { text, title: 'GYROLL' })
        .catch((e) => { if (!e || e.name !== 'AbortError') this.download(f, text); });
      return;
    }
    Analytics.event('share', { kind, via: 'download' });
    this.download(f, text);
  }
  download(f, text) {
    try { if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {}); } catch (e) { /* ignore */ }
    if (!f) return;
    const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 8000);
    this.setShare('saved');
  }

  // ------------------------------------------------------------- misc
  lockWake() {
    try {
      if (!('wakeLock' in navigator) || this.wake || document.hidden) return;
      navigator.wakeLock.request('screen').then((w) => { this.wake = w; w.addEventListener('release', () => { this.wake = null; }); }).catch(() => {});
    } catch (e) { /* unsupported */ }
  }
  unlockWake() { try { if (this.wake) this.wake.release(); } catch (e) { /* ignore */ } this.wake = null; }
}

window.addEventListener('load', () => { window.__game = new Game(); });
</script>
