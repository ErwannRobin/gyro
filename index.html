<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GYROLL</title>
<meta name="description" content="GYROLL — an endless 3D marble run you steer by tilting your phone. How far can you go?">
<link rel="canonical" href="https://gyroll.vercel.app/">
<meta property="og:type" content="website">
<meta property="og:title" content="GYROLL — How far can you go?">
<meta property="og:description" content="Tilt your phone to roll a marble along an endless floating track. Daily run, 9 worlds, share your best run.">
<meta property="og:url" content="https://gyroll.vercel.app/">
<meta property="og:image" content="https://gyroll.vercel.app/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="twitter:image" content="https://gyroll.vercel.app/og.jpg">
<meta name="apple-mobile-web-app-title" content="GYROLL">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --accent:#4ef2ff;
  --accent2:#ff5ad2;
  --gold:#ffd36b;
  --ink:#ffffff;
  --dim:rgba(235,242,255,.62);
  --glass:rgba(10,14,30,.55);
  --glass-brd:rgba(255,255,255,.14);
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#05060d;color:var(--ink);font-family:var(--font);
  touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-text-size-adjust:100%;position:fixed;inset:0}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.hidden{display:none!important}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity .4s}
#hud::before{content:"";position:absolute;z-index:-1;left:0;right:0;top:0;height:calc(var(--sat) + 120px);background:linear-gradient(180deg,rgba(3,4,12,.55),rgba(3,4,12,0))}
#hud::after{content:"";position:absolute;z-index:-1;left:0;right:0;bottom:0;height:calc(var(--sab) + 70px);background:linear-gradient(0deg,rgba(3,4,12,.4),rgba(3,4,12,0))}
#hud.on{opacity:1}
#stats{position:absolute;top:calc(var(--sat) + 10px);left:calc(var(--sal) + 14px);right:calc(var(--sar) + 14px);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px}
#stats > div:last-child{min-width:100px}
.stat{display:flex;flex-direction:column;text-shadow:0 0 2px rgba(0,0,0,.9),0 2px 6px rgba(0,0,0,.85)}
.stat .lbl{font-size:11px;font-weight:800;letter-spacing:.22em;color:var(--dim)}
.stat .val{font-size:22px;font-weight:800;letter-spacing:.02em;line-height:1.1}
#stats .col{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
#stBest .val{font-size:16px;color:var(--gold)}
#stBest .lbl{font-size:10px}
#stScore{align-items:center}
#stScore .val{font-size:40px;font-weight:900;letter-spacing:.01em;text-shadow:none;
  background:linear-gradient(180deg,#fff 30%,#bfefff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.8))}
#mult{margin-top:2px;font-size:13px;font-weight:900;letter-spacing:.12em;color:var(--gold);opacity:0;transition:opacity .25s,transform .25s;transform:scale(.8)}
#mult.on{opacity:1;transform:scale(1)}
#topBtns{position:absolute;top:calc(var(--sat) + 8px);right:calc(var(--sar) + 10px);display:flex;gap:8px;pointer-events:auto}
.icoBtn{width:44px;height:44px;border-radius:14px;background:var(--glass);border:1px solid var(--glass-brd);
  display:flex;align-items:center;justify-content:center;font-size:20px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 4px 18px rgba(0,0,0,.35)}
.icoBtn:active{transform:scale(.92)}
#speedo{position:absolute;left:calc(var(--sal) + 16px);bottom:calc(var(--sab) + 16px);display:flex;align-items:flex-end;gap:10px;
  text-shadow:0 2px 6px rgba(0,0,0,.8)}
#speedo .v{font-size:26px;font-weight:900;line-height:1}
#speedo .u{font-size:11px;font-weight:800;letter-spacing:.18em;color:var(--dim);margin-bottom:3px}
#speedBar{position:absolute;left:0;bottom:-7px;height:3px;width:86px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}
#speedBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px}
#ctrlTag{position:absolute;right:calc(var(--sar) + 16px);bottom:calc(var(--sab) + 18px);font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--dim);
  text-shadow:0 2px 6px rgba(0,0,0,.8)}
#power{position:absolute;left:50%;bottom:calc(var(--sab) + 44px);transform:translateX(-50%);width:min(56vw,250px);padding:8px 10px;
  text-shadow:0 2px 6px rgba(0,0,0,.85);pointer-events:none;-webkit-tap-highlight-color:transparent}
#power .row{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;font-size:11px;font-weight:900;letter-spacing:.12em;margin-bottom:5px;white-space:nowrap}
#pwCoin{color:var(--gold);transition:transform .2s}
#pwCoin::before{content:"";display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff7d6,var(--gold) 55%,#b8801e);box-shadow:0 0 6px rgba(255,211,107,.7)}
#pwCoin.up{transform:scale(1.35)}
#pwTxt{color:var(--dim);overflow:hidden;text-overflow:ellipsis}
#power .bar{height:8px;border-radius:5px;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);overflow:hidden}
#pwFill{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#ffe9a8,var(--gold),#ff9d5c);transition:width .15s linear}
#power.ready{pointer-events:auto;cursor:pointer}
#power.ready .bar{animation:pwPulse .6s ease-in-out infinite alternate}
#power.ready #pwTxt,#power.on #pwTxt{color:#fff3c4}
#power.on #pwFill{background:linear-gradient(90deg,#fff,#fff3c4,var(--gold));box-shadow:0 0 12px var(--gold)}
@keyframes pwPulse{from{box-shadow:0 0 0 1px rgba(255,211,107,.5),0 0 6px rgba(255,211,107,.4)}to{box-shadow:0 0 0 2px rgba(255,230,160,1),0 0 22px rgba(255,211,107,.95)}}
#starGlow{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity .5s;
  background:radial-gradient(ellipse 90% 80% at 50% 50%,rgba(255,210,110,0) 50%,rgba(255,196,80,.32) 100%)}
body.star #starGlow{opacity:1}
#toasts{position:absolute;left:0;right:0;top:32%;display:flex;flex-direction:column;align-items:center;gap:6px}
.toast{font-weight:900;letter-spacing:.14em;font-size:20px;text-shadow:0 0 2px #000,0 0 3px rgba(0,0,0,.9),0 3px 12px rgba(0,0,0,.8);animation:toast 1.4s ease-out forwards;white-space:nowrap}
.toast.big{font-size:28px}
.toast.gold{color:var(--gold)}
.toast.cyan{color:var(--accent)}
.toast.pink{color:var(--accent2)}
@keyframes toast{0%{opacity:0;transform:translateY(14px) scale(.7)}12%{opacity:1;transform:translateY(0) scale(1.08)}22%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-26px) scale(.96)}}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse 85% 75% at 50% 48%,rgba(0,0,0,0) 55%,rgba(2,3,10,.5) 100%)}
#danger{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;
  background:radial-gradient(120% 60% at 50% 115%,rgba(255,40,70,.55),rgba(255,40,70,0) 60%)}
#flash{position:fixed;inset:0;pointer-events:none;z-index:6;background:#fff;opacity:0}
#joy{position:fixed;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;pointer-events:none;z-index:6;opacity:0;transition:opacity .15s;
  border:2px solid rgba(255,255,255,.28);background:radial-gradient(circle,rgba(78,242,255,.08),rgba(78,242,255,0) 70%)}
#joy.on{opacity:1}
#joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9),rgba(160,230,255,.45) 45%,rgba(78,242,255,.15) 75%);box-shadow:0 0 18px rgba(78,242,255,.45)}
#touchHint{position:fixed;left:0;right:0;bottom:calc(var(--sab) + 104px);text-align:center;z-index:6;pointer-events:none;
  font-size:14px;font-weight:700;letter-spacing:.06em;color:var(--dim);text-shadow:0 2px 6px #000;transition:opacity .6s}

/* ---------- Screens ---------- */
.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:calc(var(--sat) + 24px) calc(var(--sar) + 22px) calc(var(--sab) + 24px) calc(var(--sal) + 22px);
  background:radial-gradient(140% 90% at 50% 40%,rgba(5,6,13,0) 0%,rgba(5,6,13,.55) 70%,rgba(5,6,13,.85) 100%);
  transition:opacity .45s;overflow:hidden}
.screen.fade{opacity:0;pointer-events:none}
/* menu: a tap on the background hides everything but the play buttons (the layout never moves) */
#menu{background:none}
#menu::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;transition:opacity .4s;
  background:radial-gradient(140% 90% at 50% 40%,rgba(5,6,13,0) 0%,rgba(5,6,13,.55) 70%,rgba(5,6,13,.85) 100%)}
#menuTop,#menu .mcol > *{transition:opacity .35s,visibility .35s}
#menu.clean::before{opacity:0}
#menu.clean #menuTop,#menu.clean .mcol > :not(#btnTilt):not(#btnTouch){opacity:0;visibility:hidden;pointer-events:none}
#xfade{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;opacity:0}
#title{font-size:clamp(62px,19vw,150px);font-weight:900;letter-spacing:.04em;line-height:.9;margin-right:-.06em;
  background:linear-gradient(100deg,#fff 0%,#d9fbff 30%,var(--accent) 45%,#fff 52%,var(--accent2) 70%,#fff 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s ease-in-out infinite;
  filter:drop-shadow(0 6px 30px rgba(78,242,255,.35)) drop-shadow(0 2px 2px rgba(0,0,0,.6))}
@keyframes shine{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
#tagline{margin-top:10px;font-size:clamp(17px,4.6vw,22px);font-style:italic;font-weight:500;letter-spacing:.04em;color:rgba(235,245,255,.9);text-shadow:0 0 3px rgba(0,0,0,.7),0 2px 8px #000}
.bigBtn{margin-top:30px;height:64px;padding:0 20px;border-radius:20px;font-size:16px;font-weight:900;letter-spacing:.08em;line-height:1.2;
  max-width:420px;width:100%;color:#051018;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#8ff8ff 0%,var(--accent) 45%,#35b7ff 100%);
  box-shadow:0 10px 40px rgba(78,242,255,.35),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -3px 0 rgba(0,40,80,.25);
  position:relative;overflow:hidden}
.bigBtn::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);
  animation:sweep 3.2s ease-in-out infinite}
@keyframes sweep{0%,55%{left:-60%}100%{left:130%}}
.bigBtn:active{transform:scale(.97)}
.ghostBtn{margin-top:12px;min-height:50px;padding:12px 22px;border-radius:16px;font-size:14px;font-weight:800;letter-spacing:.1em;
  background:var(--glass);border:1px solid var(--glass-brd);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-width:420px;width:100%}
.ghostBtn:active{transform:scale(.97)}
.hint{margin-top:14px;font-size:14px;font-weight:600;color:var(--dim);letter-spacing:.02em;text-shadow:0 2px 6px #000;max-width:420px}
.hint b{color:#fff}
#menuBest{margin-top:22px;font-size:12px;font-weight:800;letter-spacing:.26em;color:rgba(235,242,255,.8);text-shadow:0 0 3px rgba(0,0,0,.8),0 1px 6px rgba(0,0,0,.7)}
#menuBest span{color:var(--gold);font-size:15px;letter-spacing:.06em}
.skinRow{display:flex;align-items:center;gap:10px;width:100%;justify-content:center}
.skinRow .lbl{font-size:11px;font-weight:800;letter-spacing:.2em;color:rgba(235,242,255,.8);width:54px;text-align:right;text-shadow:0 0 3px rgba(0,0,0,.8),0 1px 6px rgba(0,0,0,.7)}
.sw{width:44px;height:44px;border-radius:13px;border:2px solid rgba(255,255,255,.18);position:relative;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.sw.round{border-radius:50%}
.sw.sel{border-color:#fff;box-shadow:0 0 0 3px rgba(78,242,255,.5),0 4px 14px rgba(0,0,0,.4)}
#menuTop{position:absolute;top:calc(var(--sat) + 10px);left:calc(var(--sal) + 12px);right:calc(var(--sar) + 12px);display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:2}
.seg{display:inline-flex;padding:4px;border-radius:15px;background:var(--glass);border:1px solid var(--glass-brd);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);gap:4px}
.seg button{min-height:38px;padding:6px 12px;border-radius:11px;font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--dim);transition:background .2s,color .2s}
.seg button.on{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
#modeSeg{margin-top:20px}
#modeSeg button{width:142px;min-height:44px;padding:6px 4px;font-size:13px;white-space:nowrap}
#tgKid{margin-top:10px;width:290px;max-width:100%;justify-content:center;white-space:nowrap}
.linkBtn{background:none;border:0;padding:2px 6px;font:inherit;font-weight:900;letter-spacing:.08em;line-height:16px;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
#tgKid:not(.off){color:#051018;background:linear-gradient(135deg,#ffe9a8,var(--gold));border-color:transparent}
#ovRails{margin-top:10px;padding:6px 14px;border-radius:12px;font-size:13px;font-weight:800;letter-spacing:.06em;color:#051018;background:linear-gradient(135deg,#ffe9a8,var(--gold))}
#modeInfo{margin-top:6px;height:40px;width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:12px;line-height:16px;font-weight:700;color:rgba(235,242,255,.85);letter-spacing:.04em;text-shadow:0 0 3px rgba(0,0,0,.85),0 1px 6px rgba(0,0,0,.8)}
.tgRow{display:flex;gap:8px}
.tg{min-height:44px;padding:0 13px;border-radius:14px;background:var(--glass);border:1px solid var(--glass-brd);display:inline-flex;align-items:center;gap:7px;
  font-size:11px;font-weight:900;letter-spacing:.12em;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:color .2s,opacity .2s}
.tg.icon{width:44px;padding:0;justify-content:center;color:#fff}
.ic{width:22px;height:22px;flex:none;fill:currentColor;overflow:visible}
.ic .stk{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic .cut{fill:none;stroke:#0c1122;stroke-width:5.5;stroke-linecap:round}
.ic .mute,.ic .cut,.ic .slash{display:none}
.tg.off{color:rgba(255,255,255,.42)}
.tg.icon.off{color:rgba(255,255,255,.55)}
.tg.off .ic .wave{display:none}
.tg.off .ic .mute,.tg.off .ic .cut,.tg.off .ic .slash{display:inline}
.tg:active{transform:scale(.95)}
.skins{margin-top:20px;display:flex;flex-direction:column;gap:10px;align-items:center;width:100%;max-width:420px}
.skinName{font-size:12px;font-weight:700;letter-spacing:.14em;color:rgba(255,255,255,.85);height:16px;line-height:16px;white-space:nowrap;text-shadow:0 0 3px rgba(0,0,0,.8),0 1px 6px rgba(0,0,0,.7)}
.ghostBtn.small{min-height:42px;margin-top:14px;padding:8px 18px;width:auto;font-size:12px}
.shareBtn{position:relative;overflow:hidden}
.shareBtn .prog{position:absolute;left:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .2s}
.shareBtn.busy{opacity:.75}
.shareBtn.ready{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 18px rgba(78,242,255,.35);animation:shReady 1s ease-in-out infinite alternate}
@keyframes shReady{from{box-shadow:0 0 0 1px var(--accent),0 0 8px rgba(78,242,255,.25)}to{box-shadow:0 0 0 2px var(--accent),0 0 24px rgba(78,242,255,.6)}}
#ovMode{margin-top:6px;font-size:12px;font-weight:800;letter-spacing:.2em;color:var(--accent)}
#pause .skins{margin-top:16px}
#permMsg{margin-top:14px;font-size:13px;font-weight:700;color:#ffb3c7;max-width:380px;text-shadow:0 2px 6px #000}

#calib{background:rgba(5,6,13,.25)}
#calibRing{width:120px;height:120px;border-radius:50%;border:3px solid rgba(255,255,255,.15);position:relative}
#calibRing::before{content:"";position:absolute;inset:-3px;border-radius:50%;border:3px solid transparent;border-top-color:var(--accent);border-right-color:var(--accent);
  animation:spin .8s linear infinite}
#calibRing b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900}
@keyframes spin{to{transform:rotate(360deg)}}
#calibTxt{margin-top:22px;font-size:16px;font-weight:800;letter-spacing:.12em;text-shadow:0 2px 8px #000}
#calibSub{margin-top:8px;font-size:14px;color:var(--dim);text-shadow:0 2px 8px #000}
#go{position:fixed;left:0;right:0;top:40%;text-align:center;font-size:72px;font-weight:900;letter-spacing:.08em;z-index:21;pointer-events:none;opacity:0;
  color:#fff;text-shadow:0 0 30px rgba(78,242,255,.9),0 4px 10px rgba(0,0,0,.7)}
#go.on{animation:go .9s ease-out forwards}
@keyframes go{0%{opacity:0;transform:scale(2.2)}20%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0;transform:scale(.9)}}

#pause h2,#over h2{font-size:clamp(40px,12vw,64px);font-weight:900;letter-spacing:.1em;margin-right:-.1em;text-shadow:0 4px 20px rgba(0,0,0,.8)}
#pause{background:rgba(5,6,13,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.volRow{margin-top:14px;display:flex;align-items:center;gap:12px;width:100%;max-width:360px}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:rgba(255,255,255,.18);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(78,242,255,.35)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:0}

#over{background:radial-gradient(120% 80% at 50% 45%,rgba(20,5,20,.35),rgba(5,6,13,.85))}
#over h2{background:linear-gradient(180deg,#fff,#ffc2e4);-webkit-background-clip:text;background-clip:text;color:transparent}
#ovDist{margin-top:14px;font-size:clamp(56px,17vw,96px);font-weight:900;line-height:1;text-shadow:0 6px 30px rgba(78,242,255,.35)}
#ovDist small{font-size:.42em;font-weight:800;color:var(--dim);margin-left:4px}
#ovScore{margin-top:14px;font-size:18px;font-weight:800;letter-spacing:.16em}
#ovBest{margin-top:6px;font-size:14px;font-weight:800;letter-spacing:.16em;color:var(--dim)}
#ovBest b{color:var(--gold)}
#record{position:relative;margin-top:18px;height:44px;display:flex;align-items:center;justify-content:center}
#record .txt{font-size:26px;font-weight:900;letter-spacing:.14em;
  background:linear-gradient(100deg,#fff3c4,var(--gold) 30%,#fff 50%,#ff9d5c 70%,#fff3c4);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:recIn .9s cubic-bezier(.2,1.6,.4,1) both,shine 1.6s linear infinite;
  filter:drop-shadow(0 0 18px rgba(255,200,90,.6))}
#record .rays{position:absolute;left:50%;top:50%;width:360px;height:360px;margin:-180px 0 0 -180px;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(255,211,107,.22) 0deg 6deg,rgba(255,211,107,0) 6deg 20deg);

<script>

'use strict';
/* =====================================================================
   GYROLL — endless tilt-controlled marble run.
   Single-file game: WebGL renderer, custom physics, procedural track,
   Web Audio synthesis. No external resources.
   ===================================================================== */

// ---------------------------------------------------------------- utils
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (k, dt) => 1 - Math.exp(-k * dt);
const fin = (v, d = 0) => (Number.isFinite(v) ? v : d);
const TAU = Math.PI * 2;
const wrapAngle = (a) => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const fmt = (n) => Math.floor(Math.max(0, n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const hex = (h) => [((h >> 16) & 255) / 255, ((h >> 8) & 255) / 255, (h & 255) / 255];

// Deterministic PRNG (mulberry32) so a run's track is reproducible from a seed.
function RNG(seed) {
  let a = seed >>> 0;
  const next = () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  return {
    next,
    range: (lo, hi) => lo + (hi - lo) * next(),
    int: (lo, hi) => lo + Math.floor(next() * (hi - lo + 1)),
    chance: (p) => next() < p,
    sign: () => (next() < 0.5 ? -1 : 1),
    pick: (arr) => arr[Math.floor(next() * arr.length)],
  };
}

const Store = {
  get(k, d) { try { const v = localStorage.getItem('gyroll.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('gyroll.' + k, JSON.stringify(v)); } catch (e) { /* private mode */ } },
};

// ---------------------------------------------------------------- mat4 (column-major)
const M4 = {
  create() { const m = new Float32Array(16); m[0] = m[5] = m[10] = m[15] = 1; return m; },
  perspective(out, fovy, aspect, near, far) {
    const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
    out.fill(0);
    out[0] = f / aspect; out[5] = f; out[10] = (far + near) * nf; out[11] = -1; out[14] = 2 * far * near * nf;
    return out;
  },
  // View matrix from eye/target/up plus an extra roll around the view axis.
  lookAt(out, e, t, up, roll) {
    let zx = e[0] - t[0], zy = e[1] - t[1], zz = e[2] - t[2];
    let l = Math.hypot(zx, zy, zz) || 1; zx /= l; zy /= l; zz /= l;
    let xx = up[1] * zz - up[2] * zy, xy = up[2] * zx - up[0] * zz, xz = up[0] * zy - up[1] * zx;
    l = Math.hypot(xx, xy, xz) || 1; xx /= l; xy /= l; xz /= l;
    let yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
    if (roll) {
      const c = Math.cos(roll), s = Math.sin(roll);
      const nx = [xx * c + yx * s, xy * c + yy * s, xz * c + yz * s];
      const ny = [yx * c - xx * s, yy * c - xy * s, yz * c - xz * s];
      xx = nx[0]; xy = nx[1]; xz = nx[2]; yx = ny[0]; yy = ny[1]; yz = ny[2];
    }
    out[0] = xx; out[1] = yx; out[2] = zx; out[3] = 0;
    out[4] = xy; out[5] = yy; out[6] = zy; out[7] = 0;
    out[8] = xz; out[9] = yz; out[10] = zz; out[11] = 0;
    out[12] = -(xx * e[0] + xy * e[1] + xz * e[2]);
    out[13] = -(yx * e[0] + yy * e[1] + yz * e[2]);
    out[14] = -(zx * e[0] + zy * e[1] + zz * e[2]);
    out[15] = 1;
    return out;
  },
  mul(out, a, b) {
    const r = new Float32Array(16);
    for (let c = 0; c < 4; c++) for (let rr = 0; rr < 4; rr++) {
      r[c * 4 + rr] = a[rr] * b[c * 4] + a[4 + rr] * b[c * 4 + 1] + a[8 + rr] * b[c * 4 + 2] + a[12 + rr] * b[c * 4 + 3];
    }
    out.set(r); return out;
  },
  invert(out, m) {
    const a00 = m[0], a01 = m[1], a02 = m[2], a03 = m[3], a10 = m[4], a11 = m[5], a12 = m[6], a13 = m[7];
    const a20 = m[8], a21 = m[9], a22 = m[10], a23 = m[11], a30 = m[12], a31 = m[13], a32 = m[14], a33 = m[15];
    const b00 = a00 * a11 - a01 * a10, b01 = a00 * a12 - a02 * a10, b02 = a00 * a13 - a03 * a10, b03 = a01 * a12 - a02 * a11;
    const b04 = a01 * a13 - a03 * a11, b05 = a02 * a13 - a03 * a12, b06 = a20 * a31 - a21 * a30, b07 = a20 * a32 - a22 * a30;
    const b08 = a20 * a33 - a23 * a30, b09 = a21 * a32 - a22 * a31, b10 = a21 * a33 - a23 * a31, b11 = a22 * a33 - a23 * a32;
    let det = b00 * b11 - b01 * b10 + b02 * b09 + b03 * b08 - b04 * b07 + b05 * b06;
    if (!det) return out;
    det = 1 / det;
    out[0] = (a11 * b11 - a12 * b10 + a13 * b09) * det; out[1] = (a02 * b10 - a01 * b11 - a03 * b09) * det;
    out[2] = (a31 * b05 - a32 * b04 + a33 * b03) * det; out[3] = (a22 * b04 - a21 * b05 - a23 * b03) * det;
    out[4] = (a12 * b08 - a10 * b11 - a13 * b07) * det; out[5] = (a00 * b11 - a02 * b08 + a03 * b07) * det;
    out[6] = (a32 * b02 - a30 * b05 - a33 * b01) * det; out[7] = (a20 * b05 - a22 * b02 + a23 * b01) * det;
    out[8] = (a10 * b10 - a11 * b08 + a13 * b06) * det; out[9] = (a01 * b08 - a00 * b10 - a03 * b06) * det;
    out[10] = (a30 * b04 - a31 * b02 + a33 * b00) * det; out[11] = (a21 * b02 - a20 * b04 - a23 * b00) * det;
    out[12] = (a11 * b07 - a10 * b09 - a12 * b06) * det; out[13] = (a00 * b09 - a01 * b07 + a02 * b06) * det;
    out[14] = (a31 * b01 - a30 * b03 - a32 * b00) * det; out[15] = (a20 * b03 - a21 * b01 + a22 * b00) * det;
    return out;
  },
  // Model matrix = T * R(quat) * S
  fromTRS(out, px, py, pz, q, sx, sy, sz) {
    const x = q[0], y = q[1], z = q[2], w = q[3];
    const x2 = x + x, y2 = y + y, z2 = z + z;
    const xx = x * x2, xy = x * y2, xz = x * z2, yy = y * y2, yz = y * z2, zz = z * z2, wx = w * x2, wy = w * y2, wz = w * z2;
    out[0] = (1 - (yy + zz)) * sx; out[1] = (xy + wz) * sx; out[2] = (xz - wy) * sx; out[3] = 0;
    out[4] = (xy - wz) * sy; out[5] = (1 - (xx + zz)) * sy; out[6] = (yz + wx) * sy; out[7] = 0;
    out[8] = (xz + wy) * sz; out[9] = (yz - wx) * sz; out[10] = (1 - (xx + yy)) * sz; out[11] = 0;
    out[12] = px; out[13] = py; out[14] = pz; out[15] = 1;
    return out;
  },
};
const Q = {
  fromAxisAngle(out, ax, ay, az, a) { const s = Math.sin(a / 2); out[0] = ax * s; out[1] = ay * s; out[2] = az * s; out[3] = Math.cos(a / 2); return out; },
  yaw(out, a) { return Q.fromAxisAngle(out, 0, 1, 0, a); },
  mul(out, a, b) {
    const ax = a[0], ay = a[1], az = a[2], aw = a[3], bx = b[0], by = b[1], bz = b[2], bw = b[3];
    out[0] = aw * bx + ax * bw + ay * bz - az * by; out[1] = aw * by - ax * bz + ay * bw + az * bx;
    out[2] = aw * bz + ax * by - ay * bx + az * bw; out[3] = aw * bw - ax * bx - ay * by - az * bz;
    return out;
  },
  // Integrate angular velocity w (world space) into quaternion q.
  integrate(q, wx, wy, wz, dt) {
    const x = q[0], y = q[1], z = q[2], w = q[3], h = 0.5 * dt;
    q[0] += h * (wx * w + wy * z - wz * y);
    q[1] += h * (wy * w + wz * x - wx * z);
    q[2] += h * (wz * w + wx * y - wy * x);
    q[3] += h * (-wx * x - wy * y - wz * z);
    const l = Math.hypot(q[0], q[1], q[2], q[3]);
    if (!(l > 1e-6) || !Number.isFinite(l)) { q[0] = q[1] = q[2] = 0; q[3] = 1; return; }
    q[0] /= l; q[1] /= l; q[2] /= l; q[3] /= l;
  },
};

// ---------------------------------------------------------------- track / ball skins
// Track themes style the plank only: deck pattern 0 carbon weave, 1 brushed metal, 2 wood, 3 marble.
const TRACK_THEMES = [
  { name: { fr: 'NÉON CARBONE', en: 'NEON CARBON' }, pattern: 0, deckA: hex(0x151a26), deckB: hex(0x0b0e16), trim: hex(0x8a93a8), under: hex(0x1a1f2c),
    metal: hex(0x3b4356), accent: hex(0x4ef2ff), accent2: hex(0xff4fd8), hazard: hex(0xffc93c), gloss: 0.55,
    swatch: 'linear-gradient(135deg,#0b0e16,#1b2233 55%,#4ef2ff 56%,#4ef2ff 64%,#0b0e16 65%)' },
  { name: { fr: 'ACIER & OR', en: 'STEEL & GOLD' }, pattern: 1, deckA: hex(0x9aa1ab), deckB: hex(0x6d737d), trim: hex(0xe0b060), under: hex(0x2a2d33),
    metal: hex(0x5a5f69), accent: hex(0xffb347), accent2: hex(0xff5e3a), hazard: hex(0xffd23c), gloss: 0.8,
    swatch: 'linear-gradient(135deg,#6d737d,#b9c0ca 55%,#e0b060 56%,#e0b060 64%,#6d737d 65%)' },
  { name: { fr: 'JOUET BOIS', en: 'WOODEN TOY' }, pattern: 2, deckA: hex(0xb07a45), deckB: hex(0x7a4a22), trim: hex(0xd8b25a), under: hex(0x3a2414),
    metal: hex(0xb08a3a), accent: hex(0x9dff6a), accent2: hex(0xff5a5a), hazard: hex(0xff4a3a), gloss: 0.35,
    swatch: 'linear-gradient(135deg,#7a4a22,#c08a52 55%,#9dff6a 56%,#9dff6a 64%,#7a4a22 65%)' },
  { name: { fr: 'MARBRE GLACE', en: 'ICE MARBLE' }, pattern: 3, deckA: hex(0xd6dce6), deckB: hex(0x98a4ba), trim: hex(0xd0e4ff), under: hex(0x3a4458),
    metal: hex(0x8a98b0), accent: hex(0x8a7aff), accent2: hex(0x4ad8ff), hazard: hex(0xff5a8a), gloss: 0.9,
    swatch: 'linear-gradient(135deg,#a8b4c8,#f2f5fa 55%,#8a7aff 56%,#8a7aff 64%,#a8b4c8 65%)' },
];
// Ball skins: type 0 polished metal, 1 glass, 2 plasma, 3 candy plastic; rough = surface roughness (0 = mirror)
const BALL_SKINS = [
  { name: { fr: 'CHROME', en: 'CHROME' }, type: 0, rough: 0.025, base: hex(0xe8edf5), glow: hex(0x9fe8ff), swatch: 'radial-gradient(circle at 35% 30%,#fff,#aab4c4 40%,#3a4250 75%,#cfd8e6)' },
  { name: { fr: 'VERRE', en: 'GLASS' }, type: 1, rough: 0.0, base: hex(0x8ff0ff), glow: hex(0x4ef2ff), swatch: 'radial-gradient(circle at 35% 30%,#fff,#bff7ff 25%,rgba(80,200,255,.5) 60%,#1a6a9a)' },
  { name: { fr: 'OR', en: 'GOLD' }, type: 0, rough: 0.07, base: hex(0xffc85a), glow: hex(0xffd36b), swatch: 'radial-gradient(circle at 35% 30%,#fffbe0,#ffcf5a 35%,#8a5a10 75%,#ffe08a)' },
  { name: { fr: 'PLASMA', en: 'PLASMA' }, type: 2, rough: 0.03, base: hex(0x1a1030), glow: hex(0xff4fd8), swatch: 'radial-gradient(circle at 35% 30%,#ff9ae8,#6a1a8a 40%,#10081a 70%,#ff4fd8)' },
  { name: { fr: 'BONBON', en: 'CANDY' }, type: 3, rough: 0.07, base: hex(0xff3a5a), glow: hex(0xff8a9a), swatch: 'radial-gradient(circle at 35% 30%,#fff,#ff6a80 30%,#c01a3a 75%,#ff8aa0)' },
];

// ---------------------------------------------------------------- world zones

    if (this.afterBoost) { this.afterBoost = false; this.last = 'curve'; return this.curve(d, W, true); }
    const wts = {
      straight: lerp(2.6, 1.0, d), curve: lerp(3.0, 2.2, d), zigzag: d > 0.04 ? lerp(1.2, 2.4, d) : 0,
      narrow: d > 0.1 ? lerp(0.6, 1.5, d) : 0, banked: d > 0.14 ? lerp(0.7, 1.5, d) : 0,
      holes: d > 0.06 ? lerp(1.0, 2.0, d) : 0, gaps: d > 0.12 ? lerp(0.7, 1.3, d) : 0,
      obstacles: d > 0.16 ? lerp(0.8, 1.6, d) : 0, hairpin: d > 0.38 ? lerp(0.6, 1.2, d) : 0,
      descent: lerp(0.7, 1.0, d),
    };
    if (this.last && this.last !== 'curve') wts[this.last] *= 0.15;
    let tot = 0; for (const k in wts) tot += wts[k];
    let x = r.next() * tot, pick = 'curve';
    for (const k in wts) { x -= wts[k]; if (x <= 0) { pick = k; break; } }
    this.last = pick;
    switch (pick) {
      case 'straight': return this.straight(d, W);
      case 'zigzag': return this.zigzag(d, W);
      case 'narrow': return this.narrow(d);
      case 'banked': return this.banked(d, W);
      case 'holes': return this.holes(d);
      case 'gaps': return this.gaps(d);
      case 'obstacles': return this.obstacles(d);
      case 'hairpin': return this.hairpin(d, W);
      case 'descent': return this.descent(d, W);
      default: return this.curve(d, W, false);
    }
  }

  // ------------------------------------------------------------- sections
  startPad() {
    return this.mk(34, () => ({ k: 0, w: 3.6, b: 0, sl: -0.01 }), (k, m) => { if (k < 3) this.T.rowF[m] |= RF.START; }, null, 'start');
  }
  // Checkpoint: a calm, wide, straight pad with the gate on a round distance. Random runs restart
  // here after a fall, so it must be safe to stand still on: no holes, boosters or obstacles.
  checkPad(W) {
    const w = Math.max(W, 3), s0 = this.T.n * CFG.DS;
    const gateS = CFG.START_S + Math.ceil((s0 + 12 - CFG.START_S) / 10) * 10, gk = Math.round((gateS - s0) / CFG.DS);
    while (this.nextCheck <= gateS) this.nextCheck += CFG.CHECKPOINT;
    return this.mk(gateS - s0 + 16, () => ({ k: 0, w, b: 0, sl: -0.01 }), (k, m) => { if (k === gk) this.T.rowF[m] |= RF.CHECK; }, (k, s) => {
      if (k === gk) this.T.objects.push({ kind: 'gate', s, u: 0, id: this.count++, cp: Math.round(s - CFG.START_S) });
    }, 'checkpoint');
  }
  straight(d, W) {
    const r = this.rng, boost = r.chance(0.3 + d * 0.2), L = boost ? r.range(32, 40) : r.range(16, 30), n = Math.round(L / CFG.DS);
    const gemLane = r.range(-0.6, 0.6) * (W / 2 - 0.5), gemAt = r.chance(0.7) ? Math.round(n * 0.3) : -1;
    if (boost) this.afterBoost = true;
    return this.mk(L, () => this.flat(W, -0.035), (k, m) => {
      if (boost && k >= 4 && k < 8) this.T.rowF[m] |= RF.BOOST;
    }, (k, s) => {
      if (gemAt >= 0 && k >= gemAt && k < gemAt + 20 && (k - gemAt) % 4 === 0) this.gem(s, gemLane);
    }, 'straight');
  }
  descent(d, W) {
    const r = this.rng, L = r.range(24, 38), n = Math.round(L / CFG.DS);
    const lane = r.range(-0.5, 0.5) * (W / 2 - 0.5);
    this.afterBoost = true;
    return this.mk(L, (k) => ({ k: 0, w: W + 0.3, b: 0, sl: k < n * 0.75 ? -0.13 : -0.02 }), (k, m) => {
      if (k >= 2 && k < 6) this.T.rowF[m] |= RF.BOOST;
    }, (k, s) => { if (k > 14 && k < n - 10 && k % 6 === 0) this.gem(s, lane + Math.sin(k * 0.2) * 0.4); }, 'descent');
  }
  curve(d, W, gentle) {
    const r = this.rng;
    const kMax = gentle ? 0.05 : lerp(0.085, 0.2, d);
    const kap = r.range(gentle ? 0.03 : 0.045, kMax);
    const sg = this.turnSign(0.8);
    const ang = Math.max(0.35, Math.min(r.range(0.7, gentle ? 1.3 : 2.1), 1.4 - sg * this.th));
    const L = ang / kap;
    const rails = !gentle && kap > 0.1 && r.chance(lerp(0.8, 0.15, d));
    const gems = r.chance(0.55);
    const n = Math.round(L / CFG.DS);
    const w = W + (kap > 0.12 ? 0.25 : 0);
    return this.mk(L, () => ({ k: sg * kap, w, b: 0, sl: -0.02 }), (k, m) => {
      if (rails && k > 2 && k < n - 2) this.T.rowF[m] |= sg > 0 ? RF.RAIL_R : RF.RAIL_L;
    }, (k, s) => {
      if (gems && k > 4 && k < n - 4 && k % 5 === 0) this.gem(s, -sg * 0.35 * (w / 2 - 0.4)); // inside of the bend
    }, 'curve');
  }
  hairpin(d, W) {
    const r = this.rng, kap = lerp(0.17, 0.25, d) * r.range(0.9, 1.05), ang = r.range(1.9, 2.6);
    const sg = this.turnSign(1.0);
    const turnAng = Math.max(0.6, Math.min(ang, 1.4 - sg * this.th));
    const L = turnAng / kap, n = Math.round(L / CFG.DS);
    const rails = r.chance(lerp(0.7, 0.2, d));
    return this.mk(L + 6, (k) => ({ k: k < 12 ? 0 : sg * kap, w: W + 0.35, b: 0, sl: 0 }), (k, m) => {
      if (rails && k > 14 && k < n + 10) this.T.rowF[m] |= sg > 0 ? RF.RAIL_R : RF.RAIL_L;
    }, null, 'hairpin');
  }
  zigzag(d, W) {
    const r = this.rng, turns = r.int(3, 4 + Math.round(d * 3));
    const segL = lerp(8.5, 5, d) * r.range(0.9, 1.15);
    const kap = Math.max(0.03, Math.min(lerp(0.08, 0.2, d) * r.range(0.85, 1.05), 2 * (1.35 - Math.abs(this.th)) / segL));
    const per = Math.round(segL / CFG.DS);
    let sg = r.sign();
    // keep zigzag centered on the current heading: the first half-segment starts the swing
    if (this.th > 0.3) sg = -1; else if (this.th < -0.3) sg = 1;
    const w = W + 0.1;
    return this.mk(segL * turns + segL * 0.5, (k) => {
      const seg = Math.floor((k + per / 2) / per);
      return { k: (seg % 2 === 0 ? sg : -sg) * kap, w, b: 0, sl: -0.03 };
    }, null, (k, s) => { if (k % per === Math.floor(per / 2) && r.chance(0.4)) this.gem(s, 0); }, 'zigzag');
  }
  narrow(d) {
    const r = this.rng, wN = lerp(1.9, 1.3, d) * r.range(0.95, 1.08), L = r.range(12, 22) + d * 8;
    const wig = r.range(0.015, 0.04) * (0.5 + d), ph = r.range(0, TAU), n = Math.round(L / CFG.DS);
    return this.mk(L, (k) => ({ k: k > 8 && k < n - 4 ? Math.sin(k * 0.09 + ph) * wig : 0, w: wN, b: 0, sl: -0.025 }), null,
      (k, s) => { if (k > 10 && k % 7 === 0 && r.chance(0.6)) this.gem(s, 0); }, 'narrow');
  }
  banked(d, W) {
    const r = this.rng, bank = lerp(0.12, 0.23, d) * r.sign(), L = r.range(16, 26), n = Math.round(L / CFG.DS);
    const velodrome = r.chance(0.5);
    // velodrome: turn toward the low side (bank helps). Tilted straight: bank pushes to an edge.
    const sg = velodrome ? this.turnSign(1.0) : 1;
    const kap = velodrome ? Math.min(lerp(0.07, 0.15, d), Math.max(0, 1.4 - sg * this.th) / (L - 5)) : r.range(-0.02, 0.02);
    const b = velodrome ? -sg * Math.abs(bank) : bank;
    return this.mk(L, (k) => ({ k: k > 4 && k < n - 6 ? sg * kap : 0, w: W + 0.3, b: k < n - 8 ? b : 0, sl: -0.02 }), null,
      (k, s) => { if (k > 8 && k < n - 8 && k % 6 === 0) this.gem(s, Math.sign(b) * 0.4); }, 'banked');
  }
  holes(d) {
    const r = this.rng, W = lerp(2.9, 2.6, d), L = r.range(22, 34) + d * 10, n = Math.round(L / CFG.DS);
    const minLane = 1.12;
    // Pre-plan hole rows (index -> {type, extent}); first 10 rows let the width settle.
    const plan = new Map(); const gems = [];
    let k = 10, side = r.sign();
    while (k < n - 8) {
      const hl = Math.round(r.range(1.4, 2.2 + d * 1.0) / CFG.DS);
      const type = d > 0.3 && r.chance(0.3) ? 'center' : 'side';
      for (let j = 0; j < hl; j++) plan.set(k + j, { type, side });
      gems.push({ k: k + (hl >> 1), u: type === 'center' ? side * (W / 2 - 0.45) : -side * (W / 2 - 0.55) });
      k += hl + Math.round(r.range(lerp(8, 4.2, d), lerp(12, 6, d)) / CFG.DS);
      side = r.chance(0.75) ? -side : side;
    }
    return this.mk(L, (kk) => ({ k: 0, w: W, b: 0, sl: -0.02 }), (kk, m) => {
      const h = plan.get(kk); if (!h) return;
      const T = this.T, w = this.w, j = m * 3;
      if (h.type === 'side') {
        const keep = Math.max(minLane, w * lerp(0.52, 0.42, d));
        if (h.side > 0) { T.rowA[j] = -w / 2; T.rowAO[j] = 1; T.rowB[j] = -w / 2 + keep; T.rowBO[j] = 0; }
        else { T.rowA[j] = w / 2 - keep; T.rowAO[j] = 0; T.rowB[j] = w / 2; T.rowBO[j] = 1; }
      } else {
        const lane = Math.max(0.95, (w - lerp(0.8, 1.0, d)) / 2);
        T.rowN[m] = 2;
        T.rowA[j] = -w / 2; T.rowAO[j] = 1; T.rowB[j] = -w / 2 + lane; T.rowBO[j] = 0;
        T.rowA[j + 1] = w / 2 - lane; T.rowAO[j + 1] = 0; T.rowB[j + 1] = w / 2; T.rowBO[j + 1] = 1;
      }
    }, (kk, s) => { for (const g of gems) if (g.k === kk) this.gem(s, g.u); }, 'holes');
  }
  gaps(d) {
    const r = this.rng, W = 2.7, count = r.int(2, 2 + Math.round(d * 2));
    const pattern = []; // row states: 0 solid, 1 gap
    const push = (len, v) => { for (let j = 0; j < Math.round(len / CFG.DS); j++) pattern.push(v); };
    push(3, 0); push(1.5, 2); push(6, 0); // booster (2), then run-up
    for (let c = 0; c < count; c++) {
      push(lerp(1.0, 1.9, d) + r.range(0, 0.3), 1);
      push(c === count - 1 ? 10 : r.range(4.5, 7), 0);
    }
    const drop = 0.5;
    this.afterBoost = true;
    return this.mk(pattern.length * CFG.DS, (k) => {
      const v = pattern[k];
      if (v === 1) {
        let gl = 0; for (let j = k; j >= 0 && pattern[j] === 1; j--) gl++;
        let gr = 0; for (let j = k; j < pattern.length && pattern[j] === 1; j++) gr++;
        return { k: 0, w: W, b: 0, sl: 0, drop: -drop / ((gl + gr - 1) * CFG.DS) };
      }
      return { k: 0, w: W, b: 0, sl: 0, drop: 0 };
    }, (k, m) => {
      if (pattern[k] === 1) this.T.rowN[m] = 0;
      if (pattern[k] === 2) this.T.rowF[m] |= RF.BOOST;
    }, (k, s) => { if (pattern[k] === 1 && pattern[k - 1] === 0) this.gem(s, 0, 0.9); }, 'gaps');
  }
  obstacles(d) {
    const r = this.rng, W = lerp(3.0, 2.8, d), L = r.range(22, 32), n = Math.round(L / CFG.DS);
    const slider = d > 0.3 && r.chance(0.5);
    const ks = new Map();
    let k = 12, side = r.sign();
    while (k < n - 8) {
      if (slider && r.chance(0.5)) {
        ks.set(k, { kind: 'slider', amp: W / 2 - 0.55, period: r.range(2.4, 3.4) - d * 0.4, phase: r.range(0, TAU) });
      } else {
        // post leaving a lane of at least 1.35 m on the other side
        ks.set(k, { kind: 'post', u: side * (W / 2 - r.range(0.45, 0.75)) });
        side = -side;
      }
      k += Math.round(r.range(lerp(10, 6, d), lerp(14, 8, d)) / CFG.DS);
    }
    return this.mk(L, () => ({ k: 0, w: W, b: 0, sl: -0.02 }), null, (kk, s) => {
      const o = ks.get(kk); if (!o) return;
      if (o.kind === 'post') { this.T.objects.push({ kind: 'post', s, u: o.u, rad: 0.3, id: this.count++ }); this.gem(s, -o.u * 0.6); }
      else this.T.objects.push({ kind: 'slider', s, u: 0, rad: 0.42, amp: o.amp, period: o.period, phase: o.phase, id: this.count++ });
    }, 'obstacles');
  }
}

// =====================================================================
// Shaders (GLSL ES 1.0 / WebGL1 for maximum device coverage)
// =====================================================================
const GLSL_COMMON = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.0-2.0*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), u.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), u.x), u.y); }
float fbm(vec2 p){ return noise(p)*0.55 + noise(p*2.07+3.1)*0.28 + noise(p*4.3+7.7)*0.17; }
float bit(float f, float b){ return mod(floor(f / b + 0.001), 2.0); }
vec2 equirect(vec3 d){ return vec2(atan(d.x, d.z) * 0.15915494 + 0.5, acos(clamp(d.y, -1.0, 1.0)) * 0.31830989); }
`;

// Lit surfaces: track chunks + props. Materials selected by a_mat.x
const VS_LIT = `
attribute vec3 a_pos; attribute vec3 a_nrm; attribute vec2 a_uv; attribute vec4 a_aux; attribute vec4 a_mat;
#ifdef INST
attribute vec4 a_m0; attribute vec4 a_m1; attribute vec4 a_m2; attribute vec4 a_m3; attribute vec4 a_ic;
#else
uniform mat4 u_model; uniform vec3 u_color; uniform float u_emis;
#endif
uniform mat4 u_vp; uniform float u_collapse; uniform float u_time;
varying vec3 v_wp; varying vec3 v_n; varying vec2 v_uv; varying vec4 v_aux; varying vec4 v_mat; varying float v_warn; varying vec4 v_ic;
void main(){
#ifdef INST
  mat4 model = mat4(a_m0, a_m1, a_m2, a_m3); v_ic = a_ic;      // per-instance transform + color/emissive
#else
  mat4 model = u_model; v_ic = vec4(u_color, u_emis);
#endif
  vec4 wp = model * vec4(a_pos, 1.0);
  vec3 n = (model * vec4(a_nrm, 0.0)).xyz;
  float dt = u_collapse - a_aux.x;          // seconds-ish since this row started falling
  v_warn = 0.0;
  if (dt > -3.0 && a_aux.x < 1e8) {
    if (dt > 0.0) {
      float t = dt * 0.2;
      float sd = a_aux.y - 0.5;
      wp.y -= 9.0 * t * t + t * 1.5;
      wp.x += sd * t * 3.0; wp.z += sd * t * 2.0;
      float a = sd * t * 2.5; float c = cos(a), s = sin(a);
      n = vec3(n.x * c - n.y * s, n.x * s + n.y * c, n.z);
      v_warn = 1.0;
    } else {
      float k = 1.0 + dt / 3.0;
      wp.y += sin(u_time * 47.0 + a_aux.y * 40.0) * 0.018 * k * k;
      v_warn = k * k;
    }
  }
  v_wp = wp.xyz; v_n = n; v_uv = a_uv; v_aux = a_aux; v_mat = a_mat;
  gl_Position = u_vp * wp;
}`;

const FS_LIT = GLSL_COMMON + `
varying vec3 v_wp; varying vec3 v_n; varying vec2 v_uv; varying vec4 v_aux; varying vec4 v_mat; varying float v_warn; varying vec4 v_ic;
uniform vec3 u_cam; uniform vec3 u_sunDir; uniform vec3 u_sunCol; uniform vec3 u_fogCol; uniform vec3 u_abyss; uniform vec3 u_skyMid;
uniform vec3 u_deckA; uniform vec3 u_deckB; uniform vec3 u_trim; uniform vec3 u_under; uniform vec3 u_metal;
uniform vec3 u_accent; uniform vec3 u_accent2; uniform vec3 u_hazard;
uniform float u_pattern; uniform float u_gloss; uniform float u_time; uniform float u_fogDen; uniform float u_fogBase;
uniform vec4 u_ball; uniform vec3 u_ballGlow; uniform float u_ballLight; uniform float u_shadow;
uniform float u_fogK;
uniform sampler2D u_env; uniform sampler2D u_env2; uniform float u_envMix;

vec3 envLookup(vec3 d){ vec2 q = equirect(d); return mix(texture2D(u_env, q).rgb, texture2D(u_env2, q).rgb, u_envMix); }

vec3 deck(vec2 uv, float seed, out float gloss){
  vec3 c; gloss = u_gloss;
  if (u_pattern < 0.5) {            // carbon twill
    vec2 q = uv * 7.0; float tw = step(0.5, fract((floor(q.x) + floor(q.y)) * 0.5));
    float fib = sin((tw > 0.5 ? q.x : q.y) * 18.85) * 0.5 + 0.5;
    c = mix(u_deckB, u_deckA, tw * 0.6 + fib * 0.4);
    gloss *= 0.8 + 0.2 * fib;
  } else if (u_pattern < 1.5) {     // brushed metal plates
    float st = noise(vec2(uv.x * 0.7, uv.y * 90.0)) * 0.6 + noise(vec2(uv.x * 3.0, uv.y * 260.0)) * 0.4;
    float plate = hash(vec2(floor(uv.x * 0.5), floor(uv.y * 1.2 + 10.0)));
    c = mix(u_deckB, u_deckA, st * 0.7 + plate * 0.3);
  } else if (u_pattern < 2.5) {     // wood boards
    float board = floor(uv.y * 2.6 + 20.0);
    float off = hash(vec2(board, 3.0)) * 7.0;
    float plank = floor((uv.x + off) / 3.0);
    float h = hash(vec2(board, plank));
    float grain = fbm(vec2((uv.x + off) * 0.9, uv.y * 14.0 + h * 9.0));
    float rings = sin(grain * 18.0 + uv.y * 30.0) * 0.5 + 0.5;
    c = mix(u_deckB, u_deckA, 0.35 + h * 0.4 + rings * 0.25);
    float seam = smoothstep(0.035, 0.0, abs(fract(uv.y * 2.6) - 0.0)) + smoothstep(0.96, 1.0, fract(uv.y * 2.6));
    float seam2 = smoothstep(0.02, 0.0, abs(fract((uv.x + off) / 3.0) - 0.0) * 3.0);
    c *= 1.0 - 0.55 * clamp(seam + seam2, 0.0, 1.0);
  } else {                           // marble
    float f = fbm(uv * vec2(0.35, 0.8) + seed * 0.1);
    float vein = pow(1.0 - abs(sin((uv.x * 0.45 + uv.y * 1.2 + f * 5.0) * 1.7)), 14.0);
    float vein2 = pow(1.0 - abs(sin((uv.x * 0.9 - uv.y * 0.6 + f * 7.0) * 2.3)), 22.0);
    c = mix(u_deckA, u_deckB, clamp(vein * 0.8 + vein2 * 0.5 + f * 0.25, 0.0, 1.0));
  }
  return c;
}

void main(){
  vec3 N = normalize(v_n + vec3(0.0, 1e-5, 0.0));
  vec3 V = normalize(u_cam - v_wp);
  float mat = v_mat.x, flags = v_mat.y, halfW = v_mat.z;
  vec3 base = u_metal; float gloss = 0.4; float spec = 0.5; vec3 emis = vec3(0.0); float glow = 0.0; float metal = 0.3;

  if (mat < 0.5) {                                   // deck top
    float s = v_uv.x, u = v_uv.y;
    base = deck(v_uv, v_aux.y, gloss); spec = 0.6;
    float seamD = abs(fract(s * 0.5) - 0.5) * 2.0;    // plank joints every 2 m
    float jt = smoothstep(0.012, 0.0, abs(seamD - 1.0) * 1.0) ;
    base *= 1.0 - 0.6 * smoothstep(0.985, 1.0, seamD);
    float dEdge = halfW - abs(u);
    // trim band along outer edges
    float band = smoothstep(0.2, 0.18, dEdge);
    base = mix(base, u_trim * 0.8, band * 0.75);
    // rivets
    vec2 rv = vec2(fract(s) - 0.5, dEdge - 0.1);
    float rr = length(rv);
    float riv = smoothstep(0.038, 0.028, rr) * step(dEdge, 0.2);
    base = mix(base, u_trim * 1.25 + 0.15, riv); spec += riv * 2.0;
    // center guide dashes (subtle, give speed feeling)
    float dash = step(0.55, fract(s * 0.5)) * smoothstep(0.03, 0.015, abs(u));
    emis += u_accent * dash * 0.55; glow += dash * 0.35;
    // edge light line
    float el = smoothstep(0.05, 0.0, abs(dEdge - 0.21));
    emis += u_accent * el * 0.9; glow += el * 0.6;
    // hazard stripes near hole edges / gap edges
    float hz = 0.0;
    if (bit(flags, 1.0) > 0.5) hz = max(hz, smoothstep(0.26, 0.24, u - v_aux.z));
    if (bit(flags, 2.0) > 0.5) hz = max(hz, smoothstep(0.26, 0.24, v_aux.w - u));
    float rowT = (s - v_aux.x) / 0.5;
    if (bit(flags, 4.0) > 0.5) hz = max(hz, smoothstep(0.62, 0.55, rowT));
    if (bit(flags, 8.0) > 0.5) hz = max(hz, smoothstep(0.38, 0.45, rowT));
    if (hz > 0.0) {
      float str = step(0.5, fract((s + u) * 2.2));
      base = mix(base, mix(vec3(0.03), u_hazard, str), hz);
      emis += u_hazard * hz * str * 0.25;
    }
    // booster chevrons
    if (bit(flags, 16.0) > 0.5) {
      float ch = fract(s * 0.9 - abs(u) * 0.7 - u_time * 2.6);
      float c1 = smoothstep(0.0, 0.08, ch) * smoothstep(0.5, 0.36, ch);
      float lane = smoothstep(halfW - 0.18, halfW - 0.3, abs(u));
      base = mix(base, base * 0.3, lane);
      emis += u_accent2 * c1 * lane * 2.2; glow += c1 * lane * 1.2;
    }
    if (bit(flags, 32.0) > 0.5) {                    // checkpoint line
      float cl = smoothstep(0.2, 0.0, abs(fract(s * 0.5 + 0.5) - 0.5) - 0.02);
      emis += mix(u_accent, vec3(1.0), 0.4) * 1.3; glow += 0.9;
    }
    if (bit(flags, 64.0) > 0.5) {                    // start checkers
      float ck = mod(floor(s * 3.0) + floor(u * 3.0 + 30.0), 2.0);
      base = mix(vec3(0.05), vec3(0.92), ck);
    }
  } else if (mat < 1.5) {                             // outer side wall with light strip
    float v = v_uv.y;
    base = u_trim * 0.4; gloss = 0.45; spec = 0.5; metal = 0.8;
    float strip = smoothstep(0.1, 0.03, abs(v - 0.42));
    float pulse = 0.55 + 0.45 * sin(v_uv.x * 0.8 - u_time * 5.0);
    emis += u_accent * strip * (0.6 + 0.9 * pulse); glow += strip * pulse;
    base *= 1.0 - 0.4 * smoothstep(0.7, 0.72, v);
    float vent = step(0.8, v) * step(0.5, fract(v_uv.x * 5.0));
    base *= 1.0 - 0.3 * vent;
  } else if (mat < 2.5) {                             // underside panels
    base = u_under; gloss = 0.2; spec = 0.2;
    float g = max(smoothstep(0.03, 0.0, abs(fract(v_uv.x * 0.5) - 0.5) - 0.47), smoothstep(0.03, 0.0, abs(fract(v_uv.y * 0.8) - 0.5) - 0.47));
    base *= 1.0 - 0.5 * g;
  } else if (mat < 3.5) {                             // mechanical parts
    base = u_metal; gloss = 0.55; spec = 1.0; metal = 0.9;
    base *= 0.8 + 0.3 * noise(v_uv * vec2(6.0, 18.0));
  } else if (mat < 4.5) {                             // accent light
    float bl = 0.65 + 0.35 * sin(u_time * 3.0 + v_aux.y * 20.0);
    base = u_accent * 0.2; emis = u_accent * (1.4 * v_mat.w) * bl; glow = 1.0 * bl;
  } else if (mat < 5.5) {                             // rails (chrome)
    base = mix(u_trim, vec3(0.9), 0.5); gloss = 0.95; spec = 2.0; metal = 1.0;
  } else if (mat < 6.5) {                             // raised rim
    base = u_trim; gloss = 0.8; spec = 1.6; metal = 0.9;
  } else if (mat < 7.5) {                             // accent2 light
    base = u_accent2 * 0.2; emis = u_accent2 * 1.5 * v_mat.w; glow = 1.0;
  } else if (mat < 8.5) {                             // hazard striped prop (sliders)
    float str = step(0.5, fract((v_uv.x + v_uv.y) * 4.0));
    base = mix(vec3(0.05), u_hazard, str); gloss = 0.7; spec = 1.2;
    emis += u_hazard * str * 0.15;
  } else if (mat < 9.5) {                             // generic prop colored by uniform
    base = v_ic.rgb; gloss = 0.75; spec = 1.4; metal = 0.7;
    float band = smoothstep(0.04, 0.0, abs(v_uv.y - 0.82) - 0.05);
    emis += u_accent * band * 1.6; glow += band;
  } else if (mat < 10.5) {                            // gem
    base = v_ic.rgb * 0.55; gloss = 0.9; spec = 1.6; metal = 0.5;
    float facet = abs(dot(N, normalize(vec3(0.3, 0.8, 0.5))));
    emis = v_ic.rgb * (0.28 + 0.35 * facet + 0.12 * sin(u_time * 5.0 + v_wp.x)) * v_ic.a; glow = 0.7;
  } else if (mat < 11.5) {                            // gate / monolith frame lights
    float e = max(smoothstep(0.1, 0.0, min(v_uv.x, 1.0 - v_uv.x)), smoothstep(0.1, 0.0, min(v_uv.y, 1.0 - v_uv.y)));
    base = u_metal * 0.5; gloss = 0.6; spec = 1.0;
    emis = v_ic.rgb * e * 1.8 * v_ic.a; glow = e * v_ic.a;
  } else if (mat < 12.5) {                            // hole walls / caps: dark + hazard glow line
    base = u_under * 0.7; gloss = 0.2; spec = 0.3;
    float top = smoothstep(0.16, 0.02, v_uv.y);
    emis += u_hazard * top * 1.1; glow += top * 0.8;
  } else if (mat < 13.5) {                            // tower with lit windows
    base = vec3(0.05, 0.06, 0.08); gloss = 0.5; spec = 0.6; metal = 0.6;
    vec2 w = v_uv * vec2(7.0, 44.0);
    vec2 f = fract(w);
    float win = step(0.2, f.x) * step(f.x, 0.8) * step(0.25, f.y) * step(f.y, 0.75);
    float on = step(0.55, hash(floor(w) + floor(v_wp.xz * 0.01)));
    float band = smoothstep(0.03, 0.0, abs(fract(v_uv.y * 3.0) - 0.5) - 0.47);
    emis = v_ic.rgb * (win * on * 0.9 + band * 1.2) * v_ic.a; glow = win * on * 0.5 + band;
  } else if (mat < 14.5) {                            // floating rock / island with grass top
    float grass = smoothstep(0.55, 0.8, N.y);
    float n = noise(v_wp.xz * 0.8 + v_wp.y);
    base = mix(v_ic.rgb * (0.45 + 0.25 * n), vec3(0.3, 0.52, 0.22) * (0.8 + 0.3 * n), grass); gloss = 0.1; spec = 0.15; metal = 0.0;
  } else if (mat < 15.5) {                            // neon wire triangles
    float e = min(min(1.0 - v_uv.x, v_uv.x - v_uv.y), v_uv.y);
    float ln = smoothstep(0.05, 0.0, e);
    base = vec3(0.02); gloss = 0.8; spec = 0.8;
    emis = v_ic.rgb * (ln * 2.2 + 0.06) * v_ic.a; glow = ln;
  } else if (mat < 16.5) {                            // glossy abstract primitives
    base = v_ic.rgb; gloss = 0.95; spec = 2.0; metal = 0.55;
    emis = v_ic.rgb * 0.08 * v_ic.a;
  } else if (mat < 17.5) {                            // chaos shard with glowing cracks
    base = vec3(0.07, 0.04, 0.04); gloss = 0.7; spec = 1.2; metal = 0.6;
    float c = abs(noise(v_wp.xz * 1.7 + v_wp.y * 1.3) * 2.0 - 1.0);
    float crack = smoothstep(0.1, 0.0, c) * (0.7 + 0.3 * sin(u_time * 6.0 + v_wp.y));
    emis = v_ic.rgb * crack * 2.0 * v_ic.a; glow = crack;
  } else if (mat < 18.5) {                            // solid glow
    base = vec3(0.0); gloss = 0.0; spec = 0.0;
    emis = v_ic.rgb * v_ic.a; glow = clamp(v_ic.a * 0.8, 0.0, 1.0);
  } else if (mat < 19.5) {                            // foliage: leafy clumps, sunlight through the edges
    float n = noise(v_wp.xz * 0.7 + v_wp.y * 0.9) * 0.6 + noise(v_wp.xy * 2.1 + v_wp.z * 1.3) * 0.4;
    base = v_ic.rgb * (0.62 + 0.6 * n); gloss = 0.12; spec = 0.1; metal = 0.0;
    float back = pow(max(dot(-V, u_sunDir), 0.0), 3.0) * (1.0 - max(dot(N, u_sunDir), 0.0));
    emis = v_ic.rgb * u_sunCol * (back * 0.22 + 0.03);
  } else if (mat < 20.5) {                            // bark / wood
    float g = noise(vec2(v_uv.x * 22.0, v_wp.y * 0.35)) * 0.7 + noise(vec2(v_uv.x * 60.0, v_wp.y * 1.7)) * 0.3;
    base = vec3(0.34, 0.21, 0.13) * (0.55 + 0.6 * g); gloss = 0.1; spec = 0.1; metal = 0.0;
  } else if (mat < 21.5) {                            // hot-air balloon: coloured gores and a crown band
    float gore = step(0.5, fract(v_uv.x * 6.0)), band = step(v_uv.y, 0.2) + step(0.86, v_uv.y);
    base = mix(mix(vec3(0.97, 0.93, 0.84), v_ic.rgb, gore), v_ic.rgb * 0.55, clamp(band, 0.0, 1.0)); gloss = 0.35; spec = 0.35; metal = 0.0;
  } else if (mat < 22.5) {                            // lighthouse: painted bands
    float band = step(0.5, fract(v_uv.y * 3.0 + 0.25));
    base = mix(vec3(0.95, 0.95, 0.93), v_ic.rgb, band); gloss = 0.45; spec = 0.5; metal = 0.0;
  } else if (mat < 23.5) {                            // sandstone: strata, eroded grain, sandy tops
    float y = v_wp.y * 0.32 + noise(v_wp.xz * 0.05) * 2.5;
    float strata = sin(y * 3.1) * 0.5 + 0.5, n = noise(v_wp.xz * 0.45 + v_wp.y * 0.25);
    base = v_ic.rgb * (0.68 + 0.22 * strata + 0.2 * n);
    base = mix(base, vec3(0.94, 0.76, 0.5), smoothstep(0.72, 0.92, N.y) * 0.85); gloss = 0.08; spec = 0.1; metal = 0.0;
  } else if (mat < 24.5) {                            // cactus: ribs and spines
    float rib = abs(sin(v_uv.x * 62.83));
    float sp = step(0.9, hash(floor(v_uv * vec2(60.0, 90.0) + floor(v_wp.xz))));
    base = v_ic.rgb * (0.62 + 0.38 * rib) + sp * 0.25; gloss = 0.3; spec = 0.3; metal = 0.0;
  } else if (mat < 25.5) {                            // painted surface
    base = v_ic.rgb; gloss = 0.45; spec = 0.5; metal = 0.05;
  } else {                                            // sail cloth
    base = vec3(0.96, 0.95, 0.92); gloss = 0.2; spec = 0.2; metal = 0.0;
  }

  // collapse warning tint
  if (v_warn > 0.0) { emis += vec3(1.0, 0.12, 0.2) * v_warn * 0.8 * (0.6 + 0.4 * sin(u_time * 20.0)); glow += v_warn * 0.5; }

  // ---- lighting
  vec3 L = u_sunDir;
  float ndl = max(dot(N, L), 0.0);
  vec3 H = normalize(L + V);
  float sp = pow(max(dot(N, H), 0.0), mix(16.0, 180.0, gloss)) * spec;
  vec3 amb = mix(u_abyss * 0.35, u_skyMid * 0.9 + 0.08, N.y * 0.5 + 0.5);
  float fres = pow(1.0 - max(dot(N, V), 0.0), 4.0);
  vec3 R = reflect(-V, N);
  vec3 env = envLookup(R);
  vec3 col = base * (amb * 0.75 + u_sunCol * ndl * 0.95) * (1.0 - metal * 0.45);
  col += env * (mix(0.04, 0.55, metal) * gloss + fres * gloss * 0.6) * mix(vec3(1.0), base * 1.6 + 0.2, metal * 0.6);
  col += u_sunCol * sp;

  // ball: contact shadow + light spill
  vec3 d = v_wp - u_ball.xyz;
  float hgt = max(0.0, -d.y);
  if (N.y > 0.3) {
    float r = u_ball.w * (1.05 + hgt * 0.25);
    float sh = smoothstep(r * 1.25, r * 0.15, length(d.xz)) * u_shadow * clamp(1.4 - hgt * 0.35, 0.0, 1.0);
    col *= 1.0 - sh * 0.72;
  }
  float bd = length(d);
  col += u_ballGlow * (u_ballLight / (1.0 + bd * bd * 1.8)) * max(dot(N, -d / max(bd, 0.001)), 0.0);

  col += emis;
  // ---- fog (distance + abyss haze)
  float dist = length(v_wp - u_cam);
  float fog = 1.0 - exp(-dist * u_fogDen);
  float below = clamp((u_fogBase - v_wp.y) * 0.009, 0.0, 1.0);
  fog = clamp((fog + below * 0.7) * u_fogK, 0.0, 1.0);
  vec3 fc = mix(u_fogCol, u_abyss * 0.8, below);
  col = mix(col, fc, fog);
  gl_FragColor = vec4(col, clamp(glow * (1.0 - fog), 0.0, 1.0));
}`;

// Ball: physically based look on a perfect sphere. It reflects a live cube map rendered from
// its center (the real track, coins and scenery), with Schlick fresnel and a sun glint.
// Materials: 0 polished metal with machined seams, 1 glass marble (refraction, inner vanes,
// caustic), 2 smoky shell over a glowing plasma core, 3 glossy candy plastic.
const VS_BALL = `
attribute vec3 a_pos; attribute vec3 a_nrm;
uniform mat4 u_vp; uniform mat4 u_model;
varying vec3 v_wp; varying vec3 v_on;
void main(){ vec4 wp = u_model * vec4(a_pos, 1.0); v_wp = wp.xyz; v_on = a_nrm; gl_Position = u_vp * wp; }`;

const FS_BALL = GLSL_COMMON + `
varying vec3 v_wp; varying vec3 v_on;
uniform vec3 u_cam; uniform vec3 u_sunDir; uniform vec3 u_sunCol; uniform vec3 u_floor; uniform vec3 u_accent;
uniform vec3 u_base; uniform vec3 u_glowCol; uniform float u_type; uniform float u_rough; uniform float u_time; uniform float u_speed; uniform float u_fade; uniform float u_star;
uniform sampler2D u_env; uniform sampler2D u_envBlur; uniform sampler2D u_env2; uniform sampler2D u_envBlur2; uniform float u_envMix;
uniform samplerCube u_probe; uniform float u_probeOn; uniform float u_probeMips;
uniform vec3 u_center; uniform mat3 u_rot; uniform mat3 u_irot; uniform vec3 u_gN; uniform float u_gD;

vec3 env(vec3 d){ vec2 q = equirect(d); return mix(texture2D(u_env, q).rgb, texture2D(u_env2, q).rgb, u_envMix); }
vec3 envB(vec3 d){ vec2 q = equirect(d); return mix(texture2D(u_envBlur, q).rgb, texture2D(u_envBlur2, q).rgb, u_envMix); }
// Fallback without the live probe: sky panorama above, a suggested deck below.
vec3 world(vec3 R, float rough){
  vec3 e = mix(env(R), envB(R), clamp(rough * 4.0, 0.0, 1.0));
  float fl = smoothstep(0.02, -0.3, R.y);
  float stripes = smoothstep(0.92, 1.0, abs(sin(atan(R.x, R.z) * 3.0)));
  vec3 flo = u_floor * (0.35 + 0.4 * max(-R.y, 0.0)) + u_accent * stripes * 0.35 * smoothstep(-0.1, -0.35, R.y);
  return mix(e, flo, fl * 0.9);
}
// What the ball sees in direction d. rough: 0 mirror … 1 fully blurred (diffuse light).
vec3 scene(vec3 d, float rough){
  if (u_probeOn < 0.5) return world(d, rough);
#ifdef LOD
  return textureCubeLodEXT(u_probe, d, min(rough * u_probeMips, u_probeMips - 1.0)).rgb;
#else
  return textureCube(u_probe, d, rough * u_probeMips - 1.5).rgb;
#endif
}
// The probe is taken at the center: rays that hit the deck are corrected against its plane,
// so the reflection of the track meets the ball where it touches it.
vec3 look(vec3 P, vec3 R){
  float dn = dot(R, u_gN);
  if (dn < -0.01) { float t = (u_gD - dot(P, u_gN)) / dn; if (t > 0.0) return normalize(P + R * min(t, 60.0) - u_center); }
  return R;
}
// Normalized Blinn-Phong lobe (close to GGX for a sharp sun glint).
float lobe(float ndh, float rough){ float a = max(rough * rough, 0.0004); float p = min(2.0 / (a * a) - 2.0, 6000.0); return pow(ndh, p) * (p + 8.0) * 0.0398; }
float schlick(float f0, float c){ return f0 + (1.0 - f0) * pow(1.0 - c, 5.0); }

void main(){
  vec3 N = normalize(v_wp - u_center), V = normalize(u_cam - v_wp);
  vec3 o = normalize(v_on);                                   // object space: rolls with the ball
  vec3 L = u_sunDir, H = normalize(L + V);
  float ndv = max(dot(N, V), 0.001), ndl = max(dot(N, L), 0.0);
  float fr = pow(1.0 - ndv, 5.0), fh = pow(1.0 - max(dot(H, V), 0.0), 5.0);
  float ao = mix(0.5, 1.0, smoothstep(-0.97, -0.3, dot(N, u_gN)));   // the deck right under the ball
  vec3 col; float glow = 0.0; vec3 sun = vec3(0.0);
  if (u_type < 0.5) {
    // polished metal: V-grooves on the equator and a meridian, a light strip inside each
    float gy = abs(o.y), gx = abs(o.x);
    float wy = smoothstep(0.05, 0.012, gy), wx = smoothstep(0.035, 0.008, gx);
    float groove = max(wy, wx);
    vec3 no = normalize(o - vec3(sign(o.x) * wx * 0.9, sign(o.y) * wy * 0.9, 0.0));
    vec3 N2 = normalize(u_rot * no);
    float c2 = max(dot(N2, V), 0.001);
    vec3 F = u_base + (1.0 - u_base) * pow(1.0 - c2, 5.0);
    float rough = u_rough + groove * 0.2;
    vec3 R2 = reflect(-V, N2);
    // + a broad soft reflection of the sun (a studio "softbox"), so metal stays bright in dark worlds
    vec3 e = scene(look(v_wp, R2), rough);
    float sat = max(u_base.r, max(u_base.g, u_base.b)) - min(u_base.r, min(u_base.g, u_base.b));
    e = mix(e, vec3(dot(e, vec3(0.3, 0.55, 0.15))), 0.35 + 0.5 * sat);   // less colour cast: gold stays gold in a cyan world
    e += u_sunCol * (pow(max(dot(R2, L), 0.0), 6.0) * 0.8 + smoothstep(-0.1, 0.8, R2.y) * 0.14);
    col = e * F * mix(1.0, 0.3, groove) * mix(0.75, 1.0, ao);
    float strip = smoothstep(0.011, 0.0, gy) + smoothstep(0.007, 0.0, gx);
    col += u_glowCol * strip * (0.7 + u_speed * 1.4);
    glow = strip * 0.9;
    vec3 Fh = u_base + (1.0 - u_base) * fh;
    sun = Fh * (lobe(max(dot(N2, H), 0.0), rough) + lobe(max(dot(N2, H), 0.0), rough * 4.0 + 0.12) * 0.05) * ndl;
  } else if (u_type < 1.5) {
    // glass marble: reflection + the world seen through it (upside down, like a real marble)
    float F = schlick(0.04, ndv);
    vec3 refl = scene(look(v_wp, reflect(-V, N)), 0.0);
    vec3 T1 = refract(-V, N, 0.667);
    float tc = -2.0 * dot(N, T1);                             // chord through the unit sphere
    vec3 p2 = N + T1 * tc;                                    // exit point
    vec3 T2 = refract(T1, -p2, 1.5);
    if (dot(T2, T2) < 0.5) T2 = reflect(T1, -p2);
    vec3 tint = mix(vec3(1.0), u_base, 0.45);
    vec3 trans = scene(T2, 0.02) * tint * mix(vec3(1.0), u_base, clamp(tc * 0.25, 0.0, 1.0));
    // three twisted coloured vanes inside ("cat's eye"), marched along the chord
    vec3 ro = u_irot * N, rd = u_irot * T1, acc = vec3(0.0); float tr = 1.0, st = tc / 24.0, j = hash(gl_FragCoord.xy);
    for (int i = 0; i < 24; i++) {
      vec3 q = ro + rd * ((float(i) + j) * st);
      float r = length(q.xz), a = atan(q.z, q.x) + q.y * 2.0;
      float bl = abs(sin(a * 1.5)) * r;                          // distance to the nearest vane
      float k = smoothstep(0.11, 0.03, bl) * smoothstep(0.62, 0.48, length(q));
      vec3 vc = mix(u_glowCol * 1.15, vec3(1.0, 0.97, 0.92), smoothstep(0.06, 0.03, bl) * 0.35);
      float d = clamp(k * st * 4.5, 0.0, 1.0);
      acc += tr * d * vc * (0.6 + 0.4 * max(dot(u_rot * normalize(q + 0.001), L), 0.0));
      tr *= 1.0 - d * 0.9;
    }
    float caustic = pow(max(dot(p2, -L), 0.0), 28.0) * 1.6;    // sunlight focused on the far side
    col = refl * F + (trans * tr + acc + u_sunCol * tint * caustic * tr) * (1.0 - F);
    glow = 0.2 + caustic * 0.4 + dot(acc, vec3(0.2));
    sun = vec3(0.04 + 0.96 * fh) * (lobe(max(dot(N, H), 0.0), 0.015) + lobe(max(dot(N, H), 0.0), 0.1) * 0.05) * ndl;
  } else if (u_type < 2.5) {
    // smoky glass shell over a plasma core: glowing veins at several depths (real parallax)
    float F = schlick(0.05, ndv);
    vec3 refl = scene(look(v_wp, reflect(-V, N)), u_rough);
    vec3 T1 = refract(-V, N, 0.7);
    vec3 ro = u_irot * N, rd = u_irot * T1;
    float b0 = dot(ro, rd), acc = 0.0;
    // veins on three nested shells (front and back side of each): sharp lines with real depth
    for (int i = 0; i < 3; i++) {
      float rs = 0.9 - float(i) * 0.2, h = b0 * b0 - 1.0 + rs * rs, ph = float(i) * 1.7;
      if (h > 0.0) for (int k = 0; k < 2; k++) {
        vec3 q = (ro + rd * (-b0 + (float(k) * 2.0 - 1.0) * sqrt(h))) / rs;
        float v1 = pow(1.0 - abs(sin(q.x * 6.0 + sin(q.y * 7.0 + u_time * 1.3 + ph) * 1.6 + q.z * 3.0)), 10.0);
        float v2 = pow(1.0 - abs(sin(q.z * 9.0 - q.y * 4.0 + u_time * 0.7 - ph)), 16.0) * 0.6;
        acc += (v1 + v2) * (0.45 + float(i) * 0.3) * (k == 0 ? 1.0 : 0.45);
      }
    }
    vec3 cx = cross(ro, rd);
    float core = exp(-dot(cx, cx) * 7.0);               // hot core: closest approach to the center
    vec3 inner = u_glowCol * (acc * 0.75 + core * 0.8) * (1.2 + u_speed * 1.0) + u_base * 0.25;
    col = refl * F + inner * (1.0 - F);
    glow = clamp(acc * 0.45 + core * 0.6, 0.0, 1.0);
    sun = vec3(0.05 + 0.95 * fh) * (lobe(max(dot(N, H), 0.0), u_rough) + lobe(max(dot(N, H), 0.0), 0.15) * 0.05) * ndl;
  } else {
    // candy plastic: coloured diffuse body with a soft subsurface wrap, under a glossy clear coat
    float stripe = smoothstep(0.34, 0.3, abs(o.y));
    vec3 alb = mix(vec3(0.95), u_base, stripe);
    alb = mix(alb, u_base * 0.7, smoothstep(0.24, 0.2, length(o.xz)) * step(0.5, abs(o.y)));
    float wrap = max(0.0, (dot(N, L) + 0.45) / 1.45);
    vec3 diff = alb * (scene(N, 1.0) * 1.25 * ao + u_sunCol * (ndl * 0.75 + wrap * 0.3));
    float F = schlick(0.045, ndv);
    col = diff * (1.0 - F) + scene(look(v_wp, reflect(-V, N)), u_rough) * F;
    sun = vec3(0.045 + 0.955 * fh) * (lobe(max(dot(N, H), 0.0), u_rough) + lobe(max(dot(N, H), 0.0), 0.2) * 0.08) * ndl;
  }
  col += u_sunCol * sun;
  col += u_glowCol * fr * (0.12 + u_speed * 0.6);
  if (u_star > 0.0) {                          // star power: the ball lights up from inside
    float pulse = 0.75 + 0.25 * sin(u_time * 14.0);

  gl_FragColor = vec4(col * u_fade, clamp(glow + u_speed * fr * 0.5, 0.0, 1.0));
}`;

// Sky: fullscreen triangle sampling the pre-rendered equirect panorama.
const VS_SKY = `attribute vec2 a_pos; varying vec2 v_p; void main(){ v_p = a_pos; gl_Position = vec4(a_pos, 0.9999, 1.0); }`;
const FS_SKY = GLSL_COMMON + `
varying vec2 v_p; uniform mat4 u_invVP; uniform sampler2D u_env; uniform sampler2D u_env2; uniform float u_mix; uniform float u_flash;
uniform vec3 u_sunDir; uniform vec3 u_sunCol; uniform float u_time;
void main(){

// Floor far below the track (midground/background parallax layer), one style per zone.
const VS_FLOOR = `
attribute vec2 a_pos; uniform mat4 u_vp; uniform vec3 u_cam; uniform float u_y; varying vec3 v_wp;
void main(){ v_wp = vec3(u_cam.x + a_pos.x * 950.0, u_y, u_cam.z + a_pos.y * 950.0); gl_Position = u_vp * vec4(v_wp, 1.0); }`;
const FS_FLOOR = GLSL_COMMON + `
varying vec3 v_wp; uniform vec3 u_cam; uniform float u_time; uniform float u_stA; uniform float u_stB; uniform float u_mix;
uniform vec3 u_aA; uniform vec3 u_bA; uniform vec3 u_aB; uniform vec3 u_bB; uniform vec3 u_fogCol; uniform vec3 u_sunDir; uniform vec3 u_sunCol;
vec3 gV; float gFw;                                  // view direction, pixel footprint in meters
float dune(vec2 p){                                  // desert height (m): gentle windward slope, steep lee side
  float x = dot(p, vec2(0.8, 0.6)) * 0.017 + noise(p * 0.0035) * 3.0, t = fract(x);
  float h = t < 0.72 ? t / 0.72 : (1.0 - t) / 0.28;
  return h * h * (3.0 - 2.0 * h) * (7.0 + 7.0 * noise(p * 0.004 + 3.0)) + noise(p * 0.03) * 1.5;
}
vec3 styleCol(float st, vec2 p, vec3 A, vec3 B, float aa, out float glow){
  glow = 0.0;
  if (st < 0.5) {                                   // tech: panels, light seams, blinking beacons
    vec2 d = abs(fract(p / 24.0 + 0.5) - 0.5); float ln = smoothstep(aa * 0.5, 0.0, min(d.x, d.y));
    vec2 d2 = abs(fract(p / 6.0 + 0.5) - 0.5); float sub = smoothstep(aa * 2.0, 0.0, min(d2.x, d2.y));

    float pulse = 0.6 + 0.4 * sin(p.y * 0.02 - u_time * 1.5);

    vec2 q = p * 0.0045 + vec2(u_time * 0.006, u_time * 0.002);
    float n = fbm(q * 2.0) * 0.6 + fbm(q * 7.0 + 3.1) * 0.4;

    float r = length(p - vec2(0.0, floor(p.y / 400.0) * 400.0 + 200.0));
    float ring = smoothstep(aa * 6.0, 0.0, abs(fract(r / 36.0) - 0.5) - 0.44);

    float trees = smoothstep(0.64, 0.7, noise(q * 0.04 + 3.3));

    float lane = smoothstep(2.4 + gFw, 1.2, abs(q.x - 400.0 * floor(q.x / 400.0 + 0.5) + sin(q.y * 0.012) * 40.0));

    }

    float tex = noise(p * 1.1) * 0.5 + noise(p * 2.9) * 0.5;
    vec3 c = top < 0.0 ? A * 0.12 : leaf * (0.3 + 0.95 * max(dot(n, u_sunDir), 0.0)) * (0.72 + 0.45 * tex) * (0.55 + 0.45 * n.y);

    float p1 = dot(p, d1) * 0.26 + u_time * 1.6, p2 = dot(p, d2) * 0.48 + u_time * 2.2, p3 = dot(p, d3) * 0.9 + u_time * 3.0, p4 = dot(p, d4) * 1.6 + u_time * 3.9;
    float far = 1.0 - smoothstep(0.25, 1.6, gFw), far2 = 1.0 - smoothstep(1.0, 6.0, gFw);

    gr = d1 * 0.117 * cos(p1) * far2 + d2 * 0.106 * cos(p2) * far2 + (d3 * 0.09 * cos(p3) + d4 * 0.08 * cos(p4)) * far;
    vec2 rp = p * 0.8 + u_time * vec2(0.35, 0.22);
    float n0 = noise(rp), nx = noise(rp + vec2(0.5, 0.0)), nz = noise(rp + vec2(0.0, 0.5));
    gr += vec2(nx - n0, nz - n0) * 0.5 * far;
    vec3 n = normalize(vec3(-gr.x, 1.0, -gr.y)), R = reflect(-gV, n);
    float fres = 0.02 + 0.98 * pow(1.0 - max(dot(n, gV), 0.0), 5.0);

    float e = 1.5, h0 = dune(p), hx = dune(p + vec2(e, 0.0)), hz = dune(p + vec2(0.0, e));
    vec3 n = normalize(vec3(-(hx - h0) / e, 1.0, -(hz - h0) / e));
    float ndl = max(dot(n, u_sunDir), 0.0);
    vec3 sand = mix(A, B, clamp(0.3 + h0 * 0.045, 0.0, 1.0));
    float rip = sin(dot(p, vec2(-0.6, 0.8)) * 2.8 + noise(p * 0.25) * 6.0);

}
void main(){
  vec2 p = v_wp.xz;
  float dist = length(v_wp - u_cam);
  float aa = clamp(dist * 0.0018, 0.012, 0.3);
  gV = (u_cam - v_wp) / dist; gFw = dist * 0.0022 / max(gV.y, 0.08);
  float gA, gB = 0.0;
  vec3 col = styleCol(u_stA, p, u_aA, u_bA, aa, gA);
  if (u_mix > 0.002) { vec3 c2 = styleCol(u_stB, p, u_aB, u_bB, aa, gB); col = mix(col, c2, u_mix); gA = mix(gA, gB, u_mix); }
  float fog = 1.0 - exp(-dist * 0.0042);
  gl_FragColor = vec4(mix(col, u_fogCol, fog), clamp(gA * (1.0 - fog), 0.0, 1.0));
}`;

// Point sprites: stars, dust, particles (additive).
const VS_PTS = `
attribute vec3 a_pos; attribute vec4 a_col; attribute float a_size;

  float a = (1.0 - d); a = a * a * v_col.a; gl_FragColor = vec4(v_col.rgb * a, a * 0.6); }`;

// Additive FX geometry: trail ribbon, glows, light shafts.
const VS_FX = `
attribute vec3 a_pos; attribute vec3 a_uv; attribute vec4 a_col;
uniform mat4 u_vp; varying vec3 v_uv; varying vec4 v_col;
void main(){ v_uv = a_uv; v_col = a_col; gl_Position = u_vp * vec4(a_pos, 1.0); }`;
const FS_FX = `
precision mediump float; varying vec3 v_uv; varying vec4 v_col;
void main(){
  float a;
  if (v_uv.z < 0.5) { float x = 1.0 - abs(v_uv.y * 2.0 - 1.0); a = x * x * v_uv.x; }                    // ribbon
  else if (v_uv.z < 1.5) { vec2 c = v_uv.xy * 2.0 - 1.0; float d = max(1.0 - dot(c, c), 0.0); a = d * d * d; } // radial glow
  else { float x = 1.0 - abs(v_uv.x * 2.0 - 1.0); a = x * x * smoothstep(0.0, 0.35, v_uv.y) * smoothstep(1.0, 0.5, v_uv.y); } // shaft

// Post: bright/glow extraction, separable blur, final composite.
const VS_POST = `attribute vec2 a_pos; varying vec2 v_uv; void main(){ v_uv = a_pos * 0.5 + 0.5; gl_Position = vec4(a_pos, 0.0, 1.0); }`;
const FS_BRIGHT = `
precision mediump float; varying vec2 v_uv; uniform sampler2D u_tex; uniform vec2 u_px;
void main(){
  vec4 s = texture2D(u_tex, v_uv + u_px * vec2(-0.5, -0.5)) + texture2D(u_tex, v_uv + u_px * vec2(0.5, -0.5))

const FS_BLUR = `

void main(){

  c += (texture2D(u_tex, v_uv + u_dir * 3.231).rgb + texture2D(u_tex, v_uv - u_dir * 3.231).rgb) * 0.070;

const FS_COMPOSITE = `

uniform sampler2D u_scene; uniform sampler2D u_bloom; uniform float u_bloomK; uniform float u_blur; uniform float u_ca; uniform float u_time; uniform vec2 u_center;
float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }

  vec2 dir = v_uv - u_center; float r = length(dir);

// =====================================================================
// Geometry: MeshBuilder (interleaved 16-float vertices), primitives,
// procedural track chunk mesher, sky panorama generator.
// Layout: pos3 nrm3 uv2 aux4 mat4
// =====================================================================
const VSTRIDE = 16;
class MeshBuilder {
  constructor(vcap = 4096) {
    this.v = new Float32Array(vcap * VSTRIDE); this.idx = new Uint16Array(vcap * 2);
    this.nv = 0; this.ni = 0;
    this.A = [1e9, 0, 0, 0];   // aux: rowS, seed, edgeA, edgeB  (rowS=1e9 → never collapses)
    this.M = [0, 0, 0, 1];     // mat: id, flags, halfWidth, emissive
  }
  grow(nv, ni) {
    if ((this.nv + nv) * VSTRIDE > this.v.length) { const n = new Float32Array(Math.max(this.v.length * 2, (this.nv + nv) * VSTRIDE)); n.set(this.v); this.v = n; }
    if (this.ni + ni > this.idx.length) { const n = new Uint16Array(Math.max(this.idx.length * 2, this.ni + ni)); n.set(this.idx); this.idx = n; }
  }
  V(px, py, pz, nx, ny, nz, u, v) {
    const o = this.nv * VSTRIDE, a = this.v, A = this.A, M = this.M;
    a[o] = px; a[o + 1] = py; a[o + 2] = pz; a[o + 3] = nx; a[o + 4] = ny; a[o + 5] = nz; a[o + 6] = u; a[o + 7] = v;
    a[o + 8] = A[0]; a[o + 9] = A[1]; a[o + 10] = A[2]; a[o + 11] = A[3];
    a[o + 12] = M[0]; a[o + 13] = M[1]; a[o + 14] = M[2]; a[o + 15] = M[3];
    return this.nv++;
  }
  tri(a, b, c) { const I = this.idx; I[this.ni++] = a; I[this.ni++] = b; I[this.ni++] = c; }
  // Quad with explicit normal(s). p: 4 points [x,y,z]; uv: 8 numbers.
  quad(p0, p1, p2, p3, n, uv, n2) {
    this.grow(4, 6);
    const m = n2 || n;
    const a = this.V(p0[0], p0[1], p0[2], n[0], n[1], n[2], uv[0], uv[1]);
    this.V(p1[0], p1[1], p1[2], n[0], n[1], n[2], uv[2], uv[3]);
    this.V(p2[0], p2[1], p2[2], m[0], m[1], m[2], uv[4], uv[5]);
    this.V(p3[0], p3[1], p3[2], m[0], m[1], m[2], uv[6], uv[7]);
    this.tri(a, a + 1, a + 2); this.tri(a, a + 2, a + 3);
  }
  // Flat-shaded quad whose normal points away from `ctr`.
  face(p0, p1, p2, p3, ctr, uv) {
    // diagonals' cross product: valid for quads and for triangles (p3 === p0)
    const ax = p2[0] - p0[0], ay = p2[1] - p0[1], az = p2[2] - p0[2];
    const bx = p3[0] - p1[0], by = p3[1] - p1[1], bz = p3[2] - p1[2];
    let nx = ay * bz - az * by, ny = az * bx - ax * bz, nz = ax * by - ay * bx;
    const l = Math.hypot(nx, ny, nz) || 1; nx /= l; ny /= l; nz /= l;
    const cx = (p0[0] + p2[0]) / 2 - ctr[0], cy = (p0[1] + p2[1]) / 2 - ctr[1], cz = (p0[2] + p2[2]) / 2 - ctr[2];
    if (nx * cx + ny * cy + nz * cz < 0) { nx = -nx; ny = -ny; nz = -nz; }
    this.quad(p0, p1, p2, p3, [nx, ny, nz], uv || [0, 0, 1, 0, 1, 1, 0, 1]);
  }
  // Hexahedron from 8 corners: c[0..3] bottom ring, c[4..7] top ring (same order).
  hexa(c, uvScale = 1) {
    const ctr = [0, 0, 0];
    for (const p of c) { ctr[0] += p[0] / 8; ctr[1] += p[1] / 8; ctr[2] += p[2] / 8; }
    const U = [0, 0, uvScale, 0, uvScale, 1, 0, 1];
    this.face(c[0], c[1], c[2], c[3], ctr, U); this.face(c[4], c[5], c[6], c[7], ctr, U);
    for (let k = 0; k < 4; k++) { const j = (k + 1) & 3; this.face(c[k], c[j], c[j + 4], c[k + 4], ctr, U); }
  }
  // Box along a segment a→b with square section `t`.
  strut(a, b, t) {
    const dx = b[0] - a[0], dy = b[1] - a[1], dz = b[2] - a[2];
    const l = Math.hypot(dx, dy, dz) || 1, d = [dx / l, dy / l, dz / l];
    let px = [d[1], -d[0], 0]; if (Math.abs(d[2]) > 0.9 || Math.hypot(px[0], px[1]) < 0.1) px = [0, d[2], -d[1]];

// Surface of revolution around Y. prof: [[radius, y], …] from bottom to top. Smooth normals, or

Prims.lathe = (mb, prof, seg, o = {}) => {
  const ox = o.x || 0, oy = o.y || 0, oz = o.z || 0, rm = o.rmod, n = prof.length;
  const P = (j, k) => { const a = k / seg * TAU, r = prof[j][0] * (rm ? rm(k % seg, j) : 1); return [ox + Math.cos(a) * r, oy + prof[j][1], oz + Math.sin(a) * r]; };

    for (let j = 0; j < n - 1; j++) {

      const flatRing = Math.abs(prof[j + 1][1] - prof[j][1]) < 1e-6 ? Math.sign(prof[j + 1][0] - prof[j][0]) : 0;
      const ctr = [ox, oy + (prof[j][1] + prof[j + 1][1]) / 2 + flatRing, oz];

        const v0 = j / (n - 1), v1 = (j + 1) / (n - 1), uv = [k / seg, v0, (k + 1) / seg, v0, (k + 1) / seg, v1, k / seg, v1];

        else if (prof[j][0] < 1e-4) mb.face(P(j, k), P(j + 1, k + 1), P(j + 1, k), P(j, k), ctr, uv);

TrackMesher.preview = () => {
