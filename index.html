<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ROLL</title>
<style>
:root{
  --accent:#4ef2ff;
  --accent2:#ff5ad2;
  --gold:#ffd36b;
  --ink:#ffffff;
  --dim:rgba(235,242,255,.62);
  --glass:rgba(10,14,30,.55);
  --glass-brd:rgba(255,255,255,.14);
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#05060d;color:var(--ink);font-family:var(--font);
  touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-text-size-adjust:100%;position:fixed;inset:0}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.hidden{display:none!important}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity .4s}
#hud::before{content:"";position:absolute;z-index:-1;left:0;right:0;top:0;height:calc(var(--sat) + 120px);background:linear-gradient(180deg,rgba(3,4,12,.55),rgba(3,4,12,0))}
#hud::after{content:"";position:absolute;z-index:-1;left:0;right:0;bottom:0;height:calc(var(--sab) + 70px);background:linear-gradient(0deg,rgba(3,4,12,.4),rgba(3,4,12,0))}
#hud.on{opacity:1}
#stats{position:absolute;top:calc(var(--sat) + 10px);left:calc(var(--sal) + 14px);right:calc(var(--sar) + 14px);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px}
#stats > div:last-child{min-width:100px}
.stat{display:flex;flex-direction:column;text-shadow:0 0 2px rgba(0,0,0,.9),0 2px 6px rgba(0,0,0,.85)}
.stat .lbl{font-size:11px;font-weight:800;letter-spacing:.22em;color:var(--dim)}
.stat .val{font-size:22px;font-weight:800;letter-spacing:.02em;line-height:1.1}
#stats .col{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
#stBest .val{font-size:16px;color:var(--gold)}
#stBest .lbl{font-size:10px}
#stScore{align-items:center}
#stScore .val{font-size:40px;font-weight:900;letter-spacing:.01em;text-shadow:none;
  background:linear-gradient(180deg,#fff 30%,#bfefff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.8))}
#mult{margin-top:2px;font-size:13px;font-weight:900;letter-spacing:.12em;color:var(--gold);opacity:0;transition:opacity .25s,transform .25s;transform:scale(.8)}
#mult.on{opacity:1;transform:scale(1)}
#topBtns{position:absolute;top:calc(var(--sat) + 8px);right:calc(var(--sar) + 10px);display:flex;gap:8px;pointer-events:auto}
.icoBtn{width:44px;height:44px;border-radius:14px;background:var(--glass);border:1px solid var(--glass-brd);
  display:flex;align-items:center;justify-content:center;font-size:20px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 4px 18px rgba(0,0,0,.35)}
.icoBtn:active{transform:scale(.92)}
#menuSound{position:fixed;top:calc(var(--sat) + 8px);right:calc(var(--sar) + 10px);z-index:30}
#speedo{position:absolute;left:calc(var(--sal) + 16px);bottom:calc(var(--sab) + 16px);display:flex;align-items:flex-end;gap:10px;
  text-shadow:0 2px 6px rgba(0,0,0,.8)}
#speedo .v{font-size:26px;font-weight:900;line-height:1}
#speedo .u{font-size:11px;font-weight:800;letter-spacing:.18em;color:var(--dim);margin-bottom:3px}
#speedBar{position:absolute;left:0;bottom:-7px;height:3px;width:86px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}
#speedBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px}
#ctrlTag{position:absolute;right:calc(var(--sar) + 16px);bottom:calc(var(--sab) + 18px);font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--dim);
  text-shadow:0 2px 6px rgba(0,0,0,.8)}
#toasts{position:absolute;left:0;right:0;top:32%;display:flex;flex-direction:column;align-items:center;gap:6px}
.toast{font-weight:900;letter-spacing:.14em;font-size:20px;text-shadow:0 0 2px #000,0 0 3px rgba(0,0,0,.9),0 3px 12px rgba(0,0,0,.8);animation:toast 1.4s ease-out forwards;white-space:nowrap}
.toast.big{font-size:28px}
.toast.gold{color:var(--gold)}
.toast.cyan{color:var(--accent)}
.toast.pink{color:var(--accent2)}
@keyframes toast{0%{opacity:0;transform:translateY(14px) scale(.7)}12%{opacity:1;transform:translateY(0) scale(1.08)}22%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-26px) scale(.96)}}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse 85% 75% at 50% 48%,rgba(0,0,0,0) 55%,rgba(2,3,10,.5) 100%)}
#danger{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;
  background:radial-gradient(120% 60% at 50% 115%,rgba(255,40,70,.55),rgba(255,40,70,0) 60%)}
#flash{position:fixed;inset:0;pointer-events:none;z-index:6;background:#fff;opacity:0}
#joy{position:fixed;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;pointer-events:none;z-index:6;opacity:0;transition:opacity .15s;
  border:2px solid rgba(255,255,255,.28);background:radial-gradient(circle,rgba(78,242,255,.08),rgba(78,242,255,0) 70%)}
#joy.on{opacity:1}
#joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9),rgba(160,230,255,.45) 45%,rgba(78,242,255,.15) 75%);box-shadow:0 0 18px rgba(78,242,255,.45)}
#touchHint{position:fixed;left:0;right:0;bottom:calc(var(--sab) + 70px);text-align:center;z-index:6;pointer-events:none;
  font-size:14px;font-weight:700;letter-spacing:.06em;color:var(--dim);text-shadow:0 2px 6px #000;transition:opacity .6s}

/* ---------- Screens ---------- */
.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:calc(var(--sat) + 24px) calc(var(--sar) + 22px) calc(var(--sab) + 24px) calc(var(--sal) + 22px);
  background:radial-gradient(140% 90% at 50% 40%,rgba(5,6,13,0) 0%,rgba(5,6,13,.55) 70%,rgba(5,6,13,.85) 100%);
  transition:opacity .45s;overflow:hidden}
.screen.fade{opacity:0;pointer-events:none}
#title{font-size:clamp(84px,30vw,168px);font-weight:900;letter-spacing:.06em;line-height:.9;margin-right:-.06em;
  background:linear-gradient(100deg,#fff 0%,#d9fbff 30%,var(--accent) 45%,#fff 52%,var(--accent2) 70%,#fff 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s ease-in-out infinite;
  filter:drop-shadow(0 6px 30px rgba(78,242,255,.35)) drop-shadow(0 2px 2px rgba(0,0,0,.6))}
@keyframes shine{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
#tagline{margin-top:10px;font-size:clamp(17px,4.6vw,22px);font-style:italic;font-weight:500;letter-spacing:.04em;color:rgba(235,245,255,.85);text-shadow:0 2px 8px #000}
.bigBtn{margin-top:30px;min-height:64px;padding:18px 26px;border-radius:20px;font-size:16px;font-weight:900;letter-spacing:.08em;line-height:1.25;
  max-width:420px;width:100%;color:#051018;
  background:linear-gradient(135deg,#8ff8ff 0%,var(--accent) 45%,#35b7ff 100%);
  box-shadow:0 10px 40px rgba(78,242,255,.35),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -3px 0 rgba(0,40,80,.25);
  position:relative;overflow:hidden}
.bigBtn::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);
  animation:sweep 3.2s ease-in-out infinite}
@keyframes sweep{0%,55%{left:-60%}100%{left:130%}}
.bigBtn:active{transform:scale(.97)}
.ghostBtn{margin-top:12px;min-height:50px;padding:12px 22px;border-radius:16px;font-size:14px;font-weight:800;letter-spacing:.1em;
  background:var(--glass);border:1px solid var(--glass-brd);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-width:420px;width:100%}
.ghostBtn:active{transform:scale(.97)}
.hint{margin-top:14px;font-size:14px;font-weight:600;color:var(--dim);letter-spacing:.02em;text-shadow:0 2px 6px #000;max-width:420px}
.hint b{color:#fff}
#menuBest{margin-top:22px;font-size:12px;font-weight:800;letter-spacing:.26em;color:var(--dim)}
#menuBest span{color:var(--gold);font-size:15px;letter-spacing:.06em}
#skins{margin-top:22px;display:flex;flex-direction:column;gap:10px;align-items:center;width:100%;max-width:420px}
.skinRow{display:flex;align-items:center;gap:10px;width:100%;justify-content:center}
.skinRow .lbl{font-size:11px;font-weight:800;letter-spacing:.2em;color:var(--dim);width:54px;text-align:right}
.sw{width:44px;height:44px;border-radius:13px;border:2px solid rgba(255,255,255,.18);position:relative;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.sw.round{border-radius:50%}
.sw.sel{border-color:#fff;box-shadow:0 0 0 3px rgba(78,242,255,.5),0 4px 14px rgba(0,0,0,.4)}
#skinName{font-size:12px;font-weight:700;letter-spacing:.14em;color:rgba(255,255,255,.75);min-height:16px}
#permMsg{margin-top:14px;font-size:13px;font-weight:700;color:#ffb3c7;max-width:380px;text-shadow:0 2px 6px #000}

#calib{background:rgba(5,6,13,.25)}
#calibRing{width:120px;height:120px;border-radius:50%;border:3px solid rgba(255,255,255,.15);position:relative}
#calibRing::before{content:"";position:absolute;inset:-3px;border-radius:50%;border:3px solid transparent;border-top-color:var(--accent);border-right-color:var(--accent);
  animation:spin .8s linear infinite}
#calibRing b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900}
@keyframes spin{to{transform:rotate(360deg)}}
#calibTxt{margin-top:22px;font-size:16px;font-weight:800;letter-spacing:.12em;text-shadow:0 2px 8px #000}
#calibSub{margin-top:8px;font-size:14px;color:var(--dim);text-shadow:0 2px 8px #000}
#go{position:fixed;left:0;right:0;top:40%;text-align:center;font-size:72px;font-weight:900;letter-spacing:.08em;z-index:21;pointer-events:none;opacity:0;
  color:#fff;text-shadow:0 0 30px rgba(78,242,255,.9),0 4px 10px rgba(0,0,0,.7)}
#go.on{animation:go .9s ease-out forwards}
@keyframes go{0%{opacity:0;transform:scale(2.2)}20%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0;transform:scale(.9)}}

#pause h2,#over h2{font-size:clamp(40px,12vw,64px);font-weight:900;letter-spacing:.1em;margin-right:-.1em;text-shadow:0 4px 20px rgba(0,0,0,.8)}
#pause{background:rgba(5,6,13,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.volRow{margin-top:26px;display:flex;align-items:center;gap:12px;width:100%;max-width:340px}
.volRow span{font-size:11px;font-weight:800;letter-spacing:.2em;color:var(--dim);width:64px;text-align:left}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:rgba(255,255,255,.18);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(78,242,255,.35)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:0}

#over{background:radial-gradient(120% 80% at 50% 45%,rgba(20,5,20,.35),rgba(5,6,13,.85))}
#over h2{background:linear-gradient(180deg,#fff,#ffc2e4);-webkit-background-clip:text;background-clip:text;color:transparent}
#ovDist{margin-top:14px;font-size:clamp(56px,17vw,96px);font-weight:900;line-height:1;text-shadow:0 6px 30px rgba(78,242,255,.35)}
#ovDist small{font-size:.42em;font-weight:800;color:var(--dim);margin-left:4px}
#ovScore{margin-top:14px;font-size:18px;font-weight:800;letter-spacing:.16em}
#ovBest{margin-top:6px;font-size:14px;font-weight:800;letter-spacing:.16em;color:var(--dim)}
#ovBest b{color:var(--gold)}
#record{position:relative;margin-top:18px;height:44px;display:flex;align-items:center;justify-content:center}
#record .txt{font-size:26px;font-weight:900;letter-spacing:.14em;
  background:linear-gradient(100deg,#fff3c4,var(--gold) 30%,#fff 50%,#ff9d5c 70%,#fff3c4);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:recIn .9s cubic-bezier(.2,1.6,.4,1) both,shine 1.6s linear infinite;
  filter:drop-shadow(0 0 18px rgba(255,200,90,.6))}
#record .rays{position:absolute;left:50%;top:50%;width:360px;height:360px;margin:-180px 0 0 -180px;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(255,211,107,.22) 0deg 6deg,rgba(255,211,107,0) 6deg 20deg);
  -webkit-mask:radial-gradient(circle,#000 10%,transparent 62%);mask:radial-gradient(circle,#000 10%,transparent 62%);
  animation:rays 2.4s ease-out forwards}
@keyframes recIn{0%{transform:scale(3);opacity:0}60%{opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes rays{0%{opacity:0;transform:scale(.3) rotate(0)}20%{opacity:1}100%{opacity:0;transform:scale(1.3) rotate(60deg)}}
.row2{display:flex;gap:10px;width:100%;max-width:420px}
.row2 .ghostBtn{flex:1}
#noGL{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;z-index:99;background:#05060d;font-weight:700}
.mcol{display:flex;flex-direction:column;align-items:center;width:100%}
#mLeft #menuBest{order:3}
@media (orientation:portrait){ #menuBest{margin-top:14px} #mRight{margin-top:4px} }
@media (orientation:landscape) and (max-height:560px){
  #menu{flex-direction:row;gap:4vw}
  .mcol{flex:1;max-width:440px}
  #title{font-size:clamp(64px,22vh,130px)}
  .bigBtn{margin-top:0;min-height:52px;padding:12px 20px;font-size:14px}
  .ghostBtn{min-height:44px;margin-top:10px;padding:8px 18px}
  .hint{margin-top:8px;font-size:12px}
  #skins{margin-top:12px;gap:6px}
  .sw{width:38px;height:38px}
  #permMsg{margin-top:8px;font-size:12px}
  #stScore .val{font-size:32px}
  #toasts{top:24%}
  #ovDist{font-size:clamp(44px,14vh,80px)}
  #over h2,#pause h2{font-size:clamp(30px,10vh,48px)}
  #over .bigBtn,#pause .bigBtn{margin-top:14px}
  #record{margin-top:6px}
  .volRow{margin-top:12px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="vignette"></div>
<div id="danger"></div>
<div id="flash"></div>
<div id="joy"><i></i></div>
<div id="touchHint" class="hidden">Glissez le doigt pour guider la bille</div>

<div id="hud">
  <div id="stats">
    <div class="col">
      <div class="stat" id="stDist"><span class="lbl">DISTANCE</span><span class="val num" id="hDist">0 m</span></div>
      <div class="stat" id="stBest"><span class="lbl">BEST</span><span class="val num" id="hBest">0 m</span></div>
    </div>
    <div class="stat" id="stScore"><span class="lbl">SCORE</span><span class="val num" id="hScore">0</span><span id="mult" class="num">×1</span></div>
    <div></div>
  </div>
  <div id="topBtns">
    <button class="icoBtn" id="btnSound" aria-label="Son">🔊</button>
    <button class="icoBtn" id="btnPause" aria-label="Pause">❚❚</button>
  </div>
  <div id="speedo"><span class="v num" id="hSpeed">0</span><span class="u">KM/H</span><div id="speedBar"><i id="hSpeedBar"></i></div></div>
  <div id="ctrlTag"></div>
  <div id="toasts"></div>
</div>

<button class="icoBtn" id="menuSound" aria-label="Son">🔊</button>

<div class="screen" id="menu">
  <div class="mcol" id="mLeft">
    <div id="title">ROLL</div>
    <div id="tagline">How far can you go?</div>
    <div id="menuBest">BEST <span class="num" id="mBest">0 m</span></div>
  </div>
  <div class="mcol" id="mRight">
    <button class="bigBtn" id="btnTilt">ACTIVER LE CONTRÔLE PAR INCLINAISON</button>
    <div class="hint" id="tiltHint">Inclinez votre téléphone pour contrôler la bille</div>
    <button class="ghostBtn" id="btnTouch">JOUER AU TACTILE</button>
    <div id="permMsg" class="hidden"></div>
    <div id="skins">
      <div class="skinRow" id="rowTrack"><span class="lbl">PISTE</span></div>
      <div class="skinRow" id="rowBall"><span class="lbl">BILLE</span></div>
      <div id="skinName"></div>
    </div>
  </div>
</div>

<div class="screen hidden" id="calib">
  <div id="calibRing"><b id="calibNum"></b></div>
  <div id="calibTxt">CALIBRATION</div>
  <div id="calibSub">Tenez le téléphone dans une position naturelle</div>
</div>
<div id="go">GO!</div>

<div class="screen hidden" id="pause">
  <h2>PAUSE</h2>
  <button class="bigBtn" id="btnResume">REPRENDRE</button>
  <button class="ghostBtn" id="btnRecal">RECALIBRER L'INCLINAISON</button>
  <div class="volRow"><span>SONS</span><input type="range" id="volSfx" min="0" max="100" value="80"></div>
  <div class="volRow" style="margin-top:14px"><span>MUSIQUE</span><input type="range" id="volMusic" min="0" max="100" value="60"></div>
  <button class="ghostBtn" id="btnQuit" style="margin-top:26px">MENU PRINCIPAL</button>
</div>

<div class="screen hidden" id="over">
  <h2>GAME OVER</h2>
  <div id="record" class="hidden"><div class="rays"></div><div class="txt">NOUVEAU RECORD</div></div>
  <div id="ovDist" class="num">0<small>m</small></div>
  <div id="ovScore" class="num">SCORE 0</div>
  <div id="ovBest" class="num">BEST <b>0 m</b></div>
  <button class="bigBtn" id="btnRetry">REJOUER</button>
  <div class="row2"><button class="ghostBtn" id="btnMenu">MENU</button></div>
</div>
<script>

'use strict';
/* =====================================================================
   ROLL — endless tilt-controlled marble run.
   Single-file game: WebGL renderer, custom physics, procedural track,
   Web Audio synthesis. No external resources.
   ===================================================================== */

// ---------------------------------------------------------------- utils
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (k, dt) => 1 - Math.exp(-k * dt);
const fin = (v, d = 0) => (Number.isFinite(v) ? v : d);
const TAU = Math.PI * 2;
const wrapAngle = (a) => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const fmt = (n) => Math.floor(Math.max(0, n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const hex = (h) => [((h >> 16) & 255) / 255, ((h >> 8) & 255) / 255, (h & 255) / 255];

// Deterministic PRNG (mulberry32) so a run's track is reproducible from a seed.
function RNG(seed) {
  let a = seed >>> 0;
  const next = () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  return {
    next,
    range: (lo, hi) => lo + (hi - lo) * next(),
    int: (lo, hi) => lo + Math.floor(next() * (hi - lo + 1)),
    chance: (p) => next() < p,
    sign: () => (next() < 0.5 ? -1 : 1),
    pick: (arr) => arr[Math.floor(next() * arr.length)],
  };
}

const Store = {
  get(k, d) { try { const v = localStorage.getItem('roll.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('roll.' + k, JSON.stringify(v)); } catch (e) { /* private mode */ } },
};

// ---------------------------------------------------------------- mat4 (column-major)
const M4 = {
  create() { const m = new Float32Array(16); m[0] = m[5] = m[10] = m[15] = 1; return m; },
  perspective(out, fovy, aspect, near, far) {
    const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
    out.fill(0);

// ---------------------------------------------------------------- tuning
const CFG = {
  DS: 0.5,               // track sample spacing (m)
  CHUNK_ROWS: 64,        // rows per mesh chunk (32 m)
  CAP: 8192,             // ring buffer capacity (samples)
  AHEAD: 230,            // generate this far ahead of the ball (m)
  BEHIND: 70,            // keep this much track behind (m)
  THICK: 0.34,           // plank thickness
  R: 0.42,               // ball radius
  G: 24,                 // gravity
  ACC: 15,               // tilt acceleration at full input
  VMAX: 14,              // soft top speed
  VBOOST: 20,            // boost speed
  CHECKPOINT: 250,       // meters between checkpoints
  START_S: 8,            // ball spawn arc length

// =====================================================================
// Track — ring-buffered centerline samples + per-row solid intervals.
// Sample i sits at arc length s = i*DS. Row i spans samples i..i+1.
// =====================================================================
const RF = { RAIL_L: 1, RAIL_R: 2, BOOST: 4, CHECK: 8, START: 16 };

class Track {
  constructor() {
    const C = CFG.CAP;
    this.mask = C - 1;
    this.x = new Float64Array(C); this.y = new Float64Array(C); this.z = new Float64Array(C);
    this.th = new Float64Array(C); this.w = new Float32Array(C); this.bank = new Float32Array(C);
    this.kap = new Float32Array(C); this.slope = new Float32Array(C);
    this.rowN = new Uint8Array(C);
    this.rowA = new Float32Array(C * 3); this.rowB = new Float32Array(C * 3);
    this.rowAO = new Uint8Array(C * 3); this.rowBO = new Uint8Array(C * 3); // endpoint follows outer edge
    this.rowF = new Uint16Array(C);
    this.n = 0;
    this.objects = [];
    this.loc = { i: 0, t: 0, s: 0, u: 0, cx: 0, cy: 0, cz: 0, th: 0, w: 0, bank: 0, slope: 0, fx: 0, fz: 1, rx: -1, rz: 0 };
  }
  reset() { this.n = 0; this.objects.length = 0; }
  get length() { return (this.n - 1) * CFG.DS; }
  minIndex() { return Math.max(0, this.n - CFG.CAP + 2); }

  // Width-aware endpoint of interval k of row i at fraction t.
  edgeA(i, k, t) { const m = i & this.mask; return this.rowAO[m * 3 + k] ? -this.widthAt(i, t) * 0.5 : this.rowA[m * 3 + k]; }
  edgeB(i, k, t) { const m = i & this.mask; return this.rowBO[m * 3 + k] ? this.widthAt(i, t) * 0.5 : this.rowB[m * 3 + k]; }
  widthAt(i, t) { const M = this.mask; return lerp(this.w[i & M], this.w[(i + 1) & M], t); }

  // Project a world XZ point onto the centerline, starting the search at `hint`.
  locate(px, pz, hint) {
    const M = this.mask, lo = this.minIndex(), hi = this.n - 2;
    let i = clamp(hint | 0, lo, Math.max(lo, hi)), t = 0;
    for (let it = 0; it < 80; it++) {
      const a = i & M, b = (i + 1) & M;
      const dx = this.x[b] - this.x[a], dz = this.z[b] - this.z[a];
      const L2 = dx * dx + dz * dz || 1e-6;
      t = ((px - this.x[a]) * dx + (pz - this.z[a]) * dz) / L2;
      if (t < 0 && i > lo) { i--; continue; }
      if (t >= 1 && i < hi) { i++; continue; }
      break;
    }
    const L = this.loc;
    L.out = (t < -0.02 && i <= lo) || (t > 1.02 && i >= hi);   // beyond the first/last generated sample
    t = clamp(t, 0, 1);
    const a = i & M, b = (i + 1) & M;
    L.i = i; L.t = t; L.s = (i + t) * CFG.DS;
    L.cx = lerp(this.x[a], this.x[b], t); L.cy = lerp(this.y[a], this.y[b], t); L.cz = lerp(this.z[a], this.z[b], t);
    L.th = this.th[a] + wrapAngle(this.th[b] - this.th[a]) * t;
    L.w = lerp(this.w[a], this.w[b], t); L.bank = lerp(this.bank[a], this.bank[b], t);
    L.slope = this.slope[a];
    L.fx = Math.sin(L.th); L.fz = Math.cos(L.th); L.rx = -L.fz; L.rz = L.fx;
    L.u = (px - L.cx) * L.rx + (pz - L.cz) * L.rz;
    return L;
  }
  surfaceY(L, u) { return L.cy + u * Math.tan(L.bank); }
  // Returns interval index containing u (or -1).
  solidAt(i, t, u) {
    if (i < this.minIndex() || i >= this.n - 1) return -1;
    const m = i & this.mask, n = this.rowN[m];
    for (let k = 0; k < n; k++) if (u >= this.edgeA(i, k, t) && u <= this.edgeB(i, k, t)) return k;
    return -1;
  }
  // Point on the track surface at arc length s and lateral offset u (+ height h).
  pointAt(s, u, h, out) {
    const M = this.mask, f = s / CFG.DS;
    const i = clamp(Math.floor(f), this.minIndex(), Math.max(this.minIndex(), this.n - 2)), t = clamp(f - i, 0, 1);

    const bank = lerp(this.bank[a], this.bank[b], t);

    out[2] = lerp(this.z[a], this.z[b], t) + rz * u;
    out[3] = th;
    return out;
  }
}

// =====================================================================
// TrackGenerator — procedural endless sections with difficulty ramp.
// Sections output *targets*; actual values are rate-limited so geometry
// always stays smooth, and every hazard is validated against the real
// width at that row so a safe line always exists.
// =====================================================================
class TrackGenerator {
  constructor(track, seed) {
    this.T = track;
    this.rng = RNG(seed);
    this.th = 0; this.x = 0; this.y = 0; this.z = 0;
    this.kap = 0; this.w = 3.6; this.bank = 0; this.slope = 0;
    this.sec = null; this.k = 0;
    this.last = ''; this.afterBoost = false;
    this.nextCheck = CFG.CHECKPOINT + CFG.START_S;

  }
  diff(s) { return clamp(Math.pow(Math.max(0, s - 60) / 2600, 0.85), 0, 1); }

  fill(uptoS) {
    while ((this.T.n - 1) * CFG.DS < uptoS) this.emit();
  }

  emit() {
    const T = this.T, DS = CFG.DS;
    if (!this.sec || this.k >= this.sec.len) { this.sec = this.nextSection(); this.k = 0; }
    const i = T.n, m = i & T.mask, s = i * DS, sec = this.sec, k = this.k;
    const tg = sec.at(k);
    // Heading guard: predict the overshoot of ramping curvature back to 0 and
    // turn back early, so |heading| < 90° always (z strictly increases: no loops).
    let tk = tg.k;
    const over = this.th + Math.sign(this.kap) * (this.kap * this.kap) / 0.112;
    if (over > 1.4 && tk > -0.03) tk = -0.03;
    if (over < -1.4 && tk < 0.03) tk = 0.03;
    // rate-limited smoothing of the shape parameters
    this.kap += clamp(tk - this.kap, -0.028, 0.028);
    this.w += clamp(tg.w - this.w, -0.07, 0.07);
    this.bank += clamp(tg.b - this.bank, -0.012, 0.012);
    if (tg.drop !== undefined) this.slope = tg.drop; else this.slope += clamp(tg.sl - this.slope, -0.006, 0.006);

    T.x[m] = this.x; T.y[m] = this.y; T.z[m] = this.z; T.th[m] = this.th;
    T.w[m] = this.w; T.bank[m] = this.bank; T.kap[m] = this.kap; T.slope[m] = this.slope;

    // default row: one full-width interval
    T.rowN[m] = 1; T.rowF[m] = 0;
    T.rowA[m * 3] = -this.w / 2; T.rowB[m * 3] = this.w / 2; T.rowAO[m * 3] = 1; T.rowBO[m * 3] = 1;
    if (sec.row) sec.row(k, m, s);
    if (s >= this.nextCheck) {
      T.rowF[m] |= RF.CHECK;
      T.objects.push({ kind: 'gate', s: s, u: 0, id: this.count++, cp: Math.round(this.nextCheck - CFG.START_S) });
      this.nextCheck += CFG.CHECKPOINT;
    }
    if (sec.spawn) sec.spawn(k, s);

    // integrate centerline
    const thMid = this.th + this.kap * DS * 0.5;
    this.x += Math.sin(thMid) * DS; this.z += Math.cos(thMid) * DS;
    this.th += this.kap * DS;
    this.y += this.slope * DS;
    T.n++;
    this.k++;
  }

  // ------------------------------------------------------------- helpers
  turnSign(angle) {

    const lim = 1.35;

    if (Math.abs(this.th + sg * angle) > lim) sg = -sg;

  gem(s, u, h = 0.55) { this.T.objects.push({ kind: 'gem', s, u, h, id: this.count++, taken: false }); }

      obstacles: d > 0.16 ? lerp(0.8, 1.6, d) : 0, hairpin: d > 0.38 ? lerp(0.6, 1.2, d) : 0,

      case 'banked': return this.banked(d, W);
      case 'holes': return this.holes(d);
      case 'gaps': return this.gaps(d);
      case 'obstacles': return this.obstacles(d);
      case 'hairpin': return this.hairpin(d, W);
      case 'descent': return this.descent(d, W);
      default: return this.curve(d, W, false);
    }
  }

  // ------------------------------------------------------------- sections
  startPad() {
    return this.mk(34, () => ({ k: 0, w: 3.6, b: 0, sl: -0.01 }), (k, m) => { if (k < 3) this.T.rowF[m] |= RF.START; }, null, 'start');
  }
  straight(d, W) {
    const r = this.rng, boost = r.chance(0.3 + d * 0.2), L = boost ? r.range(32, 40) : r.range(16, 30), n = Math.round(L / CFG.DS);
    const gemLane = r.range(-0.6, 0.6) * (W / 2 - 0.5), gemAt = r.chance(0.7) ? Math.round(n * 0.3) : -1;
    if (boost) this.afterBoost = true;
    return this.mk(L, () => this.flat(W, -0.035), (k, m) => {
      if (boost && k >= 4 && k < 8) this.T.rowF[m] |= RF.BOOST;
    }, (k, s) => {
      if (gemAt >= 0 && k >= gemAt && k < gemAt + 20 && (k - gemAt) % 4 === 0) this.gem(s, gemLane);
    }, 'straight');
  }
  descent(d, W) {
    const r = this.rng, L = r.range(24, 38), n = Math.round(L / CFG.DS);
    const lane = r.range(-0.5, 0.5) * (W / 2 - 0.5);
    this.afterBoost = true;
    return this.mk(L, (k) => ({ k: 0, w: W + 0.3, b: 0, sl: k < n * 0.75 ? -0.13 : -0.02 }), (k, m) => {
      if (k >= 2 && k < 6) this.T.rowF[m] |= RF.BOOST;
    }, (k, s) => { if (k > 14 && k < n - 10 && k % 6 === 0) this.gem(s, lane + Math.sin(k * 0.2) * 0.4); }, 'descent');
  }
  curve(d, W, gentle) {
    const r = this.rng;
    const kMax = gentle ? 0.05 : lerp(0.085, 0.2, d);
    const kap = r.range(gentle ? 0.03 : 0.045, kMax);
    const sg = this.turnSign(0.8);
    const ang = Math.max(0.35, Math.min(r.range(0.7, gentle ? 1.3 : 2.1), 1.4 - sg * this.th));
    const L = ang / kap;
    const rails = !gentle && kap > 0.1 && r.chance(lerp(0.8, 0.15, d));
    const gems = r.chance(0.55);
    const n = Math.round(L / CFG.DS);
    const w = W + (kap > 0.12 ? 0.25 : 0);
    return this.mk(L, () => ({ k: sg * kap, w, b: 0, sl: -0.02 }), (k, m) => {
      if (rails && k > 2 && k < n - 2) this.T.rowF[m] |= sg > 0 ? RF.RAIL_R : RF.RAIL_L;
    }, (k, s) => {
      if (gems && k > 4 && k < n - 4 && k % 5 === 0) this.gem(s, -sg * 0.35 * (w / 2 - 0.4)); // inside of the bend
    }, 'curve');
  }
  hairpin(d, W) {
    const r = this.rng, kap = lerp(0.17, 0.25, d) * r.range(0.9, 1.05), ang = r.range(1.9, 2.6);
    const sg = this.turnSign(1.0);
    const turnAng = Math.max(0.6, Math.min(ang, 1.4 - sg * this.th));
    const L = turnAng / kap, n = Math.round(L / CFG.DS);
    const rails = r.chance(lerp(0.7, 0.2, d));
    return this.mk(L + 6, (k) => ({ k: k < 12 ? 0 : sg * kap, w: W + 0.35, b: 0, sl: 0 }), (k, m) => {
      if (rails && k > 14 && k < n + 10) this.T.rowF[m] |= sg > 0 ? RF.RAIL_R : RF.RAIL_L;
    }, null, 'hairpin');
  }
  zigzag(d, W) {
    const r = this.rng, turns = r.int(3, 4 + Math.round(d * 3));
    const segL = lerp(8.5, 5, d) * r.range(0.9, 1.15);
    const kap = Math.max(0.03, Math.min(lerp(0.08, 0.2, d) * r.range(0.85, 1.05), 2 * (1.35 - Math.abs(this.th)) / segL));
    const per = Math.round(segL / CFG.DS);
    let sg = r.sign();
    // keep zigzag centered on the current heading: the first half-segment starts the swing
    if (this.th > 0.3) sg = -1; else if (this.th < -0.3) sg = 1;
    const w = W + 0.1;
    return this.mk(segL * turns + segL * 0.5, (k) => {
      const seg = Math.floor((k + per / 2) / per);
      return { k: (seg % 2 === 0 ? sg : -sg) * kap, w, b: 0, sl: -0.03 };
    }, null, (k, s) => { if (k % per === Math.floor(per / 2) && r.chance(0.4)) this.gem(s, 0); }, 'zigzag');
  }
  narrow(d) {
    const r = this.rng, wN = lerp(1.9, 1.3, d) * r.range(0.95, 1.08), L = r.range(12, 22) + d * 8;
    const wig = r.range(0.015, 0.04) * (0.5 + d), ph = r.range(0, TAU), n = Math.round(L / CFG.DS);
    return this.mk(L, (k) => ({ k: k > 8 && k < n - 4 ? Math.sin(k * 0.09 + ph) * wig : 0, w: wN, b: 0, sl: -0.025 }), null,
      (k, s) => { if (k > 10 && k % 7 === 0 && r.chance(0.6)) this.gem(s, 0); }, 'narrow');
  }
  banked(d, W) {
    const r = this.rng, bank = lerp(0.12, 0.23, d) * r.sign(), L = r.range(16, 26), n = Math.round(L / CFG.DS);
    const velodrome = r.chance(0.5);
    // velodrome: turn toward the low side (bank helps). Tilted straight: bank pushes to an edge.
    const sg = velodrome ? this.turnSign(1.0) : 1;
    const kap = velodrome ? Math.min(lerp(0.07, 0.15, d), Math.max(0, 1.4 - sg * this.th) / (L - 5)) : r.range(-0.02, 0.02);
    const b = velodrome ? -sg * Math.abs(bank) : bank;
    return this.mk(L, (k) => ({ k: k > 4 && k < n - 6 ? sg * kap : 0, w: W + 0.3, b: k < n - 8 ? b : 0, sl: -0.02 }), null,
      (k, s) => { if (k > 8 && k < n - 8 && k % 6 === 0) this.gem(s, Math.sign(b) * 0.4); }, 'banked');
  }
  holes(d) {
    const r = this.rng, W = lerp(2.9, 2.6, d), L = r.range(22, 34) + d * 10, n = Math.round(L / CFG.DS);
    const minLane = 1.12;
    // Pre-plan hole rows (index -> {type, extent}); first 10 rows let the width settle.
    const plan = new Map(); const gems = [];
    let k = 10, side = r.sign();
    while (k < n - 8) {
      const hl = Math.round(r.range(1.4, 2.2 + d * 1.0) / CFG.DS);
      const type = d > 0.3 && r.chance(0.3) ? 'center' : 'side';
      for (let j = 0; j < hl; j++) plan.set(k + j, { type, side });
      gems.push({ k: k + (hl >> 1), u: type === 'center' ? side * (W / 2 - 0.45) : -side * (W / 2 - 0.55) });
      k += hl + Math.round(r.range(lerp(8, 4.2, d), lerp(12, 6, d)) / CFG.DS);
      side = r.chance(0.75) ? -side : side;
    }
    return this.mk(L, (kk) => ({ k: 0, w: W, b: 0, sl: -0.02 }), (kk, m) => {
      const h = plan.get(kk); if (!h) return;
      const T = this.T, w = this.w, j = m * 3;
      if (h.type === 'side') {
        const keep = Math.max(minLane, w * lerp(0.52, 0.42, d));
        if (h.side > 0) { T.rowA[j] = -w / 2; T.rowAO[j] = 1; T.rowB[j] = -w / 2 + keep; T.rowBO[j] = 0; }
        else { T.rowA[j] = w / 2 - keep; T.rowAO[j] = 0; T.rowB[j] = w / 2; T.rowBO[j] = 1; }
      } else {
        const lane = Math.max(0.95, (w - lerp(0.8, 1.0, d)) / 2);
        T.rowN[m] = 2;
        T.rowA[j] = -w / 2; T.rowAO[j] = 1; T.rowB[j] = -w / 2 + lane; T.rowBO[j] = 0;
        T.rowA[j + 1] = w / 2 - lane; T.rowAO[j + 1] = 0; T.rowB[j + 1] = w / 2; T.rowBO[j + 1] = 1;
      }
    }, (kk, s) => { for (const g of gems) if (g.k === kk) this.gem(s, g.u); }, 'holes');
  }
  gaps(d) {
    const r = this.rng, W = 2.7, count = r.int(2, 2 + Math.round(d * 2));
    const pattern = []; // row states: 0 solid, 1 gap
    const push = (len, v) => { for (let j = 0; j < Math.round(len / CFG.DS); j++) pattern.push(v); };
    push(3, 0); push(1.5, 2); push(6, 0); // booster (2), then run-up
    for (let c = 0; c < count; c++) {
      push(lerp(1.0, 1.9, d) + r.range(0, 0.3), 1);
      push(c === count - 1 ? 10 : r.range(4.5, 7), 0);
    }
    const drop = 0.5;
    this.afterBoost = true;
    return this.mk(pattern.length * CFG.DS, (k) => {
      const v = pattern[k];
      if (v === 1) {
        let gl = 0; for (let j = k; j >= 0 && pattern[j] === 1; j--) gl++;
        let gr = 0; for (let j = k; j < pattern.length && pattern[j] === 1; j++) gr++;
        return { k: 0, w: W, b: 0, sl: 0, drop: -drop / ((gl + gr - 1) * CFG.DS) };
      }
      return { k: 0, w: W, b: 0, sl: 0, drop: 0 };
    }, (k, m) => {
      if (pattern[k] === 1) this.T.rowN[m] = 0;
      if (pattern[k] === 2) this.T.rowF[m] |= RF.BOOST;
    }, (k, s) => { if (pattern[k] === 1 && pattern[k - 1] === 0) this.gem(s, 0, 0.9); }, 'gaps');
  }
  obstacles(d) {
    const r = this.rng, W = lerp(3.0, 2.8, d), L = r.range(22, 32), n = Math.round(L / CFG.DS);
    const slider = d > 0.3 && r.chance(0.5);
    const ks = new Map();
    let k = 12, side = r.sign();
    while (k < n - 8) {
      if (slider && r.chance(0.5)) {
        ks.set(k, { kind: 'slider', amp: W / 2 - 0.55, period: r.range(2.4, 3.4) - d * 0.4, phase: r.range(0, TAU) });
      } else {
        // post leaving a lane of at least 1.35 m on the other side
        ks.set(k, { kind: 'post', u: side * (W / 2 - r.range(0.45, 0.75)) });
        side = -side;
      }
      k += Math.round(r.range(lerp(10, 6, d), lerp(14, 8, d)) / CFG.DS);
    }
    return this.mk(L, () => ({ k: 0, w: W, b: 0, sl: -0.02 }), null, (kk, s) => {
      const o = ks.get(kk); if (!o) return;
      if (o.kind === 'post') { this.T.objects.push({ kind: 'post', s, u: o.u, rad: 0.3, id: this.count++ }); this.gem(s, -o.u * 0.6); }
      else this.T.objects.push({ kind: 'slider', s, u: 0, rad: 0.42, amp: o.amp, period: o.period, phase: o.phase, id: this.count++ });
    }, 'obstacles');
  }
}

// =====================================================================
// Shaders (GLSL ES 1.0 / WebGL1 for maximum device coverage)
// =====================================================================
const GLSL_COMMON = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.0-2.0*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), u.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), u.x), u.y); }
float fbm(vec2 p){ return noise(p)*0.55 + noise(p*2.07+3.1)*0.28 + noise(p*4.3+7.7)*0.17; }
float bit(float f, float b){ return mod(floor(f / b + 0.001), 2.0); }
vec2 equirect(vec3 d){ return vec2(atan(d.x, d.z) * 0.15915494 + 0.5, acos(clamp(d.y, -1.0, 1.0)) * 0.31830989); }
`;

// Lit surfaces: track chunks + props. Materials selected by a_mat.x
const VS_LIT = `
attribute vec3 a_pos; attribute vec3 a_nrm; attribute vec2 a_uv; attribute vec4 a_aux; attribute vec4 a_mat;
uniform mat4 u_vp; uniform mat4 u_model; uniform float u_collapse; uniform float u_time;
varying vec3 v_wp; varying vec3 v_n; varying vec2 v_uv; varying vec4 v_aux; varying vec4 v_mat; varying float v_warn;
void main(){
  vec4 wp = u_model * vec4(a_pos, 1.0);
  vec3 n = (u_model * vec4(a_nrm, 0.0)).xyz;
  float dt = u_collapse - a_aux.x;          // seconds-ish since this row started falling
  v_warn = 0.0;
  if (dt > -3.0 && a_aux.x < 1e8) {
    if (dt > 0.0) {
      float t = dt * 0.2;
      float sd = a_aux.y - 0.5;
      wp.y -= 9.0 * t * t + t * 1.5;
      wp.x += sd * t * 3.0; wp.z += sd * t * 2.0;
      float a = sd * t * 2.5; float c = cos(a), s = sin(a);
      n = vec3(n.x * c - n.y * s, n.x * s + n.y * c, n.z);
      v_warn = 1.0;
    } else {
      float k = 1.0 + dt / 3.0;
      wp.y += sin(u_time * 47.0 + a_aux.y * 40.0) * 0.018 * k * k;
      v_warn = k * k;
    }
  }
  v_wp = wp.xyz; v_n = n; v_uv = a_uv; v_aux = a_aux; v_mat = a_mat;
  gl_Position = u_vp * wp;
}`;

const FS_LIT = GLSL_COMMON + `
varying vec3 v_wp; varying vec3 v_n; varying vec2 v_uv; varying vec4 v_aux; varying vec4 v_mat; varying float v_warn;
uniform vec3 u_cam; uniform vec3 u_sunDir; uniform vec3 u_sunCol; uniform vec3 u_fogCol; uniform vec3 u_abyss; uniform vec3 u_skyMid;
uniform vec3 u_deckA; uniform vec3 u_deckB; uniform vec3 u_trim; uniform vec3 u_under; uniform vec3 u_metal;
uniform vec3 u_accent; uniform vec3 u_accent2; uniform vec3 u_hazard;
uniform float u_pattern; uniform float u_gloss; uniform float u_time; uniform float u_fogDen; uniform float u_fogBase;
uniform vec4 u_ball; uniform vec3 u_ballGlow; uniform float u_ballLight; uniform float u_shadow;
uniform vec3 u_color; uniform float u_emis;
uniform sampler2D u_env;

vec3 envLookup(vec3 d){ return texture2D(u_env, equirect(d)).rgb; }

vec3 deck(vec2 uv, float seed, out float gloss){
  vec3 c; gloss = u_gloss;
  if (u_pattern < 0.5) {            // carbon twill
    vec2 q = uv * 7.0; float tw = step(0.5, fract((floor(q.x) + floor(q.y)) * 0.5));
    float fib = sin((tw > 0.5 ? q.x : q.y) * 18.85) * 0.5 + 0.5;
    c = mix(u_deckB, u_deckA, tw * 0.6 + fib * 0.4);
    gloss *= 0.8 + 0.2 * fib;
  } else if (u_pattern < 1.5) {     // brushed metal plates
    float st = noise(vec2(uv.x * 0.7, uv.y * 90.0)) * 0.6 + noise(vec2(uv.x * 3.0, uv.y * 260.0)) * 0.4;
    float plate = hash(vec2(floor(uv.x * 0.5), floor(uv.y * 1.2 + 10.0)));
    c = mix(u_deckB, u_deckA, st * 0.7 + plate * 0.3);
  } else if (u_pattern < 2.5) {     // wood boards
    float board = floor(uv.y * 2.6 + 20.0);
    float off = hash(vec2(board, 3.0)) * 7.0;
    float plank = floor((uv.x + off) / 3.0);
    float h = hash(vec2(board, plank));
    float grain = fbm(vec2((uv.x + off) * 0.9, uv.y * 14.0 + h * 9.0));
    float rings = sin(grain * 18.0 + uv.y * 30.0) * 0.5 + 0.5;
    c = mix(u_deckB, u_deckA, 0.35 + h * 0.4 + rings * 0.25);
    float seam = smoothstep(0.035, 0.0, abs(fract(uv.y * 2.6) - 0.0)) + smoothstep(0.96, 1.0, fract(uv.y * 2.6));
    float seam2 = smoothstep(0.02, 0.0, abs(fract((uv.x + off) / 3.0) - 0.0) * 3.0);
    c *= 1.0 - 0.55 * clamp(seam + seam2, 0.0, 1.0);
  } else {                           // marble
    float f = fbm(uv * vec2(0.35, 0.8) + seed * 0.1);
    float vein = pow(1.0 - abs(sin((uv.x * 0.45 + uv.y * 1.2 + f * 5.0) * 1.7)), 14.0);
    float vein2 = pow(1.0 - abs(sin((uv.x * 0.9 - uv.y * 0.6 + f * 7.0) * 2.3)), 22.0);
    c = mix(u_deckA, u_deckB, clamp(vein * 0.8 + vein2 * 0.5 + f * 0.25, 0.0, 1.0));
  }
  return c;
}

void main(){
  vec3 N = normalize(v_n + vec3(0.0, 1e-5, 0.0));
  vec3 V = normalize(u_cam - v_wp);
  float mat = v_mat.x, flags = v_mat.y, halfW = v_mat.z;
  vec3 base = u_metal; float gloss = 0.4; float spec = 0.5; vec3 emis = vec3(0.0); float glow = 0.0; float metal = 0.3;

  if (mat < 0.5) {                                   // deck top
    float s = v_uv.x, u = v_uv.y;
    base = deck(v_uv, v_aux.y, gloss); spec = 0.6;
    float seamD = abs(fract(s * 0.5) - 0.5) * 2.0;    // plank joints every 2 m
    float jt = smoothstep(0.012, 0.0, abs(seamD - 1.0) * 1.0) ;
    base *= 1.0 - 0.6 * smoothstep(0.985, 1.0, seamD);
    float dEdge = halfW - abs(u);
    // trim band along outer edges
    float band = smoothstep(0.2, 0.18, dEdge);
    base = mix(base, u_trim * 0.8, band * 0.75);
    // rivets
    vec2 rv = vec2(fract(s) - 0.5, dEdge - 0.1);
    float rr = length(rv);
    float riv = smoothstep(0.038, 0.028, rr) * step(dEdge, 0.2);
    base = mix(base, u_trim * 1.25 + 0.15, riv); spec += riv * 2.0;
    // center guide dashes (subtle, give speed feeling)
    float dash = step(0.55, fract(s * 0.5)) * smoothstep(0.03, 0.015, abs(u));
    emis += u_accent * dash * 0.55; glow += dash * 0.35;
    // edge light line
    float el = smoothstep(0.05, 0.0, abs(dEdge - 0.21));
    emis += u_accent * el * 0.9; glow += el * 0.6;
    // hazard stripes near hole edges / gap edges
    float hz = 0.0;
    if (bit(flags, 1.0) > 0.5) hz = max(hz, smoothstep(0.26, 0.24, u - v_aux.z));
    if (bit(flags, 2.0) > 0.5) hz = max(hz, smoothstep(0.26, 0.24, v_aux.w - u));
    float rowT = (s - v_aux.x) / 0.5;
    if (bit(flags, 4.0) > 0.5) hz = max(hz, smoothstep(0.62, 0.55, rowT));
    if (bit(flags, 8.0) > 0.5) hz = max(hz, smoothstep(0.38, 0.45, rowT));
    if (hz > 0.0) {
      float str = step(0.5, fract((s + u) * 2.2));
      base = mix(base, mix(vec3(0.03), u_hazard, str), hz);
      emis += u_hazard * hz * str * 0.25;
    }
    // booster chevrons
    if (bit(flags, 16.0) > 0.5) {
      float ch = fract(s * 0.9 - abs(u) * 0.7 - u_time * 2.6);
      float c1 = smoothstep(0.0, 0.08, ch) * smoothstep(0.5, 0.36, ch);
      float lane = smoothstep(halfW - 0.18, halfW - 0.3, abs(u));
      base = mix(base, base * 0.3, lane);
      emis += u_accent2 * c1 * lane * 2.2; glow += c1 * lane * 1.2;
    }
    if (bit(flags, 32.0) > 0.5) {                    // checkpoint line
      float cl = smoothstep(0.2, 0.0, abs(fract(s * 0.5 + 0.5) - 0.5) - 0.02);
      emis += mix(u_accent, vec3(1.0), 0.4) * 1.3; glow += 0.9;
    }
    if (bit(flags, 64.0) > 0.5) {                    // start checkers
      float ck = mod(floor(s * 3.0) + floor(u * 3.0 + 30.0), 2.0);
      base = mix(vec3(0.05), vec3(0.92), ck);
    }
  } else if (mat < 1.5) {                             // outer side wall with light strip
    float v = v_uv.y;
    base = u_trim * 0.4; gloss = 0.45; spec = 0.5; metal = 0.8;
    float strip = smoothstep(0.1, 0.03, abs(v - 0.42));
    float pulse = 0.55 + 0.45 * sin(v_uv.x * 0.8 - u_time * 5.0);
    emis += u_accent * strip * (0.6 + 0.9 * pulse); glow += strip * pulse;
    base *= 1.0 - 0.4 * smoothstep(0.7, 0.72, v);
    float vent = step(0.8, v) * step(0.5, fract(v_uv.x * 5.0));
    base *= 1.0 - 0.3 * vent;
  } else if (mat < 2.5) {                             // underside panels
    base = u_under; gloss = 0.2; spec = 0.2;
    float g = max(smoothstep(0.03, 0.0, abs(fract(v_uv.x * 0.5) - 0.5) - 0.47), smoothstep(0.03, 0.0, abs(fract(v_uv.y * 0.8) - 0.5) - 0.47));
    base *= 1.0 - 0.5 * g;
  } else if (mat < 3.5) {                             // mechanical parts
    base = u_metal; gloss = 0.55; spec = 1.0; metal = 0.9;
    base *= 0.8 + 0.3 * noise(v_uv * vec2(6.0, 18.0));
  } else if (mat < 4.5) {                             // accent light
    float bl = 0.65 + 0.35 * sin(u_time * 3.0 + v_aux.y * 20.0);
    base = u_accent * 0.2; emis = u_accent * (1.4 * v_mat.w) * bl; glow = 1.0 * bl;
  } else if (mat < 5.5) {                             // rails (chrome)
    base = mix(u_trim, vec3(0.9), 0.5); gloss = 0.95; spec = 2.0; metal = 1.0;
  } else if (mat < 6.5) {                             // raised rim
    base = u_trim; gloss = 0.8; spec = 1.6; metal = 0.9;
  } else if (mat < 7.5) {                             // accent2 light
    base = u_accent2 * 0.2; emis = u_accent2 * 1.5 * v_mat.w; glow = 1.0;
  } else if (mat < 8.5) {                             // hazard striped prop (sliders)
    float str = step(0.5, fract((v_uv.x + v_uv.y) * 4.0));
    base = mix(vec3(0.05), u_hazard, str); gloss = 0.7; spec = 1.2;
    emis += u_hazard * str * 0.15;
  } else if (mat < 9.5) {                             // generic prop colored by uniform
    base = u_color; gloss = 0.75; spec = 1.4; metal = 0.7;
    float band = smoothstep(0.04, 0.0, abs(v_uv.y - 0.82) - 0.05);
    emis += u_accent * band * 1.6; glow += band;
  } else if (mat < 10.5) {                            // gem
    base = u_color * 0.55; gloss = 0.9; spec = 1.6; metal = 0.5;
    float facet = abs(dot(N, normalize(vec3(0.3, 0.8, 0.5))));
    emis = u_color * (0.28 + 0.35 * facet + 0.12 * sin(u_time * 5.0 + v_wp.x)) * u_emis; glow = 0.7;
  } else if (mat < 11.5) {                            // gate / monolith frame lights
    float e = max(smoothstep(0.1, 0.0, min(v_uv.x, 1.0 - v_uv.x)), smoothstep(0.1, 0.0, min(v_uv.y, 1.0 - v_uv.y)));
    base = u_metal * 0.5; gloss = 0.6; spec = 1.0;
    emis = u_color * e * 1.8 * u_emis; glow = e * u_emis;
  } else {                                            // hole walls / caps: dark + hazard glow line
    base = u_under * 0.7; gloss = 0.2; spec = 0.3;
    float top = smoothstep(0.16, 0.02, v_uv.y);
    emis += u_hazard * top * 1.1; glow += top * 0.8;
  }

  // collapse warning tint
  if (v_warn > 0.0) { emis += vec3(1.0, 0.12, 0.2) * v_warn * 0.8 * (0.6 + 0.4 * sin(u_time * 20.0)); glow += v_warn * 0.5; }

  // ---- lighting
  vec3 L = u_sunDir;
  float ndl = max(dot(N, L), 0.0);
  vec3 H = normalize(L + V);
  float sp = pow(max(dot(N, H), 0.0), mix(16.0, 180.0, gloss)) * spec;
  vec3 amb = mix(u_abyss * 0.35, u_skyMid * 0.9 + 0.08, N.y * 0.5 + 0.5);
  float fres = pow(1.0 - max(dot(N, V), 0.0), 4.0);
  vec3 R = reflect(-V, N);
  vec3 env = envLookup(R);
  vec3 col = base * (amb * 0.75 + u_sunCol * ndl * 0.95) * (1.0 - metal * 0.45);
  col += env * (mix(0.04, 0.55, metal) * gloss + fres * gloss * 0.6) * mix(vec3(1.0), base * 1.6 + 0.2, metal * 0.6);
  col += u_sunCol * sp;

  // ball: contact shadow + light spill
  vec3 d = v_wp - u_ball.xyz;
  float hgt = max(0.0, -d.y);
  if (N.y > 0.3) {
    float r = u_ball.w * (1.05 + hgt * 0.25);
    float sh = smoothstep(r * 1.25, r * 0.15, length(d.xz)) * u_shadow * clamp(1.4 - hgt * 0.35, 0.0, 1.0);
    col *= 1.0 - sh * 0.72;
  }
  float bd = length(d);
  col += u_ballGlow * (u_ballLight / (1.0 + bd * bd * 1.8)) * max(dot(N, -d / max(bd, 0.001)), 0.0);

  col += emis;
  // ---- fog (distance + abyss haze)
  float dist = length(v_wp - u_cam);
  float fog = 1.0 - exp(-dist * u_fogDen);
  float below = clamp((u_fogBase - v_wp.y) * 0.07, 0.0, 1.0);
  fog = clamp(fog + below * 0.85, 0.0, 1.0);
  vec3 fc = mix(u_fogCol, u_abyss * 0.8, below);
  col = mix(col, fc, fog);
  gl_FragColor = vec4(col, clamp(glow * (1.0 - fog), 0.0, 1.0));
}`;

// Ball: env reflections, fresnel, dynamic highlight, several material types.
const VS_BALL = `
attribute vec3 a_pos; attribute vec3 a_nrm;
uniform mat4 u_vp; uniform mat4 u_model;
varying vec3 v_wp; varying vec3 v_n; varying vec3 v_on;
void main(){ vec4 wp = u_model * vec4(a_pos, 1.0); v_wp = wp.xyz; v_n = normalize((u_model * vec4(a_nrm, 0.0)).xyz); v_on = a_nrm; gl_Position = u_vp * wp; }`;

const FS_BALL = GLSL_COMMON + `
varying vec3 v_wp; varying vec3 v_n; varying vec3 v_on;
uniform vec3 u_cam; uniform vec3 u_sunDir; uniform vec3 u_sunCol; uniform vec3 u_floor; uniform vec3 u_accent; uniform vec3 u_skyMid; uniform vec3 u_abyss;
uniform vec3 u_base; uniform vec3 u_glowCol; uniform float u_type; uniform float u_time; uniform float u_speed; uniform float u_fade;
uniform sampler2D u_env; uniform sampler2D u_envBlur;
vec3 env(vec3 d){ return texture2D(u_env, equirect(d)).rgb; }
vec3 envB(vec3 d){ return texture2D(u_envBlur, equirect(d)).rgb; }
vec3 world(vec3 R, bool blur){
  vec3 e = blur ? envB(R) : env(R);
  // lower hemisphere reflects the track deck and its light strips
  float fl = smoothstep(0.02, -0.3, R.y);
  float stripes = smoothstep(0.92, 1.0, abs(sin(atan(R.x, R.z) * 3.0)));
  vec3 flo = u_floor * (0.35 + 0.4 * max(-R.y, 0.0)) + u_accent * stripes * 0.35 * smoothstep(-0.1, -0.35, R.y);
  return mix(e, flo, fl * 0.9);
}
void main(){
  vec3 N = normalize(v_n), V = normalize(u_cam - v_wp), R = reflect(-V, N);
  vec3 o = normalize(v_on);
  float ndv = max(dot(N, V), 0.0);
  float fres = pow(1.0 - ndv, 3.0);
  vec3 L = u_sunDir;
  float spec = pow(max(dot(R, L), 0.0), 220.0) * 5.0 + pow(max(dot(R, L), 0.0), 24.0) * 0.35;
  vec3 L2 = normalize(vec3(-L.x, 0.4, -L.z));
  spec += pow(max(dot(R, L2), 0.0), 90.0) * 0.8;
  float ndl = max(dot(N, L), 0.0);
  vec3 amb = mix(u_abyss * 0.3, u_skyMid + 0.1, N.y * 0.5 + 0.5);
  vec3 col; float glow = 0.0;
  if (u_type < 0.5) {                          // polished metal
    vec3 e = world(R, false);
    col = e * u_base * (1.25 + 0.6 * fres) + u_base * amb * 0.18;
    float ring = smoothstep(0.035, 0.0, abs(o.y)) + smoothstep(0.02, 0.0, abs(o.x)) * 0.6;
    col *= 1.0 - ring * 0.55;
    col += ring * u_glowCol * 0.15;
  } else if (u_type < 1.5) {                   // glass
    vec3 T = refract(-V, N, 0.72);
    vec3 inner = envB(T) * u_base * 0.9;
    float core = pow(max(dot(-T, normalize(V)), 0.0), 3.0);
    float swirl = sin(o.x * 7.0 + sin(o.y * 5.0 + u_time * 0.5) * 2.0 + o.z * 4.0);
    inner += u_glowCol * (0.25 + 0.25 * swirl) * core;
    col = mix(inner, world(R, false), 0.1 + fres * 0.85);
    glow = 0.35;
  } else if (u_type < 2.5) {                   // plasma core
    float veins = pow(1.0 - abs(sin(o.x * 6.0 + sin(o.y * 7.0 + u_time * 1.3) * 1.6 + o.z * 3.0)), 10.0);
    veins += pow(1.0 - abs(sin(o.z * 9.0 - o.y * 4.0 + u_time * 0.7)), 16.0) * 0.6;
    col = u_base * (amb * 0.4 + ndl * 0.3) + world(R, true) * (0.12 + fres * 0.6);
    col += u_glowCol * veins * (1.3 + u_speed * 0.8);
    glow = veins * 0.9;
  } else {                                     // candy plastic with stripe
    float stripe = smoothstep(0.34, 0.3, abs(o.y));
    vec3 b = mix(vec3(0.97), u_base, stripe);
    float dot2 = smoothstep(0.24, 0.2, length(o.xz - vec2(0.0, 0.0)) ) * step(0.5, abs(o.y));
    b = mix(b, u_base * 0.7, dot2);
    col = b * (amb * 0.55 + u_sunCol * ndl * 0.8) + world(R, true) * (0.06 + fres * 0.5);
  }
  col += u_sunCol * spec;
  col += u_glowCol * fres * (0.25 + u_speed * 0.6);
  gl_FragColor = vec4(col * u_fade, clamp(glow + spec * 0.15 + u_speed * fres * 0.5, 0.0, 1.0));
}`;

// Sky: fullscreen triangle sampling the pre-rendered equirect panorama.
const VS_SKY = `attribute vec2 a_pos; varying vec2 v_p; void main(){ v_p = a_pos; gl_Position = vec4(a_pos, 0.9999, 1.0); }`;
const FS_SKY = GLSL_COMMON + `
varying vec2 v_p; uniform mat4 u_invVP; uniform sampler2D u_env; uniform vec3 u_sunDir; uniform vec3 u_sunCol; uniform float u_time;
void main(){
  vec4 a = u_invVP * vec4(v_p, -1.0, 1.0); vec4 b = u_invVP * vec4(v_p, 1.0, 1.0);
  vec3 d = normalize(b.xyz / b.w - a.xyz / a.w);
  vec3 col = texture2D(u_env, equirect(d)).rgb;
  float sd = max(dot(d, u_sunDir), 0.0);
  col += u_sunCol * (pow(sd, 900.0) * 3.0 + pow(sd, 60.0) * 0.25);
  col += (hash(v_p * 431.0 + u_time) - 0.5) * 0.012;
  gl_FragColor = vec4(col, clamp(pow(sd, 600.0) * 1.5, 0.0, 1.0));
}`;

// Point sprites: stars, dust, particles (additive).
const VS_PTS = `
attribute vec3 a_pos; attribute vec4 a_col; attribute float a_size;
uniform mat4 u_vp; uniform vec3 u_off; uniform float u_px; uniform float u_persp; uniform float u_time;
varying vec4 v_col;
void main(){
  vec4 p = u_vp * vec4(a_pos + u_off, 1.0);
  gl_Position = p;
  float tw = u_persp > 0.5 ? 1.0 : 0.6 + 0.4 * sin(u_time * (1.0 + a_size) + a_pos.x * 13.0);
  gl_PointSize = u_persp > 0.5 ? clamp(a_size * u_px / max(p.w, 0.05), 1.0, 90.0) : a_size * u_px * 0.0016;
  v_col = vec4(a_col.rgb, a_col.a * tw);

const FS_PTS = `
precision mediump float; varying vec4 v_col;
void main(){ vec2 c = gl_PointCoord * 2.0 - 1.0; float d = dot(c, c); if (d > 1.0) discard;
  float a = (1.0 - d); a = a * a * v_col.a; gl_FragColor = vec4(v_col.rgb * a, a * 0.6); }`;

// Additive FX geometry: trail ribbon, glows, light shafts.
const VS_FX = `
attribute vec3 a_pos; attribute vec3 a_uv; attribute vec4 a_col;
uniform mat4 u_vp; varying vec3 v_uv; varying vec4 v_col;
void main(){ v_uv = a_uv; v_col = a_col; gl_Position = u_vp * vec4(a_pos, 1.0); }`;
const FS_FX = `
precision mediump float; varying vec3 v_uv; varying vec4 v_col;
void main(){
  float a;
  if (v_uv.z < 0.5) { float x = 1.0 - abs(v_uv.y * 2.0 - 1.0); a = x * x * v_uv.x; }                    // ribbon
  else if (v_uv.z < 1.5) { vec2 c = v_uv.xy * 2.0 - 1.0; float d = max(1.0 - dot(c, c), 0.0); a = d * d * d; } // radial glow
  else { float x = 1.0 - abs(v_uv.x * 2.0 - 1.0); a = x * x * smoothstep(0.0, 0.35, v_uv.y) * smoothstep(1.0, 0.5, v_uv.y); } // shaft
  a *= v_col.a;
  gl_FragColor = vec4(v_col.rgb * a, a * 0.5);
}`;

// Post: bright/glow extraction, separable blur, final composite.
const VS_POST = `attribute vec2 a_pos; varying vec2 v_uv; void main(){ v_uv = a_pos * 0.5 + 0.5; gl_Position = vec4(a_pos, 0.0, 1.0); }`;
const FS_BRIGHT = `
precision mediump float; varying vec2 v_uv; uniform sampler2D u_tex; uniform vec2 u_px;
void main(){
  vec4 s = texture2D(u_tex, v_uv + u_px * vec2(-0.5, -0.5)) + texture2D(u_tex, v_uv + u_px * vec2(0.5, -0.5))
         + texture2D(u_tex, v_uv + u_px * vec2(-0.5, 0.5)) + texture2D(u_tex, v_uv + u_px * vec2(0.5, 0.5));
  s *= 0.25;
  float l = dot(s.rgb, vec3(0.3, 0.55, 0.15));
  gl_FragColor = vec4(s.rgb * (s.a * 0.9 + smoothstep(0.75, 1.0, l) * 0.5), 1.0);
}`;
const FS_BLUR = `
precision mediump float; varying vec2 v_uv; uniform sampler2D u_tex; uniform vec2 u_dir;
void main(){
  vec3 c = texture2D(u_tex, v_uv).rgb * 0.227;
  c += (texture2D(u_tex, v_uv + u_dir * 1.385).rgb + texture2D(u_tex, v_uv - u_dir * 1.385).rgb) * 0.316;
  c += (texture2D(u_tex, v_uv + u_dir * 3.231).rgb + texture2D(u_tex, v_uv - u_dir * 3.231).rgb) * 0.070;
  gl_FragColor = vec4(c, 1.0);
}`;
const FS_COMPOSITE = `
precision mediump float; varying vec2 v_uv;
uniform sampler2D u_scene; uniform sampler2D u_bloom; uniform float u_bloomK; uniform float u_blur; uniform float u_ca; uniform float u_time; uniform vec2 u_center;
float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
void main(){
  vec2 dir = v_uv - u_center; float r = length(dir);
  vec3 c;
  if (u_blur > 0.001) {
    vec2 st = dir * u_blur * 0.035 * smoothstep(0.1, 0.6, r);
    c = texture2D(u_scene, v_uv).rgb * 0.3 + texture2D(u_scene, v_uv - st).rgb * 0.25 + texture2D(u_scene, v_uv - st * 2.0).rgb * 0.25 + texture2D(u_scene, v_uv - st * 3.0).rgb * 0.2;
  } else c = texture2D(u_scene, v_uv).rgb;
  if (u_ca > 0.001) {
    vec2 o = dir * u_ca * 0.012 * r;
    c.r = mix(c.r, texture2D(u_scene, v_uv + o).r, 0.8); c.b = mix(c.b, texture2D(u_scene, v_uv - o).b, 0.8);
  }
  c += texture2D(u_bloom, v_uv).rgb * u_bloomK;
  c = c / (1.0 + max(max(c.r, c.g), c.b) * 0.08);     // soft shoulder
  c += (h(v_uv * 731.0 + fract(u_time)) - 0.5) * 0.02;
  gl_FragColor = vec4(c, 1.0);
}`;

// =====================================================================
// Geometry: MeshBuilder (interleaved 16-float vertices), primitives,
// procedural track chunk mesher, sky panorama generator.
// Layout: pos3 nrm3 uv2 aux4 mat4
// =====================================================================
const VSTRIDE = 16;
class MeshBuilder {
  constructor(vcap = 4096) {
    this.v = new Float32Array(vcap * VSTRIDE); this.idx = new Uint16Array(vcap * 2);
    this.nv = 0; this.ni = 0;
    this.A = [1e9, 0, 0, 0];   // aux: rowS, seed, edgeA, edgeB  (rowS=1e9 → never collapses)
    this.M = [0, 0, 0, 1];     // mat: id, flags, halfWidth, emissive
  }
  grow(nv, ni) {
    if ((this.nv + nv) * VSTRIDE > this.v.length) { const n = new Float32Array(Math.max(this.v.length * 2, (this.nv + nv) * VSTRIDE)); n.set(this.v); this.v = n; }
    if (this.ni + ni > this.idx.length) { const n = new Uint16Array(Math.max(this.idx.length * 2, this.ni + ni)); n.set(this.idx); this.idx = n; }
  }
  V(px, py, pz, nx, ny, nz, u, v) {
    const o = this.nv * VSTRIDE, a = this.v, A = this.A, M = this.M;
    a[o] = px; a[o + 1] = py; a[o + 2] = pz; a[o + 3] = nx; a[o + 4] = ny; a[o + 5] = nz; a[o + 6] = u; a[o + 7] = v;
    a[o + 8] = A[0]; a[o + 9] = A[1]; a[o + 10] = A[2]; a[o + 11] = A[3];
    a[o + 12] = M[0]; a[o + 13] = M[1]; a[o + 14] = M[2]; a[o + 15] = M[3];
    return this.nv++;
  }
  tri(a, b, c) { const I = this.idx; I[this.ni++] = a; I[this.ni++] = b; I[this.ni++] = c; }
  // Quad with explicit normal(s). p: 4 points [x,y,z]; uv: 8 numbers.
  quad(p0, p1, p2, p3, n, uv, n2) {
    this.grow(4, 6);
    const m = n2 || n;
    const a = this.V(p0[0], p0[1], p0[2], n[0], n[1], n[2], uv[0], uv[1]);
    this.V(p1[0], p1[1], p1[2], n[0], n[1], n[2], uv[2], uv[3]);
    this.V(p2[0], p2[1], p2[2], m[0], m[1], m[2], uv[4], uv[5]);
    this.V(p3[0], p3[1], p3[2], m[0], m[1], m[2], uv[6], uv[7]);
    this.tri(a, a + 1, a + 2); this.tri(a, a + 2, a + 3);
  }
  // Flat-shaded quad whose normal points away from `ctr`.
  face(p0, p1, p2, p3, ctr, uv) {
    // diagonals' cross product: valid for quads and for triangles (p3 === p0)
    const ax = p2[0] - p0[0], ay = p2[1] - p0[1], az = p2[2] - p0[2];
    const bx = p3[0] - p1[0], by = p3[1] - p1[1], bz = p3[2] - p1[2];
    let nx = ay * bz - az * by, ny = az * bx - ax * bz, nz = ax * by - ay * bx;
    const l = Math.hypot(nx, ny, nz) || 1; nx /= l; ny /= l; nz /= l;
    const cx = (p0[0] + p2[0]) / 2 - ctr[0], cy = (p0[1] + p2[1]) / 2 - ctr[1], cz = (p0[2] + p2[2]) / 2 - ctr[2];
    if (nx * cx + ny * cy + nz * cz < 0) { nx = -nx; ny = -ny; nz = -nz; }
    this.quad(p0, p1, p2, p3, [nx, ny, nz], uv || [0, 0, 1, 0, 1, 1, 0, 1]);
  }
  // Hexahedron from 8 corners: c[0..3] bottom ring, c[4..7] top ring (same order).
  hexa(c, uvScale = 1) {
    const ctr = [0, 0, 0];
    for (const p of c) { ctr[0] += p[0] / 8; ctr[1] += p[1] / 8; ctr[2] += p[2] / 8; }
    const U = [0, 0, uvScale, 0, uvScale, 1, 0, 1];
    this.face(c[0], c[1], c[2], c[3], ctr, U); this.face(c[4], c[5], c[6], c[7], ctr, U);
    for (let k = 0; k < 4; k++) { const j = (k + 1) & 3; this.face(c[k], c[j], c[j + 4], c[k + 4], ctr, U); }
  }
  // Box along a segment a→b with square section `t`.
  strut(a, b, t) {
    const dx = b[0] - a[0], dy = b[1] - a[1], dz = b[2] - a[2];
    const l = Math.hypot(dx, dy, dz) || 1, d = [dx / l, dy / l, dz / l];
    let px = [d[1], -d[0], 0]; if (Math.abs(d[2]) > 0.9 || Math.hypot(px[0], px[1]) < 0.1) px = [0, d[2], -d[1]];
    let pl = Math.hypot(px[0], px[1], px[2]) || 1; px = px.map((v) => v / pl);
    const py = [d[1] * px[2] - d[2] * px[1], d[2] * px[0] - d[0] * px[2], d[0] * px[1] - d[1] * px[0]];
    const c = [];
    for (const e of [a, b]) for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]])
      c.push([e[0] + (px[0] * sx + py[0] * sy) * t, e[1] + (px[1] * sx + py[1] * sy) * t, e[2] + (px[2] * sx + py[2] * sy) * t]);
    this.hexa(c, l);
  }
}

// ---------------------------------------------------------------- primitives
const Prims = {
  sphere(seg = 36, rings = 24) {
    const mb = new MeshBuilder(seg * rings + seg + rings + 1);
    for (let y = 0; y <= rings; y++) {
      const v = y / rings, th = v * Math.PI;
      for (let x = 0; x <= seg; x++) {
        const u = x / seg, ph = u * TAU;
        const nx = Math.sin(th) * Math.cos(ph), ny = Math.cos(th), nz = Math.sin(th) * Math.sin(ph);
        mb.grow(1, 0); mb.V(nx, ny, nz, nx, ny, nz, u, v);
      }
    }
    for (let y = 0; y < rings; y++) for (let x = 0; x < seg; x++) {
      const a = y * (seg + 1) + x, b = a + seg + 1;
      mb.grow(0, 6); mb.tri(a, b, a + 1); mb.tri(a + 1, b, b + 1);
    }
    return mb;
  },
  gem() {
    const mb = new MeshBuilder(64); mb.M = [10, 0, 0, 1];
    const n = 6, top = [0, 1, 0], bot = [0, -1, 0], ring = [];
    for (let k = 0; k < n; k++) { const a = k / n * TAU; ring.push([Math.cos(a) * 0.62, 0.15, Math.sin(a) * 0.62]); }
    for (let k = 0; k < n; k++) {
      const a = ring[k], b = ring[(k + 1) % n];
      mb.face(top, a, b, top, [0, 0.1, 0]); mb.face(bot, b, a, bot, [0, 0.1, 0]);
    }
    return mb;
  },
  cylinder(seg = 16, mat = 9) {
    const mb = new MeshBuilder(seg * 8); mb.M = [mat, 0, 0, 1];
    for (let k = 0; k < seg; k++) {
      const a0 = k / seg * TAU, a1 = (k + 1) / seg * TAU;
      const c0 = Math.cos(a0), s0 = Math.sin(a0), c1 = Math.cos(a1), s1 = Math.sin(a1);
      mb.quad([c0, 0, s0], [c1, 0, s1], [c1, 1, s1], [c0, 1, s0], [c0, 0, s0], [k / seg, 0, (k + 1) / seg, 0, (k + 1) / seg, 1, k / seg, 1], [c1, 0, s1]);
      mb.grow(3, 3);
      const t = mb.V(0, 1, 0, 0, 1, 0, 0.5, 0.95), p = mb.V(c0, 1, s0, 0, 1, 0, 0, 0.95), q = mb.V(c1, 1, s1, 0, 1, 0, 1, 0.95);
      mb.tri(t, p, q);
    }
    return mb;
  },
  box(mat, emis = 1) {
    const mb = new MeshBuilder(32); mb.M = [mat, 0, 0, emis];
    const c = [];

            [hb[0] - 0.09, hb[1] + 0.12, hb[2] - 0.09], [hb[0] + 0.09, hb[1] + 0.12, hb[2] - 0.09], [hb[0] + 0.09, hb[1] + 0.12, hb[2] + 0.09], [hb[0] - 0.09, hb[1] + 0.12, hb[2] + 0.09]]);

// ---------------------------------------------------------------- sky panorama (Canvas 2D → texture)

  const g = cv.getContext('2d');
  const css = (c, a = 1) => `rgba(${Math.round(c[0] * 255)},${Math.round(c[1] * 255)},${Math.round(c[2] * 255)},${a})`;
  const grd = g.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, css(theme.skyTop)); grd.addColorStop(0.28, css(theme.skyMid));
  grd.addColorStop(0.47, css(theme.horizon)); grd.addColorStop(0.53, css(theme.fog));
  grd.addColorStop(0.78, css(theme.abyss.map((v, i) => lerp(v, theme.fog[i], 0.45)))); grd.addColorStop(1, css(theme.abyss));
  g.fillStyle = grd; g.fillRect(0, 0, W, H);

    for (const ox of [-W, 0, W]) {
      if (x + ox + rad < 0 || x + ox - rad > W) continue;
      const rg = g.createRadialGradient(x + ox, y, 0, x + ox, y, rad);
      rg.addColorStop(0, css(col, a)); rg.addColorStop(1, css(col, 0));
      g.fillStyle = rg; g.fillRect(x + ox - rad, y - rad, rad * 2, rad * 2);
    }

  for (let b = 0; b < 4; b++) {
    const cx = r.range(0, W), cy = r.range(H * 0.14, H * 0.46), col = theme.neb[b % theme.neb.length];
    for (let k = 0; k < 34; k++) blob(cx + r.range(-260, 260), cy + r.range(-60, 60) * (1 + k / 40), r.range(25, 150), col, r.range(0.04, 0.11));
  }
  // horizon glow + abyss light below
  const hz = g.createLinearGradient(0, H * 0.4, 0, H * 0.62);
  hz.addColorStop(0, css(theme.horizon, 0)); hz.addColorStop(0.5, css(theme.horizon, 0.35)); hz.addColorStop(1, css(theme.horizon, 0));
  g.fillStyle = hz; g.fillRect(0, H * 0.4, W, H * 0.22);
  for (let k = 0; k < 26; k++) blob(r.range(0, W), r.range(H * 0.66, H * 0.95), r.range(40, 170), theme.abyss, r.range(0.05, 0.12));

  for (let k = 0; k < 1400; k++) {
    const y = Math.pow(r.next(), 1.2) * H * 0.5, x = r.range(0, W), a = r.range(0.08, 0.5);
    g.fillStyle = `rgba(255,255,255,${a})`; g.fillRect(x, y, r.chance(0.1) ? 2 : 1, 1);
  }

  g.globalCompositeOperation = 'source-over';
  for (let k = 0; k < 18; k++) blob(r.range(0, W), r.range(H * 0.18, H * 0.42), r.range(30, 110), theme.skyTop, r.range(0.12, 0.3));

  const blur = down(down(mid, 128, 64), 64, 32);
  return { sky: cv, mid, blur };
}

// =====================================================================
// Renderer — WebGL1 forward renderer with optional bloom post chain.
// =====================================================================
class Renderer {

    this.ident = M4.create(); this.tmpM = M4.create();

      ball: this.upload(Prims.sphere(40, 28)), gem: this.upload(Prims.gem()), post: this.upload(Prims.cylinder(18, 9)),
      slider: this.upload(Prims.box(8)), gate: this.upload(Prims.gate()), mono: this.upload(Prims.box(11)),
      ring: this.upload(Prims.torus(1, 0.035, 64, 6)), cube: this.upload(Prims.box(3)),

  drawChunk(ch) {

    this.bindMesh(ch.mesh, 5);
    this.gl.drawElements(this.gl.TRIANGLES, ch.mesh.count, this.gl.UNSIGNED_SHORT, 0);
  }
  drawProp(mesh, model, color, emis) {
    const gl = this.gl, p = this.pLit;
    gl.uniformMatrix4fv(p.u('u_model'), false, model);
    gl.uniform3fv(p.u('u_color'), color); gl.uniform1f(p.u('u_emis'), emis);

    gl.drawElements(gl.TRIANGLES, mesh.count, gl.UNSIGNED_SHORT, 0);
  }
  endLit() { this.gl.uniformMatrix4fv(this.pLit.u('u_model'), false, this.ident); }

  drawBall(model, skin, speed, fade) {
    const gl = this.gl, T = this.theme, p = this.use(this.pBall);
    gl.uniformMatrix4fv(p.u('u_vp'), false, this.vp); gl.uniformMatrix4fv(p.u('u_model'), false, model);
    gl.uniform3fv(p.u('u_cam'), this.cam); gl.uniform3fv(p.u('u_sunDir'), this.sunDir); gl.uniform3fv(p.u('u_sunCol'), T.sun);
    gl.uniform3fv(p.u('u_floor'), T.deckA); gl.uniform3fv(p.u('u_accent'), T.accent); gl.uniform3fv(p.u('u_skyMid'), T.skyMid); gl.uniform3fv(p.u('u_abyss'), T.abyss);
    gl.uniform3fv(p.u('u_base'), skin.base); gl.uniform3fv(p.u('u_glowCol'), skin.glow); gl.uniform1f(p.u('u_type'), skin.type);
    gl.uniform1f(p.u('u_time'), this.time % 1000); gl.uniform1f(p.u('u_speed'), speed); gl.uniform1f(p.u('u_fade'), fade);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, this.texMid); gl.uniform1i(p.u('u_env'), 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, this.texBlur); gl.uniform1i(p.u('u_envBlur'), 1);
    gl.activeTexture(gl.TEXTURE0);
    this.bindMesh(this.meshes.ball, 2);
    gl.drawElements(gl.TRIANGLES, this.meshes.ball.count, gl.UNSIGNED_SHORT, 0);
  }

  beginAdditive() { const gl = this.gl; gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); gl.depthMask(false); }
  drawFx(data, nverts) {
    if (nverts <= 0) return;
    const gl = this.gl, p = this.use(this.pFx);
    gl.uniformMatrix4fv(p.u('u_vp'), false, this.vp);

  }
  drawPoints(data, n) {

    gl.uniform1f(p.u('u_px'), this.h * 0.9); gl.uniform1f(p.u('u_persp'), 1);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.ptsBuf); gl.bufferData(gl.ARRAY_BUFFER, data.subarray(0, n * 8), gl.DYNAMIC_DRAW);

  }
  endAdditive() { const gl = this.gl; gl.disable(gl.BLEND); gl.depthMask(true); }

  finish(o) {
    if (!this.post || !this.fbo) return;

    pass(B, this.pBlur, A.tex, (p) => gl.uniform2f(p.u('u_dir'), 1.4 / A.w, 0));
    pass(A, this.pBlur, B.tex, (p) => gl.uniform2f(p.u('u_dir'), 0, 1.4 / A.h));
    pass(B, this.pBlur, A.tex, (p) => gl.uniform2f(p.u('u_dir'), 2.6 / A.w, 0));
    pass(A, this.pBlur, B.tex, (p) => gl.uniform2f(p.u('u_dir'), 0, 2.6 / A.h));
    pass(null, this.pComp, this.fbo.tex, (p) => {
      gl.uniform1i(p.u('u_scene'), 0);
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, A.tex); gl.uniform1i(p.u('u_bloom'), 1); gl.activeTexture(gl.TEXTURE0);
      gl.uniform1f(p.u('u_bloomK'), o.bloom); gl.uniform1f(p.u('u_blur'), o.blur); gl.uniform1f(p.u('u_ca'), o.ca);
      gl.uniform1f(p.u('u_time'), this.time % 100); gl.uniform2f(p.u('u_center'), o.cx, o.cy);
    });
  }
}

// =====================================================================
// Ball + Physics — world-space rolling sphere constrained to the deck.
// =====================================================================
class Ball {
  constructor() { this.p = [0, 0, 0]; this.v = [0, 0, 0]; this.q = [0, 0, 0, 1]; this.w = [0, 0, 0]; this.reset(); }
  reset() {
    this.p.fill(0); this.v.fill(0); this.q[0] = this.q[1] = this.q[2] = 0; this.q[3] = 1; this.w.fill(0);
    this.grounded = true; this.lost = false; this.s = 0; this.u = 0; this.hint = 0; this.air = 0;
    this.boost = 0; this.lastPad = -99; this.speed = 0; this.surfY = 0; this.support = true;
  }
}

class Physics {
  constructor(track, ev) { this.T = track; this.ev = ev; this.collapseS = -1e9; this.time = 0; this.tmp = [0, 0, 0, 0]; }

  supported(L) {
    if (L.out || L.s < this.collapseS) return false;
    return this.T.solidAt(L.i, L.t, L.u) >= 0;
  }

  step(b, ix, iy, camYaw, dt) {
    const T = this.T, R = CFG.R, G = CFG.G;
    this.time += dt;
    if (b.lost) {                                  // free fall into the abyss
      if (b.p[1] < b.surfY - 150) { b.v.fill(0); return; }
      b.v[1] -= G * dt; b.v[0] *= 1 - 0.3 * dt; b.v[2] *= 1 - 0.3 * dt;
      b.p[0] += b.v[0] * dt; b.p[1] += b.v[1] * dt; b.p[2] += b.v[2] * dt;
      Q.integrate(b.q, b.w[0], b.w[1], b.w[2], dt);
      return;
    }
    const fx = Math.sin(camYaw), fz = Math.cos(camYaw), rx = -fz, rz = fx;
    const ax = (rx * ix + fx * iy) * CFG.ACC, az = (rz * ix + fz * iy) * CFG.ACC;
    let L = T.locate(b.p[0], b.p[2], b.hint);
    b.hint = L.i;
    b.boost = Math.max(0, b.boost - dt);

    if (b.grounded) {
      const k = G * 0.714, tb = Math.tan(L.bank);
      const gA = -k * L.slope, gL = -k * tb;
      b.v[0] += (ax + L.fx * gA + L.rx * gL) * dt;
      b.v[2] += (az + L.fz * gA + L.rz * gL) * dt;
      // rolling resistance + soft top speed
      let sp = Math.hypot(b.v[0], b.v[2]);
      const damp = 1 - (0.26 + (Math.abs(ix) + Math.abs(iy) < 0.05 && sp < 1.2 ? 1.4 : 0)) * dt;
      b.v[0] *= damp; b.v[2] *= damp;
      sp *= damp;
      const vmax = CFG.VMAX + (CFG.VBOOST - CFG.VMAX) * clamp(b.boost / 0.9, 0, 1);
      if (sp > vmax) { const f = Math.max(vmax / sp, 1 - 1.3 * dt); b.v[0] *= f; b.v[2] *= f; }
      const py = b.p[1];
      b.p[0] += b.v[0] * dt; b.p[2] += b.v[2] * dt;
      L = T.locate(b.p[0], b.p[2], b.hint); b.hint = L.i;
      this.rails(b, L);
      this.props(b, L);
      if (this.supported(L)) {
        b.p[1] = T.surfaceY(L, L.u) + R;
        b.v[1] = clamp((b.p[1] - py) / dt, -30, 30);
        const m = L.i & T.mask;
        if ((T.rowF[m] & RF.BOOST) && Math.abs(L.i - b.lastPad) > 8) {
          b.lastPad = L.i;
          // boosters also steady the ball: half of the sideways drift is removed
          const vf = b.v[0] * L.fx + b.v[2] * L.fz, vl = b.v[0] * L.rx + b.v[2] * L.rz;
          const add = Math.max(0, CFG.VBOOST - vf);
          b.v[0] += L.fx * add - L.rx * vl * 0.5; b.v[2] += L.fz * add - L.rz * vl * 0.5; b.boost = 1.3;
          this.ev.boost(b);
        }
      } else {
        b.grounded = false; b.air = 0;
      }
    } else {
      b.air += dt;
      b.v[1] -= G * dt;
      b.p[0] += b.v[0] * dt; b.p[1] += b.v[1] * dt; b.p[2] += b.v[2] * dt;
      L = T.locate(b.p[0], b.p[2], b.hint); b.hint = L.i;
      const sy = T.surfaceY(L, L.u);
      if (b.p[1] - R <= sy + 0.02 && b.v[1] <= 0 && this.supported(L)) {
        const depth = sy - (b.p[1] - R);
        if (depth < R * 1.05) {                      // forgiving: catch the lip if the center is still above it
          b.p[1] = sy + R;
          const imp = -b.v[1];
          if (imp > 5) { b.v[1] = imp * 0.26; } else { b.v[1] = 0; b.grounded = true; }
          this.ev.land(b, imp);
        } else { b.lost = true; this.ev.lost(b, 'side'); }
      } else if (b.p[1] < sy - 1.1) { b.lost = true; this.ev.lost(b, 'fall'); }
      this.rails(b, L);
    }
    // rolling without slipping: w = (n x v) / R
    if (b.grounded) { b.w[0] = b.v[2] / R; b.w[1] = 0; b.w[2] = -b.v[0] / R; }

    b.support = this.supported(L);
    b.speed = Math.hypot(b.v[0], b.v[2]);
    for (let j = 0; j < 3; j++) if (!Number.isFinite(b.p[j]) || !Number.isFinite(b.v[j])) { b.v.fill(0); b.p[j] = fin(b.p[j]); b.lost = true; }
  }

  rails(b, L) {
    const T = this.T, m = L.i & T.mask, f = T.rowF[m];
    if (!(f & (RF.RAIL_L | RF.RAIL_R)) || b.p[1] > b.surfY + 1.2) return;
    const hw = L.w / 2 - 0.1, R = CFG.R;
    const n = T.rowN[m]; if (!n) return;
    let side = 0, pen = 0;
    if ((f & RF.RAIL_R) && T.rowBO[m * 3 + n - 1] && L.u + R > hw) { side = 1; pen = L.u + R - hw; }
    if ((f & RF.RAIL_L) && T.rowAO[m * 3] && L.u - R < -hw) { side = -1; pen = -hw - (L.u - R); }
    if (!side || pen > 0.6) return;
    const nx = -L.rx * side, nz = -L.rz * side;        // normal pointing back to the track
    b.p[0] += nx * pen; b.p[2] += nz * pen;
    const vn = b.v[0] * nx + b.v[2] * nz;
    if (vn < 0) {
      b.v[0] -= nx * vn * 1.38; b.v[2] -= nz * vn * 1.38;
      b.v[0] *= 0.97; b.v[2] *= 0.97;
      if (-vn > 0.8) this.ev.hit(b, -vn, [b.p[0] - nx * CFG.R, b.p[1], b.p[2] - nz * CFG.R]);
    }
  }

  props(b, L) {
    const T = this.T, R = CFG.R;
    for (const o of T.objects) {
      if (o.kind !== 'post' && o.kind !== 'slider') continue;
      if (Math.abs(o.s - L.s) > 3) continue;
      let ou = o.u, ovx = 0, ovz = 0;
      if (o.kind === 'slider') {
        const ph = TAU * this.time / o.period + o.phase;
        ou = o.amp * Math.sin(ph);
        const du = o.amp * Math.cos(ph) * TAU / o.period;
        T.pointAt(o.s, 0, 0, this.tmp);
        ovx = -Math.cos(this.tmp[3]) * du; ovz = Math.sin(this.tmp[3]) * du;
      }
      T.pointAt(o.s, ou, 0, this.tmp);
      const dx = b.p[0] - this.tmp[0], dz = b.p[2] - this.tmp[2], d = Math.hypot(dx, dz), min = R + o.rad;
      if (d >= min || d < 1e-5) continue;
      const nx = dx / d, nz = dz / d;
      b.p[0] += nx * (min - d); b.p[2] += nz * (min - d);
      const rvx = b.v[0] - ovx, rvz = b.v[2] - ovz, vn = rvx * nx + rvz * nz;
      if (vn < 0) {
        b.v[0] -= nx * vn * 1.5; b.v[2] -= nz * vn * 1.5;
        if (-vn > 0.6) this.ev.hit(b, -vn, [this.tmp[0] + nx * o.rad, b.p[1], this.tmp[2] + nz * o.rad]);
      }
    }
  }
}

// =====================================================================
// CameraRig — smoothed chase cam with anticipation, roll and FOV kick.
// =====================================================================
class CameraRig {
  constructor() {
    this.pos = [0, 3, -6]; this.look = [0, 0, 0]; this.yaw = 0; this.roll = 0; this.fov = 1.2;
    this.shake = 0; this.kick = 0; this.mode = 'orbit'; this.t = 0; this.prevYaw = 0; this.yawRate = 0;
    this.eye = [0, 0, 0]; this.tgt = [0, 0, 0]; this.tmp = [0, 0, 0, 0];
  }
  params(aspect, speed) {
    const portrait = aspect < 0.9;
    return {
      dist: (portrait ? 5.7 : 5.2) + speed * 0.1,
      height: (portrait ? 3.0 : 2.5) + speed * 0.04,
      fov: ((portrait ? 72 : 56) + speed * 0.75) * Math.PI / 180,
    };
  }
  snap(ball, T, aspect) {

// =====================================================================
// Environment — floating architecture, dust motes, light shafts.
// =====================================================================
class Environment {
  constructor() {
    this.items = []; this.shafts = []; this.dust = null; this.dustN = 0; this.rng = RNG(99);
    this.tmp = [0, 0, 0, 0]; this.model = M4.create(); this.q = [0, 0, 0, 1];
  }
  reset(T, s0, count, dustN) {
    this.items.length = 0; this.shafts.length = 0;

    for (let k = 0; k < 7; k++) this.shafts.push(this.spawnShaft(T, s0 + k * 50));
    this.setDust(dustN);
  }
  setDust(n) {

  }
  spawn(T, s) {
    const r = this.rng, sAt = clamp(s, 0, Math.max(0, T.length - 1));
    T.pointAt(sAt, 0, 0, this.tmp);

    const type = r.pick(['mono', 'mono', 'ring', 'cube', 'mono']);
    const it = {
      s: sAt, type,
      x: this.tmp[0] - Math.cos(th) * lat * side + Math.sin(th) * r.range(-20, 20),
      z: this.tmp[2] + Math.sin(th) * lat * side + Math.cos(th) * r.range(-20, 20),
      y: this.tmp[1] + r.range(-70, 30),
      sx: 1, sy: 1, sz: 1, rot: r.range(0, TAU), spin: r.range(-0.15, 0.15), tilt: r.range(-0.3, 0.3), col: r.chance(0.5) ? 0 : 1,
    };
    if (type === 'mono') { it.sx = r.range(2, 6); it.sz = r.range(2, 6); it.sy = r.range(25, 90); it.spin *= 0.2; it.tilt *= 0.3; }
    else if (type === 'ring') { const R = r.range(6, 22); it.sx = it.sy = it.sz = R; it.spin *= 2; }
    else { const c = r.range(2, 7); it.sx = it.sy = it.sz = c; it.spin *= 3; it.y += 20; }
    return it;
  }
  spawnShaft(T, s) {
    const r = this.rng, sAt = clamp(s, 0, Math.max(0, T.length - 1));
    T.pointAt(sAt, 0, 0, this.tmp);
    const th = this.tmp[3], lat = r.range(15, 70) * r.sign();
    return { s: sAt, x: this.tmp[0] - Math.cos(th) * lat, z: this.tmp[2] + Math.sin(th) * lat, y: this.tmp[1] - 60, w: r.range(5, 16), h: r.range(140, 200), a: r.range(0.04, 0.1) };
  }
  update(T, ballS) {
    for (let k = 0; k < this.items.length; k++) if (this.items[k].s < ballS - 60) this.items[k] = this.spawn(T, ballS + this.rng.range(160, 300));
    for (let k = 0; k < this.shafts.length; k++) if (this.shafts[k].s < ballS - 30) this.shafts[k] = this.spawnShaft(T, ballS + this.rng.range(150, 320));
  }
  draw(R, time) {
    const T = R.theme;
    for (const it of this.items) {
      const a = it.rot + time * it.spin;

        const q = this.q, c1 = Math.cos(a * 0.5), s1 = Math.sin(a * 0.5), c2 = Math.cos((1.2 + it.tilt) * 0.5), s2 = Math.sin((1.2 + it.tilt) * 0.5);

      } else Q.yaw(this.q, a);
      M4.fromTRS(this.model, it.x, it.y, it.z, this.q, it.sx, it.sy, it.sz);
      R.drawProp(it.type === 'ring' ? R.meshes.ring : R.meshes.mono, this.model, it.col ? T.accent2 : T.accent, 0.7);

  writeDust(out, off, cam, time, col) {
    let o = off * 8; const B = 26;

      const px = cam[0] + (((d[j] * B + time * 0.3 - cam[0]) % B) + B) % B - B / 2;
      const py = cam[1] + (((d[j + 1] * B + Math.sin(time * 0.2 + k) * 0.5 - cam[1]) % B) + B) % B - B / 2;
      const pz = cam[2] + (((d[j + 2] * B - cam[2]) % B) + B) % B - B / 2;
      out[o++] = px; out[o++] = py; out[o++] = pz;
      out[o++] = col[0]; out[o++] = col[1]; out[o++] = col[2]; out[o++] = 0.25 + d[j + 3] * 0.35;
      out[o++] = 0.04 + d[j + 3] * 0.05;

  }
}

// =====================================================================
// FxBuilder — per-frame additive geometry (trail ribbon, halos, shafts).
// =====================================================================

    this.v(p[0], p[1], p[2], uvs[0], uvs[1], sh, col[0], col[1], col[2], a);
    this.v(q[0], q[1], q[2], uvs[2], uvs[3], sh, col[0], col[1], col[2], a);
    this.v(s[0], s[1], s[2], uvs[4], uvs[5], sh, col[0], col[1], col[2], a);
    this.v(p[0], p[1], p[2], uvs[0], uvs[1], sh, col[0], col[1], col[2], a);
    this.v(s[0], s[1], s[2], uvs[4], uvs[5], sh, col[0], col[1], col[2], a);

  }
  glow(x, y, z, size, col, a) {

  resetTrail(p) { for (const t of this.trail) { t[0] = p[0]; t[1] = p[1]; t[2] = p[2]; } this.tn = 0; }
