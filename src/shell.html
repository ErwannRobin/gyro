<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GYROLL</title>
<meta name="description" content="GYROLL — an endless 3D marble run you steer by tilting your phone. How far can you go?">
<link rel="canonical" href="https://gyroll.vercel.app/">
<meta property="og:type" content="website">
<meta property="og:title" content="GYROLL — How far can you go?">
<meta property="og:description" content="Tilt your phone to roll a marble along an endless floating track. Daily run, 9 worlds, share your best run.">
<meta property="og:url" content="https://gyroll.vercel.app/">
<meta property="og:image" content="https://gyroll.vercel.app/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="GYROLL — a marble rolling on a neon track floating in the void">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://gyroll.vercel.app/og.jpg">
<meta name="apple-mobile-web-app-title" content="GYROLL">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --accent:#4ef2ff;
  --accent2:#ff5ad2;
  --gold:#ffd36b;
  --ink:#ffffff;
  --dim:rgba(235,242,255,.62);
  --glass:rgba(10,14,30,.55);
  --glass-brd:rgba(255,255,255,.14);
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#05060d;color:var(--ink);font-family:var(--font);
  touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-text-size-adjust:100%;position:fixed;inset:0}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.hidden{display:none!important}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity .4s}
#hud::before{content:"";position:absolute;z-index:-1;left:0;right:0;top:0;height:calc(var(--sat) + 120px);background:linear-gradient(180deg,rgba(3,4,12,.55),rgba(3,4,12,0))}
#hud::after{content:"";position:absolute;z-index:-1;left:0;right:0;bottom:0;height:calc(var(--sab) + 70px);background:linear-gradient(0deg,rgba(3,4,12,.4),rgba(3,4,12,0))}
#hud.on{opacity:1}
#stats{position:absolute;top:calc(var(--sat) + 10px);left:calc(var(--sal) + 14px);right:calc(var(--sar) + 14px);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px}
#stats > div:last-child{min-width:100px}
.stat{display:flex;flex-direction:column;text-shadow:0 0 2px rgba(0,0,0,.9),0 2px 6px rgba(0,0,0,.85)}
.stat .lbl{font-size:11px;font-weight:800;letter-spacing:.22em;color:var(--dim)}
.stat .val{font-size:22px;font-weight:800;letter-spacing:.02em;line-height:1.1}
#stats .col{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
#stBest .val{font-size:16px;color:var(--gold)}
#stBest .lbl{font-size:10px}
#stScore{align-items:center}
#stScore .val{font-size:40px;font-weight:900;letter-spacing:.01em;text-shadow:none;
  background:linear-gradient(180deg,#fff 30%,#bfefff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.8))}
#mult{margin-top:2px;font-size:13px;font-weight:900;letter-spacing:.12em;color:var(--gold);opacity:0;transition:opacity .25s,transform .25s;transform:scale(.8)}
#mult.on{opacity:1;transform:scale(1)}
#topBtns{position:absolute;top:calc(var(--sat) + 8px);right:calc(var(--sar) + 10px);display:flex;gap:8px;pointer-events:auto}
.icoBtn{width:44px;height:44px;border-radius:14px;background:var(--glass);border:1px solid var(--glass-brd);
  display:flex;align-items:center;justify-content:center;font-size:20px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 4px 18px rgba(0,0,0,.35)}
.icoBtn:active{transform:scale(.92)}
#speedo{position:absolute;left:calc(var(--sal) + 16px);bottom:calc(var(--sab) + 16px);display:flex;align-items:flex-end;gap:10px;
  text-shadow:0 2px 6px rgba(0,0,0,.8)}
#speedo .v{font-size:26px;font-weight:900;line-height:1}
#speedo .u{font-size:11px;font-weight:800;letter-spacing:.18em;color:var(--dim);margin-bottom:3px}
#speedBar{position:absolute;left:0;bottom:-7px;height:3px;width:86px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}
#speedBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px}
#power{position:absolute;left:50%;bottom:calc(var(--sab) + 44px);transform:translateX(-50%);width:min(56vw,250px);padding:8px 10px;
  text-shadow:0 2px 6px rgba(0,0,0,.85);pointer-events:none;-webkit-tap-highlight-color:transparent}
#power .row{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;font-size:11px;font-weight:900;letter-spacing:.12em;margin-bottom:5px;white-space:nowrap}
#pwCoin{color:var(--gold);transition:transform .2s}
#pwCoin::before{content:"";display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff7d6,var(--gold) 55%,#b8801e);box-shadow:0 0 6px rgba(255,211,107,.7)}
#pwCoin.up{transform:scale(1.35)}
#pwTxt{color:var(--dim);overflow:hidden;text-overflow:ellipsis}
#power .bar{height:8px;border-radius:5px;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);overflow:hidden}
#pwFill{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#ffe9a8,var(--gold),#ff9d5c);transition:width .15s linear}
#power.ready{pointer-events:auto;cursor:pointer}
#power.ready .bar{animation:pwPulse .6s ease-in-out infinite alternate}
#power.ready #pwTxt,#power.on #pwTxt{color:#fff3c4}
#power.on #pwFill{background:linear-gradient(90deg,#fff,#fff3c4,var(--gold));box-shadow:0 0 12px var(--gold)}
/* landscape: the gauge sits in the bottom right corner, its bar on the same line as the speed bar */
@media (orientation:landscape){ #power{left:auto;right:calc(var(--sar) + 6px);bottom:calc(var(--sab) + 1px);transform:none;width:min(34vw,250px)} }
@keyframes pwPulse{from{box-shadow:0 0 0 1px rgba(255,211,107,.5),0 0 6px rgba(255,211,107,.4)}to{box-shadow:0 0 0 2px rgba(255,230,160,1),0 0 22px rgba(255,211,107,.95)}}
#starGlow{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity .5s;
  background:radial-gradient(ellipse 90% 80% at 50% 50%,rgba(255,210,110,0) 50%,rgba(255,196,80,.32) 100%)}
body.star #starGlow{opacity:1}
#toasts{position:absolute;left:0;right:0;top:32%;display:flex;flex-direction:column;align-items:center;gap:6px}
.toast{font-weight:900;letter-spacing:.14em;font-size:20px;text-shadow:0 0 2px #000,0 0 3px rgba(0,0,0,.9),0 3px 12px rgba(0,0,0,.8);animation:toast 1.4s ease-out forwards;
  max-width:calc(100vw - 20px);text-align:center}
.toast.big{font-size:min(28px,5.6vw)}   /* "CHECKPOINT · 1 040 m" fits a 360 px wide phone */
.toast.gold{color:var(--gold)}
.toast.cyan{color:var(--accent)}
.toast.pink{color:var(--accent2)}
@keyframes toast{0%{opacity:0;transform:translateY(14px) scale(.7)}12%{opacity:1;transform:translateY(0) scale(1.08)}22%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-26px) scale(.96)}}
/* collapse warning: the falling edge of the track is catching up with the ball */
#fallWarn{position:absolute;left:50%;bottom:calc(var(--sab) + 100px);width:min(80vw,300px);display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;
  opacity:0;transform:translateX(-50%) scale(.85);transition:opacity .25s,transform .4s cubic-bezier(.3,1.5,.4,1)}
#fallWarn.on{opacity:1;transform:translateX(-50%)}
#fallWarn b{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:900;letter-spacing:.14em;color:#ff6a86;text-shadow:0 0 2px #000,0 2px 10px rgba(0,0,0,.85)}
#fallWarn.on b{animation:fwPulse .45s ease-in-out infinite alternate}
#fallWarn b .ic{width:20px;height:20px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.8))}
#fallWarn small{font-size:11px;font-weight:800;letter-spacing:.08em;color:#ffdbe2;text-shadow:0 0 2px #000,0 1px 5px rgba(0,0,0,.9)}
#fallWarn .bar{width:100%;height:5px;border-radius:3px;background:rgba(255,255,255,.16);box-shadow:0 1px 4px rgba(0,0,0,.4);overflow:hidden}
#fallWarn .bar i{display:block;height:100%;width:100%;border-radius:3px;background:linear-gradient(90deg,#ff2a55,#ff9d5c);transition:width .15s linear}
@keyframes fwPulse{from{transform:scale(1)}to{transform:scale(1.07)}}
@media (orientation:landscape){ #fallWarn{bottom:calc(var(--sab) + 12px);width:min(30vw,280px)} #fallWarn b{font-size:16px} }
#vignette{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse 85% 75% at 50% 48%,rgba(0,0,0,0) 55%,rgba(2,3,10,.5) 100%)}
#danger{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;
  background:radial-gradient(120% 60% at 50% 115%,rgba(255,40,70,.55),rgba(255,40,70,0) 60%)}
#flash{position:fixed;inset:0;pointer-events:none;z-index:6;background:#fff;opacity:0}
#joy{position:fixed;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;pointer-events:none;z-index:6;opacity:0;transition:opacity .15s;
  border:2px solid rgba(255,255,255,.28);background:radial-gradient(circle,rgba(78,242,255,.08),rgba(78,242,255,0) 70%)}
#joy.on{opacity:1}
#joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9),rgba(160,230,255,.45) 45%,rgba(78,242,255,.15) 75%);box-shadow:0 0 18px rgba(78,242,255,.45)}
#touchHint{position:fixed;left:0;right:0;bottom:calc(var(--sab) + 104px);text-align:center;z-index:6;pointer-events:none;
  font-size:14px;font-weight:700;letter-spacing:.06em;color:var(--dim);text-shadow:0 2px 6px #000;transition:opacity .6s}

/* ---------- Screens ---------- */
.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:calc(var(--sat) + 24px) calc(var(--sar) + 22px) calc(var(--sab) + 24px) calc(var(--sal) + 22px);
  background:radial-gradient(140% 90% at 50% 40%,rgba(5,6,13,0) 0%,rgba(5,6,13,.55) 70%,rgba(5,6,13,.85) 100%);
  transition:opacity .45s;overflow:hidden}
.screen.fade{opacity:0;pointer-events:none}
/* menu: a light screen over the live world (title, mode switch, PLAY in the middle of the screen,
   the options toggle at the bottom). The toggle raises a glass sheet with the settings, shrinks the
   title into the top bar and hides PLAY. Offsets (--playY, --tY, --hY, --sheetTop) come from the game. */
#menu{display:block;padding:0;background:none}
#menu::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .5s;
  background:radial-gradient(140% 90% at 50% 40%,rgba(5,6,13,.15) 0%,rgba(5,6,13,.6) 70%,rgba(5,6,13,.85) 100%)}
#menu.opts::before{opacity:1}
#mLeft{position:absolute;left:calc(var(--sal) + 22px);right:calc(var(--sar) + 22px);top:calc(var(--sat) + clamp(34px,7vh,76px))}
#mRight{position:absolute;left:calc(var(--sal) + 22px);right:calc(var(--sar) + 22px);top:var(--playY,50%)}
#title,#tagline,#modeSeg,#modeInfo,#mRight,#menuTop,#optLinks{transition:transform .6s cubic-bezier(.3,1.2,.4,1),opacity .35s,visibility .35s}
#menu.opts #title{transform:translateY(var(--tY,0px)) scale(.42)}
#menu.opts #tagline{opacity:0;visibility:hidden;transform:translateY(calc(var(--tY,0px) * .6)) scale(.7)}
/* options mode: the mode switch gives its place to the About button */
#modeBox{position:relative;width:100%;margin-top:20px;display:flex;flex-direction:column;align-items:center}
#menu.opts #modeSeg,#menu.opts #modeInfo{opacity:0;visibility:hidden;transform:translateY(var(--hY,0px)) scale(.86)}
/* options mode: ABOUT, and INSTALL below it, take the place of the mode switch */
#optLinks{position:absolute;top:4px;left:50%;display:flex;flex-direction:column;align-items:stretch;gap:10px;opacity:0;visibility:hidden;pointer-events:none;transform:translate(-50%,var(--hY,0px)) scale(.8)}
#menu.opts #optLinks{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,var(--hY,0px));transition-delay:.08s}
#optLinks .tg{min-width:168px;justify-content:center;font-size:12px;white-space:nowrap}
/* INSTALL glows softly to be found */
#btnInstall{border-color:rgba(78,242,255,.55);background:linear-gradient(135deg,rgba(78,242,255,.2),rgba(255,79,216,.14));animation:insGlow 2.4s ease-in-out infinite alternate}
@keyframes insGlow{from{box-shadow:0 0 0 0 rgba(78,242,255,0),0 6px 18px rgba(0,0,0,.3)}to{box-shadow:0 0 0 1px rgba(78,242,255,.45),0 0 22px rgba(78,242,255,.35)}}
#menu.opts #mRight{opacity:0;visibility:hidden;pointer-events:none;transform:scale(.9)}
#menuTop{opacity:0;visibility:hidden;transform:translateY(-12px)}
#menu.opts #menuTop{opacity:1;visibility:visible;transform:none}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:2;max-height:calc(100% - var(--sheetTop,180px));overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;
  padding:18px calc(var(--sar) + 18px) calc(var(--sab) + 84px) calc(var(--sal) + 18px);border-radius:30px 30px 0 0;
  background:rgba(9,12,26,.7);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);
  border-top:1px solid rgba(255,255,255,.14);box-shadow:0 -24px 60px rgba(0,0,0,.4);
  transform:translateY(106%);visibility:hidden;transition:transform .55s cubic-bezier(.32,.72,0,1),visibility .55s}
#menu.opts #sheet{transform:none;visibility:visible}
#sheet.drag{transition:none}
/* the grip: drag it down (or right, for the side panel) to close the settings */
#sheetGrip{position:absolute;z-index:1;left:0;right:0;top:0;height:32px;touch-action:none;cursor:grab}
#sheetGrip::before{content:"";position:absolute;top:8px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:rgba(255,255,255,.3);transition:background .2s,width .25s,margin .25s,height .25s}
#sheetGrip:hover::before,#sheet.drag #sheetGrip::before{background:rgba(255,255,255,.6);width:48px;margin-left:-24px}
#sheet.drag #sheetGrip{cursor:grabbing}
/* wide screens: the settings sheet is a centered card, not a full-width band */
@media (min-width:640px){ #sheet{left:0;right:0;margin:0 auto;width:min(560px,calc(100% - 32px));border:1px solid rgba(255,255,255,.14);border-bottom:0} }
.sheetIn{max-width:420px;margin:0 auto;display:flex;flex-direction:column;align-items:center}
.optRow{width:100%;display:flex;flex-direction:column;align-items:center;gap:7px;margin-top:14px;opacity:0;transform:translateY(22px);
  transition:opacity .3s,transform .55s cubic-bezier(.3,1.25,.4,1)}
#menu.opts .optRow{opacity:1;transform:none;transition-delay:calc(var(--i) * 45ms + 90ms)}
.optLbl{font-size:10px;font-weight:800;letter-spacing:.24em;color:rgba(235,242,255,.6)}
.optRow .seg{max-width:100%}
#btnOpts{position:absolute;left:50%;bottom:calc(var(--sab) + 18px);z-index:3;height:48px;min-width:136px;padding:0 22px 0 16px;border-radius:24px;transform:translateX(-50%);
  display:flex;align-items:center;justify-content:center;gap:9px;font-size:13px;font-weight:900;letter-spacing:.14em;white-space:nowrap;
  background:var(--glass);border:1px solid var(--glass-brd);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 24px rgba(0,0,0,.35);
  transition:background .3s,color .3s,transform .3s cubic-bezier(.3,1.3,.4,1)}
#btnOpts:active{transform:translateX(-50%) scale(.94)}
#btnOpts .ic circle{transition:transform .5s cubic-bezier(.3,1.4,.4,1)}
#btnOpts .lb2,#menu.opts #btnOpts .lb1{display:none}
#menu.opts #btnOpts .lb2{display:inline}
#menu.opts #btnOpts{background:#fff;color:#0a0e1c;border-color:#fff}
#menu.opts #btnOpts .k1{transform:translateX(-7px)}
#menu.opts #btnOpts .k2{transform:translateX(7px)}
/* first appearance: every part rises into place, one after the other */
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.94);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes riseBtn{from{opacity:0;transform:translateX(-50%) translateY(26px)}to{opacity:1;transform:translateX(-50%)}}
#menu.intro #title{animation:rise 1s cubic-bezier(.2,.9,.3,1) backwards}
#menu.intro #tagline{animation:rise .9s .14s cubic-bezier(.2,.9,.3,1) backwards}
#menu.intro #modeSeg{animation:rise .9s .24s cubic-bezier(.2,.9,.3,1) backwards}
#menu.intro #modeInfo{animation:rise .9s .3s cubic-bezier(.2,.9,.3,1) backwards}
#menu.intro #mRight{animation:rise .9s .4s cubic-bezier(.2,.9,.3,1) backwards}
#menu.intro #btnOpts{animation:riseBtn .9s .52s cubic-bezier(.2,.9,.3,1) backwards}
#xfade{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;opacity:0}
#title{font-size:clamp(62px,19vw,150px);font-weight:900;letter-spacing:.04em;line-height:.9;margin-right:-.06em;
  background:linear-gradient(100deg,#fff 0%,#d9fbff 30%,var(--accent) 45%,#fff 52%,var(--accent2) 70%,#fff 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s ease-in-out infinite;
  filter:drop-shadow(0 6px 30px rgba(78,242,255,.35)) drop-shadow(0 4px 16px rgba(0,12,34,.3)) drop-shadow(0 2px 2px rgba(0,0,0,.6))}
@keyframes shine{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
#tagline{margin-top:10px;font-size:clamp(17px,4.6vw,22px);font-style:italic;font-weight:500;letter-spacing:.04em;color:rgba(235,245,255,.9);text-shadow:0 0 3px rgba(0,0,0,.7),0 2px 8px #000}
.bigBtn{margin-top:30px;height:64px;padding:0 20px;border-radius:20px;font-size:16px;font-weight:900;letter-spacing:.08em;line-height:1.2;
  max-width:420px;width:100%;color:#051018;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#8ff8ff 0%,var(--accent) 45%,#35b7ff 100%);
  box-shadow:0 10px 40px rgba(78,242,255,.35),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -3px 0 rgba(0,40,80,.25);
  position:relative;overflow:hidden}
.bigBtn::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);
  animation:sweep 3.2s ease-in-out infinite}
@keyframes sweep{0%,55%{left:-60%}100%{left:130%}}
.bigBtn:active{transform:scale(.97)}
.ghostBtn{margin-top:12px;min-height:50px;padding:12px 22px;border-radius:16px;font-size:14px;font-weight:800;letter-spacing:.1em;
  background:var(--glass);border:1px solid var(--glass-brd);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-width:420px;width:100%}
.ghostBtn:active{transform:scale(.97)}
.hint{margin-top:14px;font-size:14px;font-weight:600;color:var(--dim);letter-spacing:.02em;text-shadow:0 2px 6px #000;max-width:420px}
.hint b{color:#fff}
#menuBest{margin-top:16px;font-size:12px;font-weight:800;letter-spacing:.26em;color:rgba(235,242,255,.8);text-shadow:0 0 3px rgba(0,0,0,.8),0 1px 6px rgba(0,0,0,.7)}
#menuBest span{color:var(--gold);font-size:15px;letter-spacing:.06em}
.skinRow{display:flex;align-items:center;gap:10px;width:100%;justify-content:center}
.skinRow .lbl{font-size:11px;font-weight:800;letter-spacing:.2em;color:rgba(235,242,255,.8);width:54px;text-align:right;text-shadow:0 0 3px rgba(0,0,0,.8),0 1px 6px rgba(0,0,0,.7)}
.sw{width:44px;height:44px;border-radius:13px;border:2px solid rgba(255,255,255,.18);position:relative;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.sw.round{border-radius:50%}
.sw.sel{border-color:#fff;box-shadow:0 0 0 3px rgba(78,242,255,.5),0 4px 14px rgba(0,0,0,.4)}
#menuTop{position:absolute;top:calc(var(--sat) + 10px);left:calc(var(--sal) + 12px);right:calc(var(--sar) + 12px);display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:3}
/* segmented controls: a glass pill (placed by the game) slides under the chosen option */
.seg{position:relative;display:inline-flex;padding:4px;border-radius:15px;background:var(--glass);border:1px solid var(--glass-brd);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);gap:4px}
.seg .pill{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:11px;pointer-events:none;background:rgba(255,255,255,.17);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),0 2px 10px rgba(0,0,0,.25);transition:transform .5s cubic-bezier(.3,1.3,.4,1),width .5s cubic-bezier(.3,1.3,.4,1)}
.seg button{position:relative;min-height:38px;padding:6px 12px;border-radius:11px;font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--dim);transition:color .3s}
.seg button.on{color:#fff}
.seg button:active{transform:scale(.95)}
#ctrlSeg button{min-width:128px}
#todSeg{gap:2px;width:300px}
#todSeg button{flex:1 1 auto;padding:6px 8px;font-size:11px;letter-spacing:.08em;white-space:nowrap}
#modeSeg button{width:142px;min-height:44px;padding:6px 4px;font-size:13px;white-space:nowrap}
#tgKid{width:290px;max-width:100%;justify-content:center;white-space:nowrap}
.linkBtn{background:none;border:0;padding:2px 6px;font:inherit;font-weight:900;letter-spacing:.08em;line-height:16px;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
/* reset track: a dark halo around the letters keeps the link readable over bright or purple skies */
#btnNewTrack{margin-top:3px;text-shadow:0 0 2px rgba(2,3,10,.95),0 1px 3px rgba(2,3,10,.9),0 0 10px rgba(2,3,10,.75),0 0 18px rgba(2,3,10,.5)}
#tgKid:not(.off){color:#051018;background:linear-gradient(135deg,#ffe9a8,var(--gold));border-color:transparent}
#ovRails{margin-top:10px;padding:6px 14px;border-radius:12px;font-size:13px;font-weight:800;letter-spacing:.06em;color:#051018;background:linear-gradient(135deg,#ffe9a8,var(--gold))}
#modeInfo{margin-top:6px;height:40px;width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:12px;line-height:16px;font-weight:700;color:rgba(235,242,255,.85);letter-spacing:.04em;text-shadow:0 0 3px rgba(0,0,0,.85),0 1px 6px rgba(0,0,0,.8)}
.tgRow{display:flex;gap:8px}
.tg{min-height:44px;padding:0 13px;border-radius:14px;background:var(--glass);border:1px solid var(--glass-brd);display:inline-flex;align-items:center;gap:7px;
  font-size:11px;font-weight:900;letter-spacing:.12em;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:color .2s,opacity .2s}
.tg.icon{width:44px;padding:0;justify-content:center;color:#fff}
.ic{width:22px;height:22px;flex:none;fill:currentColor;overflow:visible}
.ic .stk{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic .cut{fill:none;stroke:#0c1122;stroke-width:5.5;stroke-linecap:round}
.ic .mute,.ic .cut,.ic .slash{display:none}
.tg.off{color:rgba(255,255,255,.42)}
.tg.icon.off{color:rgba(255,255,255,.55)}
.tg.off .ic .wave{display:none}
.tg.off .ic .mute,.tg.off .ic .cut,.tg.off .ic .slash{display:inline}
.tg:active{transform:scale(.95)}
.skins{margin-top:20px;display:flex;flex-direction:column;gap:10px;align-items:center;width:100%;max-width:420px}
.skinName{font-size:12px;font-weight:700;letter-spacing:.14em;color:rgba(255,255,255,.85);height:16px;line-height:16px;white-space:nowrap;text-shadow:0 0 3px rgba(0,0,0,.8),0 1px 6px rgba(0,0,0,.7)}
.ghostBtn.small{min-height:42px;margin-top:14px;padding:8px 18px;width:auto;font-size:12px}
.shareBtn{position:relative;overflow:hidden}
.shareBtn .prog{position:absolute;left:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .2s}
.shareBtn.busy{opacity:.75}
#ovMode{margin-top:6px;font-size:12px;font-weight:800;letter-spacing:.2em;color:var(--accent)}
#sheet .skins{margin-top:0}
#permMsg{margin-left:auto;margin-right:auto}
#permMsg{margin-top:14px;font-size:13px;font-weight:700;color:#ffb3c7;max-width:380px;text-shadow:0 2px 6px #000}
#permMsg.ok{color:var(--accent)}

#calib{background:rgba(5,6,13,.25)}
#calibRing{width:120px;height:120px;border-radius:50%;border:3px solid rgba(255,255,255,.15);position:relative}
#calibRing::before{content:"";position:absolute;inset:-3px;border-radius:50%;border:3px solid transparent;border-top-color:var(--accent);border-right-color:var(--accent);
  animation:spin .8s linear infinite}
#calibRing b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900}
@keyframes spin{to{transform:rotate(360deg)}}
#calibTxt{margin-top:22px;font-size:16px;font-weight:800;letter-spacing:.12em;text-shadow:0 2px 8px #000}
#calibSub{margin-top:8px;font-size:14px;color:var(--dim);text-shadow:0 2px 8px #000}
#go{position:fixed;left:0;right:0;top:40%;text-align:center;font-size:72px;font-weight:900;letter-spacing:.08em;z-index:21;pointer-events:none;opacity:0;
  color:#fff;text-shadow:0 0 30px rgba(78,242,255,.9),0 4px 10px rgba(0,0,0,.7)}
#go.on{animation:go .9s ease-out forwards}
@keyframes go{0%{opacity:0;transform:scale(2.2)}20%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0;transform:scale(.9)}}

#pause h2,#over h2{font-size:clamp(40px,12vw,64px);font-weight:900;letter-spacing:.1em;margin-right:-.1em;text-shadow:0 4px 20px rgba(0,0,0,.8)}
#pause{background:rgba(5,6,13,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.volRow{margin-top:14px;display:flex;align-items:center;gap:12px;width:100%;max-width:360px}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:rgba(255,255,255,.18);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(78,242,255,.35)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:0}

#over{background:radial-gradient(120% 80% at 50% 45%,rgba(20,5,20,.35),rgba(5,6,13,.85))}
#ovRes,#ovBtns{display:flex;flex-direction:column;align-items:center;width:100%;flex:none}
#ovRes > *,#ovBtns > *,#pause > *{flex-shrink:0}          /* a tight screen never squeezes a button away */
#over h2{background:linear-gradient(180deg,#fff,#ffc2e4);-webkit-background-clip:text;background-clip:text;color:transparent}
#ovDist{margin-top:14px;font-size:clamp(56px,17vw,96px);font-weight:900;line-height:1;text-shadow:0 6px 30px rgba(78,242,255,.35)}
#ovDist small{font-size:.42em;font-weight:800;color:var(--dim);margin-left:4px}
#ovScore{margin-top:14px;font-size:18px;font-weight:800;letter-spacing:.16em}
#ovBest{margin-top:6px;font-size:14px;font-weight:800;letter-spacing:.16em;color:var(--dim)}
#ovBest b{color:var(--gold)}
#record{position:relative;margin-top:18px;height:44px;display:flex;align-items:center;justify-content:center}
#record .txt{font-size:26px;font-weight:900;letter-spacing:.14em;
  background:linear-gradient(100deg,#fff3c4,var(--gold) 30%,#fff 50%,#ff9d5c 70%,#fff3c4);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:recIn .9s cubic-bezier(.2,1.6,.4,1) both,shine 1.6s linear infinite;
  filter:drop-shadow(0 0 18px rgba(255,200,90,.6))}
#record .rays{position:absolute;left:50%;top:50%;width:360px;height:360px;margin:-180px 0 0 -180px;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(255,211,107,.22) 0deg 6deg,rgba(255,211,107,0) 6deg 20deg);
  -webkit-mask:radial-gradient(circle,#000 10%,transparent 62%);mask:radial-gradient(circle,#000 10%,transparent 62%);
  animation:rays 2.4s ease-out forwards}
@keyframes recIn{0%{transform:scale(3);opacity:0}60%{opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes rays{0%{opacity:0;transform:scale(.3) rotate(0)}20%{opacity:1}100%{opacity:0;transform:scale(1.3) rotate(60deg)}}
.row2{display:flex;gap:10px;width:100%;max-width:420px}
.row2 .ghostBtn{flex:1}
/* SHARE popup: the preview on top (on the left in landscape), then the choice between a screenshot
   and a video, their settings, and DOWNLOAD / SHARE at the bottom (off until there is a file) */
#btnShare{display:flex;align-items:center;justify-content:center;gap:9px}
#btnShare .ic{width:20px;height:20px}
#shareBox{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(3,4,12,.55);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transition:opacity .3s}
#shareBox.open{opacity:1}
#shPanel{position:relative;width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;gap:12px;
  padding:calc(var(--sat) + 12px) calc(var(--sar) + 16px) calc(var(--sab) + 16px) calc(var(--sal) + 16px);
  background:rgba(9,12,26,.94);box-shadow:0 -20px 60px rgba(0,0,0,.5);transform:translateY(40px);transition:transform .45s cubic-bezier(.3,1.2,.4,1)}
#shareBox.open #shPanel{transform:none}
#shHead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none}
#shHead h3{font-size:14px;font-weight:900;letter-spacing:.22em}
#shView{position:relative;flex:1 1 auto;min-height:120px;display:flex;align-items:center;justify-content:center}
#shCanvas,#shVideo{display:block;border-radius:16px;background:#05060d;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 12px 40px rgba(0,0,0,.5)}
#shSide{display:flex;flex-direction:column;gap:12px;flex:none;min-height:0}
#shKinds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shTile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:12px 10px;border-radius:18px;text-align:center;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);transition:background .25s,border-color .25s}
.shTile span{display:flex;flex-direction:column;gap:4px}
.shTile .ic{width:28px;height:28px;color:var(--accent)}
.shTile b{font-size:13px;font-weight:900;letter-spacing:.12em}
.shTile small{font-size:11.5px;font-weight:600;line-height:1.35;color:var(--dim)}
.shTile.on{background:rgba(78,242,255,.14);border-color:var(--accent)}
.shTile:disabled{opacity:.45;cursor:default}
.shTile:not(:disabled):active{transform:scale(.97)}
#shareBox:not([data-kind=""]) .shTile{flex-direction:row;gap:8px;padding:6px 10px}
#shareBox:not([data-kind=""]) .shTile small{display:none}
#shareBox:not([data-kind=""]) .shTile .ic{width:20px;height:20px}
#shCtrls{display:flex;flex-direction:column;gap:10px}
#shareBox[data-kind=""] #shCtrls{display:none}
#shareBox[data-kind="image"] .vOnly,#shareBox[data-kind="video"] .iOnly{display:none!important}
.shRow{display:grid;grid-template-columns:76px minmax(0,1fr);align-items:center;column-gap:10px}
.shRow .optLbl{text-align:left}
.shRow .seg{width:100%}
.shRow .seg button{flex:1 1 0;min-width:0;padding:6px 4px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.shp{display:inline-block;border:2px solid currentColor;border-radius:3px;flex:none}
[data-fmt="story"] .shp{width:10px;height:16px}
[data-fmt="square"] .shp{width:14px;height:14px}
[data-fmt="wide"] .shp{width:18px;height:11px}
#shPicker{grid-template-columns:44px minmax(0,1fr) 64px}
#shPicker input{width:100%}
#shFrameLbl{font-size:12px;font-weight:800;letter-spacing:.06em;text-align:right;color:var(--dim)}
#btnShPlay .pa,#btnShPlay.on .pl{display:none}
#btnShPlay.on .pa{display:inline}
#shInfo{font-size:12px;font-weight:700;line-height:1.4;color:var(--dim);text-align:center}
#btnShMake{margin:0;max-width:none}
#shFoot{display:flex;gap:10px}
#shFoot > button{flex:1 1 0;margin:0;height:54px;min-height:0;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;transition:opacity .3s,filter .3s}
#shFoot .ic{width:20px;height:20px}
#shFoot > button:disabled{opacity:.35;filter:saturate(.2);cursor:default;box-shadow:none}
#shFoot > button:disabled::after{display:none}
/* phones in portrait: a sheet from the bottom with rounded top corners */
@media (orientation:portrait){ #shPanel{height:calc(100% - var(--sat) - 10px);border-radius:26px 26px 0 0;border:1px solid rgba(255,255,255,.12);border-bottom:0;padding-top:12px} }
/* landscape: the preview on the left, the choices on the right */
@media (orientation:landscape){
  #shPanel{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);grid-template-rows:auto minmax(0,1fr) auto;column-gap:22px;row-gap:12px}
  #shHead{grid-column:2;grid-row:1}
  #shView{grid-column:1;grid-row:1 / span 3;min-height:0}
  #shSide{grid-column:2;grid-row:2;overflow-y:auto;overscroll-behavior:contain;justify-content:flex-start}
  #shFoot{grid-column:2;grid-row:3}
}
/* big screens: a floating card */
@media (orientation:landscape) and (min-height:641px){
  #shareBox{align-items:center}
  #shPanel{width:min(1000px,calc(100% - 48px));height:min(700px,calc(100% - 48px));padding:20px 22px 22px;border-radius:26px;border:1px solid rgba(255,255,255,.12)}
}
@media (orientation:landscape) and (max-height:430px){
  #shPanel{row-gap:8px;padding-top:calc(var(--sat) + 10px);padding-bottom:calc(var(--sab) + 12px)}
  #shHead .icoBtn{width:36px;height:36px;border-radius:12px}
  .shTile{min-height:40px} #shSide,#shCtrls{gap:8px}
  #shFoot > button{height:46px}
  .shRow .seg{padding:3px} .shRow .seg .pill{top:3px;bottom:3px} .shRow .seg button{min-height:32px}
  #shInfo{font-size:11px}
  #btnShMake{min-height:42px;padding:8px 18px}
}
/* About: a circle opens from the About button; the marble draws its track while the numbers count up
   and the story rises line after line. */
#about,#install{position:fixed;inset:0;z-index:30;background:rgba(5,7,16,.8);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  clip-path:circle(0 at var(--ox,50%) var(--oy,50%));-webkit-clip-path:circle(0 at var(--ox,50%) var(--oy,50%));transition:clip-path .7s cubic-bezier(.65,0,.25,1),-webkit-clip-path .7s cubic-bezier(.65,0,.25,1)}
#about.open,#install.open{clip-path:circle(150vmax at var(--ox,50%) var(--oy,50%));-webkit-clip-path:circle(150vmax at var(--ox,50%) var(--oy,50%))}
#abScroll,#insScroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;text-align:center;
  padding:calc(var(--sat) + 56px) calc(var(--sar) + 24px) calc(var(--sab) + 40px) calc(var(--sal) + 24px)}
#abScroll > *,#insScroll > *{max-width:440px;margin-left:auto;margin-right:auto}
#abScroll > .abSec{max-width:1060px}
#abScroll > #abLead{max-width:600px}
.abIn{opacity:0;transform:translateY(24px);filter:blur(6px)}
#about.open .abIn,#install.open .abIn{animation:rise .9s calc(.28s + var(--d) * .1s) cubic-bezier(.2,.9,.3,1) both}
#abTrack{display:block;width:min(300px,78vw);height:auto;margin:0 auto;overflow:visible}
#abPath,#abGlow{fill:none;stroke-linecap:round}
#abPath{stroke:url(#abGrad);stroke-width:3.5}
#abGlow{stroke:var(--accent);stroke-width:12;opacity:.18;filter:blur(4px)}
#abMarble{filter:drop-shadow(0 0 6px rgba(160,230,255,.8))}
#abKicker{margin-top:14px;font-size:11px;font-weight:900;letter-spacing:.3em;color:var(--accent)}
#abTitle{margin-top:4px;font-size:clamp(44px,13vw,64px);font-weight:900;letter-spacing:.06em;line-height:1;margin-right:auto;
  background:linear-gradient(100deg,#fff 0%,#d9fbff 30%,var(--accent) 45%,#fff 52%,var(--accent2) 70%,#fff 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s ease-in-out infinite}
#abStats{display:flex;justify-content:center;gap:10px;margin-top:22px}
.abStat{flex:1 1 0;min-width:0;padding:12px 6px 10px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:4px}
.abStat b{font-size:clamp(22px,6.4vw,30px);font-weight:900;line-height:1;background:linear-gradient(180deg,#fff 30%,#bfefff);-webkit-background-clip:text;background-clip:text;color:transparent}
.abStat span{font-size:9px;font-weight:800;letter-spacing:.14em;line-height:1.35;color:var(--dim)}
#abScroll p{margin-top:16px;font-size:15px;line-height:1.55;font-weight:500;color:rgba(235,242,255,.86);text-align:left}
#abScroll #abLead{margin-top:22px;font-size:17px;font-weight:700;font-style:italic;color:#fff;text-align:center}
/* the rules and the making of, as cards: one column on a phone, up to three on a wide screen */
.abSec{margin-top:30px}
.abSec h3{margin:0 0 12px 4px;font-size:11px;font-weight:900;letter-spacing:.3em;color:var(--accent);text-align:left}
.abGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:12px}
.abCard{padding:16px 18px 18px;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);text-align:left}
.abCard .ic{width:26px;height:26px;color:var(--accent)}
.abCard h4{margin-top:8px;font-size:15px;font-weight:800;letter-spacing:.02em;line-height:1.3;color:#fff}
#abScroll .abCard p{margin-top:6px;font-size:13.5px;line-height:1.55;color:rgba(235,242,255,.8)}
@media (min-width:900px){ #abScroll{padding-left:calc(var(--sal) + 40px);padding-right:calc(var(--sar) + 40px)} #abScroll > #abLinks{max-width:640px;flex-direction:row} #abLinks a{flex:1 1 0} }
#abLinks{margin-top:28px;display:flex;flex-direction:column;gap:10px}
#abLinks a{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:18px;text-align:left;color:#fff;text-decoration:none;
  background:var(--glass);border:1px solid var(--glass-brd);transition:transform .25s cubic-bezier(.3,1.4,.4,1),border-color .25s}
#abLinks a:active{transform:scale(.97)}
#abLinks a:hover{border-color:rgba(255,255,255,.35)}
#abLinks .ic{width:26px;height:26px}
#abLinks span{display:flex;flex-direction:column;gap:2px}
#abLinks b{font-size:14px;font-weight:800;letter-spacing:.04em}
#abLinks small{font-size:12px;font-weight:600;color:var(--dim)}
#abFoot{margin-top:20px;font-size:11px;font-weight:800;letter-spacing:.2em;color:var(--dim)}
#btnAboutClose,#btnInstallClose{position:absolute;z-index:2;top:calc(var(--sat) + 10px);right:calc(var(--sar) + 12px);opacity:0;transform:scale(.6) rotate(-90deg);transition:opacity .3s,transform .5s cubic-bezier(.3,1.4,.4,1)}
#about.open #btnAboutClose,#install.open #btnInstallClose{opacity:1;transform:none;transition-delay:.35s}
/* Install guide: a phone plays the steps for this device (tap, menu, confirm, the icon lands on the
   home screen) while the list below lights up the step being shown. */
#install .appIc{display:block;flex:none;background:#0a0f2a url(icons/icon-192.png) center/cover}
#insKicker{font-size:11px;font-weight:900;letter-spacing:.3em;color:var(--accent)}
#insTitle{margin-top:6px;font-size:clamp(30px,9vw,42px);font-weight:900;letter-spacing:.03em;line-height:1.05}
#insScroll #insLead{margin-top:10px;font-size:15px;line-height:1.5;font-weight:500;color:rgba(235,242,255,.86)}
#insBody{margin-top:22px;display:flex;flex-direction:column;align-items:center;gap:22px}
#insPhone{position:relative;width:140px;height:280px;padding:6px;border-radius:26px;background:linear-gradient(160deg,#454b66,#12151f 60%);
  box-shadow:0 0 0 1px rgba(255,255,255,.2),0 24px 60px rgba(0,0,0,.55),0 0 50px rgba(78,242,255,.12)}
#insPhone .scr{position:relative;width:128px;height:268px;border-radius:20px;overflow:hidden;background:#05060d}
#insPhone .pg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  background:radial-gradient(circle at 50% 42%,rgba(78,242,255,.28),transparent 55%),linear-gradient(180deg,#171d44,#05060d)}
#insPhone .pg b{font-size:15px;font-weight:900;letter-spacing:.08em}
#insPhone .mb{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#bfe6ff 30%,#34405e 75%,#9fdcff);box-shadow:0 0 18px rgba(120,220,255,.6)}
#insPhone .bar{position:absolute;left:0;right:0;height:30px;display:flex;align-items:center;gap:6px;padding:0 6px 0 8px;background:rgba(32,36,56,.94)}
#insPhone.ios .bar{bottom:0;border-top:1px solid rgba(255,255,255,.08)}
#insPhone.android .bar{top:0;border-bottom:1px solid rgba(255,255,255,.08)}
#insPhone .url{flex:1;height:16px;border-radius:8px;background:rgba(255,255,255,.13)}
#insPhone .key{width:22px;height:22px;display:grid;place-items:center;border-radius:7px;color:#fff}
#insPhone .key .ic{width:15px;height:15px}
#insPhone .mn{position:absolute;display:flex;flex-direction:column;gap:5px;padding:8px;background:rgba(40,44,66,.97);box-shadow:0 10px 30px rgba(0,0,0,.5);
  opacity:0;transition:transform .45s cubic-bezier(.3,1.1,.4,1),opacity .3s}
#insPhone.ios .mn{left:0;right:0;bottom:0;height:150px;border-radius:14px 14px 0 0;transform:translateY(100%)}
#insPhone.android .mn{top:6px;right:6px;width:96px;border-radius:9px;transform-origin:100% 0;transform:scale(.3)}
#insPhone .mn i{height:14px;border-radius:4px;background:rgba(255,255,255,.1)}
#insPhone .hot{display:flex;align-items:center;gap:4px;border-radius:6px;font-size:7.5px;font-weight:900;letter-spacing:.02em;color:#fff;white-space:nowrap;overflow:hidden;background:rgba(255,255,255,.12)}
#insPhone .mn .hot{height:22px;padding:0 5px}
#insPhone .mn .ic{width:11px;height:11px}
#insPhone .dl{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(40,44,66,.98);box-shadow:0 12px 30px rgba(0,0,0,.5);
  opacity:0;transition:opacity .3s,transform .45s cubic-bezier(.3,1.2,.4,1)}
#insPhone.ios .dl{left:0;right:0;top:0;height:118px;border-radius:0 0 14px 14px;transform:translateY(-100%)}
#insPhone.android .dl{left:12px;right:12px;top:78px;height:112px;border-radius:12px;transform:scale(.85)}
#insPhone .dl .appIc{width:34px;height:34px;border-radius:9px}
#insPhone .dl b{font-size:9px;font-weight:900;letter-spacing:.06em}
#insPhone .dl .hot{position:absolute;padding:4px 8px;color:var(--accent)}
#insPhone.ios .dl .hot{top:8px;right:8px}
#insPhone.android .dl .hot{bottom:10px;right:10px}
#insPhone .hm{position:absolute;inset:0;padding:34px 12px;display:grid;grid-template-columns:repeat(4,1fr);gap:13px 11px;align-content:start;
  background:linear-gradient(160deg,#2b3d86,#6b2d73 60%,#191a3d);opacity:0;transition:opacity .45s}
#insPhone .hm i,#insPhone .hm .appIc{width:100%;height:18px;border-radius:5px}
#insPhone .hm i{background:rgba(255,255,255,.22)}
#insPhone .hm .appIc{transform:scale(0);box-shadow:0 0 0 1px rgba(255,255,255,.3),0 0 16px rgba(78,242,255,.8)}
#insPhone .fg{position:absolute;left:0;top:0;width:24px;height:24px;margin:-12px 0 0 -12px;opacity:0;transform:translate(64px,190px);
  transition:transform .7s cubic-bezier(.55,0,.2,1),opacity .3s}
#insPhone .fg::before,#insPhone .fg::after{content:"";position:absolute;inset:0;border-radius:50%}
#insPhone .fg::before{background:rgba(255,255,255,.62);box-shadow:0 0 0 2px rgba(255,255,255,.3),0 4px 12px rgba(0,0,0,.45)}
#insPhone .fg::after{border:2px solid #fff;opacity:0}
#insPhone.p0 .fg,#insPhone.p1 .fg,#insPhone.p2 .fg{opacity:1}
#insPhone.p0 .fg::before,#insPhone.p1 .fg::before,#insPhone.p2 .fg::before{animation:insPress 1.7s both}
#insPhone.p0 .fg::after,#insPhone.p1 .fg::after,#insPhone.p2 .fg::after{animation:insRipple 1.7s both}
#insPhone.ios.p0 .fg{transform:translate(113px,253px)}
#insPhone.ios.p1 .fg{transform:translate(48px,175px)}
#insPhone.ios.p2 .fg{transform:translate(106px,17px)}
#insPhone.android.p0 .fg{transform:translate(113px,15px)}
#insPhone.android.p1 .fg{transform:translate(72px,63px)}
#insPhone.android.p2 .fg{transform:translate(95px,172px)}
#insPhone.p0 .key{animation:insHot 1.7s both}
#insPhone.p1 .mn,#insPhone.p2 .dl{opacity:1;transform:none}
#insPhone.p1 .mn .hot,#insPhone.p2 .dl .hot{animation:insHot 1.7s both}
#insPhone.p3 .hm{opacity:1}
#insPhone.p3 .hm .appIc{animation:insPop .7s .35s cubic-bezier(.3,1.7,.4,1) both}
@keyframes insPress{0%,52%{transform:none}60%{transform:scale(.72)}72%,100%{transform:none}}
@keyframes insRipple{0%,56%{opacity:0;transform:scale(.6)}62%{opacity:.9}100%{opacity:0;transform:scale(2.2)}}
@keyframes insHot{0%,56%{background:rgba(255,255,255,.12);color:#fff}66%,100%{background:var(--accent);color:#04121a}}
@keyframes insPop{from{transform:scale(0) rotate(-25deg)}to{transform:none}}
#insSteps{list-style:none;width:100%;max-width:400px;display:flex;flex-direction:column;gap:10px;text-align:left}
#insSteps li{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
  transition:background .35s,border-color .35s,transform .5s cubic-bezier(.3,1.4,.4,1),box-shadow .35s}
#insSteps li.on{background:rgba(255,255,255,.1);border-color:var(--accent);transform:scale(1.025);box-shadow:0 0 22px rgba(78,242,255,.18)}
#insSteps .n{flex:none;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;font-size:13px;font-weight:900;background:rgba(255,255,255,.1);transition:background .35s,color .35s}
#insSteps li.on .n{background:var(--accent);color:#04121a}
#insSteps .ic{width:24px;height:24px;color:var(--accent)}
#insSteps span{display:flex;flex-direction:column;gap:2px;min-width:0}
#insSteps b{font-size:14px;font-weight:800;line-height:1.3}
#insSteps small{font-size:12px;font-weight:600;line-height:1.35;color:var(--dim)}
#insMore{margin-top:20px;text-align:center}
#insScroll #insHelp{margin-top:0;font-size:12px;line-height:1.5;text-align:center;color:var(--dim)}
#insMore .ghostBtn{margin-top:10px}
@media (prefers-reduced-motion:reduce){ #about,#about.open .abIn,#btnAboutClose,#install,#install.open .abIn,#btnInstallClose{transition:none;animation:none;opacity:1;transform:none;filter:none} }
#noGL{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;z-index:99;background:#05060d;font-weight:700}
#mLeft,#mRight{display:flex;flex-direction:column;align-items:center}
#optSlot{display:none}
#menu .bigBtn{margin:0 auto}
@media (orientation:portrait) and (max-height:700px){ #tagline{margin-top:4px} #modeBox{margin-top:12px} #menu .bigBtn{height:56px} .skins{gap:8px} .sw{width:40px;height:40px} .optRow{margin-top:10px} .optRow .seg button{min-height:34px} }
@media (orientation:landscape) and (max-height:640px){
  /* Landscape: two columns split at --sL. Left: title, tagline, mode switch (ABOUT and INSTALL in
     options). Right: PLAY, BEST and OPTIONS stacked on one axis; in options the settings panel
     slides in over exactly that column, so nothing on the left moves or gets covered. */
  #menu{--sL:max(40vw,calc(100vw - 440px))}
  #mLeft{top:0;bottom:0;left:calc(var(--sal) + 20px);right:calc(100vw - var(--sL) + 20px);display:flex;flex-direction:column;justify-content:center}
  #mRight{top:0;bottom:0;left:calc(var(--sL) + 20px);right:calc(var(--sar) + 20px);display:flex;flex-direction:column;justify-content:center}
  #mRight .bigBtn{max-width:320px}
  #optSlot{display:block;height:48px;margin-top:14px;flex:none}
  #mRight #permMsg{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 10px);margin:0}
  #btnOpts{left:var(--optX,76%);top:var(--optY,auto);bottom:auto;transition:background .3s,color .3s,transform .55s cubic-bezier(.3,1.15,.4,1)}
  #menu.opts #btnOpts{transform:translate(calc(-50% + var(--dX,0px)),var(--dY,0px))}   /* DONE glides to the middle of the top bar */
  #sheet{left:var(--sL);top:calc(var(--sat) + 64px);max-height:none;border-radius:26px 0 0 0;padding:14px calc(var(--sar) + 18px) calc(var(--sab) + 14px) 18px;transform:translateX(106%);
    display:flex;flex-direction:column}
  #sheet{width:auto;margin:0;right:0;border:0;border-top:1px solid rgba(255,255,255,.14);border-left:1px solid rgba(255,255,255,.1)}
  #sheetGrip{right:auto;bottom:0;width:14px;height:auto}
  #sheetGrip::before{top:50%;left:5px;width:5px;height:36px;margin:-18px 0 0}
  #sheetGrip:hover::before,#sheet.drag #sheetGrip::before{width:5px;height:48px;margin:-24px 0 0}
  .sheetIn{max-width:none;width:100%;margin:auto 0}
  /* every setting on one grid: the label, then its control, all with the same left and right edges */
  .optRow{display:grid;grid-template-columns:78px minmax(0,1fr);column-gap:12px;align-items:center;margin-top:10px}
  .optRow:first-child{margin-top:0}
  #tgKid{grid-column:1 / -1;width:100%}
  .optLbl{text-align:left;line-height:12px}                                  /* three lines at most, never taller than a control */
  .optRow .seg{width:100%}
  .optRow .seg button{flex:1 1 auto;min-width:0;padding:4px 6px;line-height:1.15;white-space:normal}
  #todSeg{width:100%}
  #todSeg button{padding:4px 4px}
  #ctrlSeg button{min-width:0;flex:1 1 0}
  .optRow > .skins{grid-column:1 / -1;align-items:stretch;gap:8px}
  .skinRow{gap:0}
  .skinRow .lbl{width:78px;margin-right:12px;flex:none;text-align:left;font-size:10px;letter-spacing:.24em;color:rgba(235,242,255,.6);text-shadow:none}
  .skinRow .sw + .sw{margin-left:auto}
  #sheet .skinName{margin-left:90px;text-align:center}
  #menu.opts #title{transform:none}
  #menu.opts #tagline{opacity:1;visibility:visible;transform:none}
  #title{font-size:max(40px,min(18vh,110px,calc((var(--sL) - var(--sal) - 40px) / 4.4)))}
  #modeSeg{width:296px;max-width:100%}
  #modeSeg button{width:auto;flex:1 1 0;min-width:0;padding:4px 6px;line-height:1.15;white-space:normal}
  .bigBtn{margin-top:0;height:52px;font-size:14px}
  .ghostBtn{min-height:44px;margin-top:10px;padding:8px 18px}
  .hint{margin-top:8px;font-size:12px}
  .skins{margin-top:10px;gap:6px}
  #modeBox{margin-top:12px}
  #abScroll,#insScroll{padding-top:calc(var(--sat) + 24px)}
  /* install guide: the phone on the left, the words and steps on the right */
  #insScroll{display:grid;grid-template-columns:auto minmax(0,420px);column-gap:36px;justify-content:center;align-content:start;text-align:left}
  #insScroll > *{max-width:none;margin-left:0;margin-right:0}
  #insBody{display:contents}
  #insScroll > .abIn:first-child{grid-column:2;grid-row:1}
  #insFig{grid-column:1;grid-row:1 / span 3;align-self:center}
  #insSteps{grid-column:2;grid-row:2;margin-top:14px}
  #insMore{grid-column:2;grid-row:3;margin-top:12px;display:flex;align-items:center;gap:14px;text-align:left}
  #insMore .ghostBtn{margin-top:0;flex:none}
  #insTitle{font-size:32px}
  #insScroll #insLead,#insScroll #insHelp{font-size:13px;text-align:left}
  #insSteps li{padding:8px 12px}
  #pause > *{max-width:380px}
  .sw{width:38px;height:38px}
  #permMsg{margin-top:8px;font-size:12px}
  #stScore .val{font-size:32px}
  #toasts{top:24%}
  #ovDist{font-size:clamp(44px,14vh,80px)}
  #over h2,#pause h2{font-size:clamp(30px,10vh,48px)}
  #pause .bigBtn{margin-top:14px}
  #over{flex-direction:row;gap:clamp(20px,5vw,56px)}                 /* two columns: the result on the left, the buttons on the right */
  #ovRes{flex:1 1 0;max-width:400px;min-width:0}
  #ovBtns{flex:1 1 0;max-width:340px;min-width:0}
  #ovBtns .bigBtn{margin-top:0}
  #record .txt{font-size:22px}
  #record{margin-top:6px}
  .volRow{margin-top:12px}
}
@media (orientation:landscape) and (max-height:640px) and (max-width:700px){
  #mLeft{left:calc(var(--sal) + 12px);right:calc(100vw - var(--sL) + 12px)}
  #modeSeg button{font-size:10px;letter-spacing:.02em;padding:4px 3px}
  #modeInfo{height:46px;font-size:11px;line-height:15px}
  .optRow{grid-template-columns:66px minmax(0,1fr);column-gap:10px}
  .optRow .seg button{font-size:11px;letter-spacing:.06em}
  .skinRow .lbl{width:66px;margin-right:10px}
  #sheet .skinName{margin-left:76px}
  .optLbl,.skinRow .lbl{letter-spacing:.14em}
}
@media (orientation:landscape) and (max-height:640px) and (max-width:600px){
  #sheet{padding-left:12px;padding-right:calc(var(--sar) + 12px)}
  .optRow{grid-template-columns:58px minmax(0,1fr);column-gap:8px}
  .skinRow .lbl{width:58px;margin-right:8px}
  #sheet .skinName{margin-left:66px}
  .optRow .seg button{font-size:10px;letter-spacing:.02em}
  #todSeg button{padding:4px 2px}
}
@media (orientation:landscape) and (max-height:400px){
  #sheet{top:calc(var(--sat) + 60px);padding-top:10px;padding-bottom:calc(var(--sab) + 10px)}
  .optRow{margin-top:6px}
  #tgKid{min-height:36px}
  .optRow .seg{padding:3px}
  .optRow .seg .pill{top:3px;bottom:3px}
  .optRow .seg button{min-height:32px}
  #sheet .sw{width:32px;height:32px;border-radius:10px}
  #sheet .sw.round{border-radius:50%}
  .optRow > .skins{gap:6px}
  #sheet .skinName{height:14px;line-height:14px;font-size:11px}
  #optLinks{gap:8px}
  #optLinks .tg{min-height:40px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="xfade"></canvas>

<div id="vignette"></div>
<div id="danger"></div>
<div id="starGlow"></div>
<div id="flash"></div>
<div id="joy"><i></i></div>
<div id="touchHint" class="hidden"></div>

<div id="hud">
  <div id="stats">
    <div class="col">
      <div class="stat" id="stDist"><span class="lbl">DISTANCE</span><span class="val num" id="hDist">0 m</span></div>
      <div class="stat" id="stBest"><span class="lbl">BEST</span><span class="val num" id="hBest">0 m</span></div>
    </div>
    <div class="stat" id="stScore"><span class="lbl">SCORE</span><span class="val num" id="hScore">0</span><span id="mult" class="num">×1</span></div>
    <div></div>
  </div>
  <div id="topBtns">
    <button class="icoBtn" id="btnPause" aria-label="Pause">❚❚</button>
  </div>
  <div id="speedo"><span class="v num" id="hSpeed">0</span><span class="u">KM/H</span><div id="speedBar"><i id="hSpeedBar"></i></div></div>
  <div id="power" role="button" aria-label="Star power"><div class="row"><span id="pwCoin" class="num">×1</span><span id="pwTxt"></span></div><div class="bar"><i id="pwFill"></i></div></div>
  <div id="fallWarn" aria-live="polite"><b><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path class="stk" d="M12 3.6l9.4 16.3H2.6z"/><path class="stk" d="M12 9.6v4.8"/><circle cx="12" cy="17.2" r="1.2"/></svg><span data-i18n="fallWarn"></span></b><small id="fwTxt"></small><div class="bar"><i id="fwBar"></i></div></div>
  <div id="toasts"></div>
</div>

<div class="screen intro" id="menu">
  <div id="menuTop">
    <div class="seg" id="langSeg"><i class="pill"></i><button data-lang="fr">FR</button><button data-lang="en">EN</button></div>
    <div class="tgRow"><button class="tg icon tgMusic" data-i18n-aria="music"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path class="stk" d="M8.6 17.4V6.2l11.2-2.7v11.4M8.6 9.6l11.2-2.7"/><ellipse cx="6" cy="17.6" rx="2.9" ry="2.3" transform="rotate(-18 6 17.6)"/><ellipse cx="17.2" cy="15" rx="2.9" ry="2.3" transform="rotate(-18 17.2 15)"/><path class="cut" d="M3.5 3.5l17 17"/><path class="stk slash" d="M3.5 3.5l17 17"/></svg></button><button class="tg icon tgSfx" data-i18n-aria="sfx"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.4 9h3.7l4.7-4c.6-.5 1.5-.1 1.5.7v12.6c0 .8-.9 1.2-1.5.7l-4.7-4H3.4c-.6 0-1-.4-1-1V10c0-.6.4-1 1-1z"/><path class="stk wave" d="M16.3 9.3a3.8 3.8 0 0 1 0 5.4"/><path class="stk wave" d="M19 6.6a7.6 7.6 0 0 1 0 10.8"/><path class="stk mute" d="M16.6 9.6l4.8 4.8M21.4 9.6l-4.8 4.8"/></svg></button></div>
  </div>
  <div id="mLeft">
    <div id="title">GYROLL</div>
    <div id="tagline">How far can you go?</div>
    <div id="modeBox">
      <div class="seg" id="modeSeg"><i class="pill"></i><button data-mode="random" data-i18n="modeRandom"></button><button data-mode="daily" data-i18n="modeDaily"></button></div>
      <div id="modeInfo"><span id="modeTxt"></span><button class="linkBtn hidden" id="btnNewTrack" data-i18n="newTrack"></button></div>
      <div id="optLinks">
        <button class="tg" id="btnAbout" aria-controls="about"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle class="stk" cx="12" cy="12" r="9.2"/><path class="stk" d="M12 11v5.6"/><circle cx="12" cy="7.6" r="1.35"/></svg><span data-i18n="about"></span></button>
        <button class="tg hidden" id="btnInstall" aria-controls="install"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect class="stk" x="6.5" y="2.6" width="11" height="18.8" rx="2.6"/><path class="stk" d="M12 7v7M9.2 11.3l2.8 2.8 2.8-2.8"/></svg><span data-i18n="install"></span></button>
      </div>
    </div>
  </div>
  <div id="mRight">
    <button class="bigBtn" id="btnPlay" data-i18n="play"></button>
    <div id="menuBest">BEST <span class="num" id="mBest">0 m</span></div>
    <div id="optSlot"></div>
    <div id="permMsg" class="hidden"></div>
  </div>
  <div id="sheet">
    <div id="sheetGrip" aria-hidden="true"></div>
    <div class="sheetIn">
      <div class="optRow" style="--i:0"><button class="tg" id="tgKid"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path class="stk" d="M12 2.9l7.4 2.8v5.5c0 4.6-3 8.5-7.4 9.9-4.4-1.4-7.4-5.3-7.4-9.9V5.7z"/><path class="stk" d="M8.6 12.1l2.4 2.4 4.5-4.6"/></svg><span data-i18n="kid"></span></button></div>
      <div class="optRow" id="ctrlRow" style="--i:1"><span class="optLbl" data-i18n="control"></span><div class="seg" id="ctrlSeg"><i class="pill"></i><button data-ctrl="tilt" data-i18n="ctrlTilt"></button><button data-ctrl="touch" data-i18n="ctrlTouch"></button></div></div>
      <div class="optRow" style="--i:2"><span class="optLbl" data-i18n="tod"></span><div class="seg" id="todSeg"><i class="pill"></i><button data-tod="real" data-i18n="todReal"></button><button data-tod="day" data-i18n="todDay"></button><button data-tod="night" data-i18n="todNight"></button><button data-tod="system" data-i18n="todSystem"></button></div></div>
      <div class="optRow" style="--i:3"><div class="skins" id="skinsMenu"></div></div>
    </div>
  </div>
  <button id="btnOpts" aria-controls="sheet" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path class="stk" d="M3.5 8h17M3.5 16h17"/><circle class="k1" cx="15" cy="8" r="2.8"/><circle class="k2" cx="9" cy="16" r="2.8"/></svg><span class="lb1" data-i18n="options"></span><span class="lb2" data-i18n="done"></span></button>
</div>

<div class="hidden" id="shareBox" role="dialog" aria-modal="true" aria-labelledby="shTitle" data-kind="">
  <div id="shPanel">
    <div id="shHead"><h3 id="shTitle" data-i18n="shTitle"></h3><button class="icoBtn" id="btnShClose" data-i18n-aria="close"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path class="stk" d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div id="shView"><canvas id="shCanvas"></canvas><video id="shVideo" class="hidden" playsinline muted loop controls></video></div>
    <div id="shSide">
